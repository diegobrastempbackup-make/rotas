<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dados</title>

<style>
body { background:#0F172A; color:white; font-family:Arial; }
.container { padding:20px; }
table { width:100%; border-collapse:collapse; margin-top:10px; }
th,td { border:1px solid #333; padding:5px; text-align:center; }
input { width:100%; background:#1F2937; border:none; color:white; }
button { margin-top:5px; padding:6px; background:#3A8DFF; border:none; color:white; cursor:pointer; }
</style>
</head>

<body>

<div class="container">
<button onclick="voltar()">⬅ Voltar</button>
<button onclick="salvar()">💾 Salvar</button>
<div id="tabelas"></div>
</div>

<script>
const tecnicos = ["Sibele","Empresa","Danilo","Jose Cicero","Welisson","Danilo BH","Thiago BH"];

function voltar(){
  window.location.href="/";
}

function hoje(){
  return new Date().toISOString().split("T")[0];
}

function criar(){
  const container = document.getElementById("tabelas");
  container.innerHTML = "";

  tecnicos.forEach(nome=>{
    container.innerHTML += `
      <h2>${nome}</h2>
      <table>
        <tr>
          <th>Data</th><th>KM Ini</th><th>KM Fim</th><th>KM</th>
          <th>Consumo</th><th>Abast Ant</th><th>Abast Atual</th>
          <th>Litros</th><th>Valor</th><th></th>
        </tr>
        <tbody id="${nome}"></tbody>
      </table>
      <button onclick="add('${nome}')">+ Linha</button>
    `;
  });
}

function linha(d={}){
  return `
  <tr>
    <td><input type="date" value="${d.data || hoje()}"></td>
    <td><input value="${d.kmIni || ''}" oninput="calc(this)"></td>
    <td><input value="${d.kmFim || ''}" oninput="calc(this)"></td>
    <td><input readonly value="${d.km || ''}"></td>
    <td><input readonly value="${d.consumo || ''}"></td>
    <td><input value="${d.abastAnt || ''}"></td>
    <td><input value="${d.abastAtual || ''}"></td>
    <td><input value="${d.litros || ''}" oninput="calc(this)"></td>
    <td><input value="${d.valor || ''}"></td>
    <td><button onclick="remover(this)">🗑️</button></td>
  </tr>
  `;
}

function add(nome){
  const tbody = document.getElementById(nome);
  const tr = document.createElement("tr");
  tr.innerHTML = linha();
  tbody.appendChild(tr);
}

function calc(el){
  const tr = el.closest("tr");
  const i = tr.querySelectorAll("input");

  const km = Number(i[2].value) - Number(i[1].value);
  i[3].value = km > 0 ? km : "";

  const consumo = (km > 0 && i[7].value) ? (km / i[7].value).toFixed(2) : "";
  i[4].value = consumo;
}

function remover(btn){
  btn.closest("tr").remove();
}

async function salvar(){
  let dados = [];

  tecnicos.forEach(nome=>{
    const linhas = document.querySelectorAll(`#${nome} tr`);

    linhas.forEach(l=>{
      const i = l.querySelectorAll("input");

      const registro = {
        tecnico: nome,
        data: i[0].value,
        km: Number(i[3].value),
        valor: Number(i[8].value)
      };

      if(registro.km || registro.valor){
        dados.push(registro);
      }
    });
  });

  if(dados.length===0){
    alert("Nenhum dado");
    return;
  }

  await fetch("/registro",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ dados })
  });

  alert("Salvo");
}

async function carregar(){
  const res = await fetch("/registros");
  const lista = await res.json();

  tecnicos.forEach(nome=>{
    document.getElementById(nome).innerHTML="";
  });

  lista.forEach(d=>{
    const tbody = document.getElementById(d.tecnico);
    if(tbody){
      const tr = document.createElement("tr");
      tr.innerHTML = linha(d);
      tbody.appendChild(tr);
    }
  });
}

async function init(){
  criar();
  await carregar();
}

init();
</script>

</body>
</html>
