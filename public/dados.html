<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dados - NERI</title>

<style>
body {
  background: #0F172A;
  color: white;
  font-family: Arial, sans-serif;
  margin: 0;
}

.container {
  padding: 25px;
  max-width: 1400px;
  margin: 0 auto;
}

.topo {
  display: flex;
  gap: 12px;
  margin-bottom: 30px;
  flex-wrap: wrap;
  align-items: center;
}

table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 8px;
  margin-top: 15px;
}

th {
  color: #94A3B8;
  font-size: 13px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 10px;
  text-align: center;
}

td {
  padding: 0 4px;
}

input {
  width: 100%;
  background: #1E293B;
  border: 1px solid rgba(255, 255, 255, 0.05);
  color: white;
  padding: 8px;
  border-radius: 6px;
  box-sizing: border-box;
  text-align: center;
}

input:focus {
  outline: none;
  border-color: #3B82F6;
}

.btn {
  background: #2563EB;
  color: white;
  border: none;
  padding: 10px 20px;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
}

.bloco-tecnico {
  background: #1E293B;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 25px;
  border: 1px solid rgba(255, 255, 255, 0.03);
}

.nome-tecnico {
  font-size: 18px;
  font-weight: bold;
  color: #F8FAFC;
  margin-bottom: 15px;
  border-left: 4px solid #3B82F6;
  padding-left: 10px;
}
</style>
</head>
<body>

<div class="container">
  
  <div class="topo">
    <button class="btn" style="background:#475569;" onclick="window.location.href='/index.html'">⬅ Voltar Dashboard</button>
    <input type="month" id="mesFiltro" style="width:auto;" onchange="filtrarMes()">
    <button class="btn" style="background:#10B981;" onclick="salvarTudo()">💾 Salvar Lançamentos do Mês</button>
  </div>

  <div id="formularioDinamicoTecnicos"></div>

</div>

<script>
const token = localStorage.getItem("token");
let listaTecnicosData = []; // Recebido dinamicamente via API
let cacheHistoricoCompleto = [];

function obtenerMesAtual(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0');
}

// CARREGA A LISTA DE TÉCNICOS DIRETO DO MONGO ATLAS E EXUTA O DESENHO DA TELA
async function carregarTecnicosData() {
  try {
    const res = await fetch("/api/tecnicos", {
      headers: { "Authorization": "Bearer " + token }
    });
    if(res.ok) {
      listaTecnicosData = await res.json();
    }
  } catch (err) {
    console.error(err);
  }
}

// GERA OS BLOCOS DE INPUTS APENAS PARA OS TÉCNICOS ATIVOS NO MÊS SELECIONADO
function criarFormulariosDinamicos() {
  const mesSelecionado = document.getElementById("mesFiltro").value;
  const container = document.getElementById("formularioDinamicoTecnicos");
  container.innerHTML = "";

  // Aplica regra linear temporal idêntica ao dashboard
  const filtrados = listaTecnicosData.filter(t => {
    return (t.mesInicio || "2000-01") <= mesSelecionado && (!t.mesEncerramento || t.mesEncerramento >= mesSelecionado);
  });

  if(filtrados.length === 0) {
    container.innerHTML = "<p style='color:#94A3B8; text-align:center;'>Nenhum técnico ativo configurado para este período.</p>";
    return;
  }

  filtrados.forEach(tecnico => {
    const div = document.createElement("div");
    div.className = "bloco-tecnico";
    div.innerHTML = `
      <div class="nome-tecnico">${tecnico.nome.toUpperCase()}</div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th style="width:14%">Data</th>
              <th style="width:20%">KM Rodado</th>
              <th style="width:20%">Litros</th>
              <th style="width:20%">Valor Gasto</th>
              <th style="width:10%">Ação</th>
            </tr>
          </thead>
          <tbody data-tecnico="${tecnico.nome}"></tbody>
        </table>
      </div>
      <button class="btn" style="background:#475569; font-size:12px; padding:6px 12px; margin-top:10px;" onclick="adicionarNovaLinhaVazia('${tecnico.nome}')">+ Nova Linha</button>
    `;
    container.appendChild(div);
  });
}

function linha(item){
  return `
    <td><input type="date" class="inp-data" value="${item.data || ''}" data-id="${item._id || ''}"></td>
    <td><input type="number" class="inp-km" value="${item.kmRodado || ''}" placeholder="0"></td>
    <td><input type="number" class="inp-litros" value="${item.litros || ''}" placeholder="0.00" step="0.01"></td>
    <td><input type="number" class="inp-valor" value="${item.valor || ''}" placeholder="0.00" step="0.01"></td>
    <td style="text-align:center;"><button class="btn" style="background:#EF4444; padding:6px 12px;" onclick="deletarLinhaRegistro(this, '${item._id || ''}')">❌</button></td>
  `;
}

function adicionarNovaLinhaVazia(nomeTecnico) {
  const tbody = document.querySelector(`[data-tecnico="${nomeTecnico}"]`);
  if(!tbody) return;
  const tr = document.createElement("tr");
  tr.innerHTML = linha({ tecnico: nomeTecnico, data: '', kmRodado: '', litros: '', valor: '', _id: '' });
  tbody.appendChild(tr);
}

async function carregar(mes){
  try {
    const res = await fetch("/api/registros", {
      headers: { "Authorization": "Bearer " + token }
    });
    
    if (!res.ok) return;

    const listaCompleta = await res.json();
    cacheHistoricoCompleto = [...listaCompleta];
    let listaFiltrada = [...listaCompleta];

    if(mes){
      listaFiltrada = listaFiltrada.filter(item=>{
        if(!item.data) return false;
        return String(item.data).startsWith(mes);
      });
    }

    // Limpa tabelas renderizadas
    listaTecnicosData.forEach(t=>{
      const tbody = document.querySelector(`[data-tecnico="${t.nome}"]`);
      if(tbody) tbody.innerHTML = "";
    });

    // Popula tabelas com dados salvos no Mongo
    listaFiltrada.forEach(item=>{
      const tbody = document.querySelector(`[data-tecnico="${item.tecnico}"]`);
      if(tbody){
        const tr = document.createElement("tr");
        tr.innerHTML = linha(item); 
        tbody.appendChild(tr);
      }
    });
  } catch (erro) {
    console.error(erro);
  }
}

async function salvarTudo(){
  const dados = [];
  
  // Seleciona os blocos criados dinamicamente
  listaTecnicosData.forEach(t => {
    const tbody = document.querySelector(`[data-tecnico="${t.nome}"]`);
    if(!tbody) return;

    const linhas = tbody.querySelectorAll("tr");
    linhas.forEach(tr => {
      const inpData = tr.querySelector(".inp-data");
      const inpKm = tr.querySelector(".inp-km");
      const inpLitros = tr.querySelector(".inp-litros");
      const inpValor = tr.querySelector(".inp-valor");

      if(inpData && inpData.value) {
        const payload = {
          tecnico: t.nome,
          data: inpData.value,
          kmRodado: inpKm.value ? Number(inpKm.value) : "",
          litros: inpLitros.value ? Number(inpLitros.value) : "",
          valor: inpValor.value ? Number(inpValor.value) : ""
        };
        if(inpData.dataset.id) {
          payload._id = inpData.dataset.id;
        }
        dados.push(payload);
      }
    });
  });

  try {
    const res = await fetch("/registro", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({ dados })
    });
    const r = await res.json();
    if(res.ok) {
      alert("Lançamentos salvos com sucesso!");
      const mes = document.getElementById("mesFiltro").value;
      await carregar(mes);
    } else {
      alert(r.erro);
    }
  } catch (err) {
    alert("Erro ao conectar");
  }
}

async function deletarLinhaRegistro(botao, id) {
  if(!id) {
    botao.closest("tr").remove();
    return;
  }
  if(!confirm("Excluir definitivamente este registro do banco?")) return;

  try {
    const res = await fetch(`/registro/${id}`, {
      method: "DELETE",
      headers: { "Authorization": "Bearer " + token }
    });
    if(res.ok) {
      botao.closest("tr").remove();
    }
  } catch (err) {
    alert("Erro ao excluir");
  }
}

function filtrarMes(){
  const mes = document.getElementById("mesFiltro").value;
  criarFormulariosDinamicos();
  carregar(mes);
}

async function iniciar(){
  const mesAtual = obtenerMesAtual();
  document.getElementById("mesFiltro").value = mesAtual;
  
  await carregarTecnicosData();
  criarFormulariosDinamicos();
  await carregar(mesAtual);
}

iniciar();
</script>
</body>
</html>
