<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dados</title>

<style>
body { background:#0F172A; color:white; font-family:Arial; }
.container { padding:20px; }
table { width:100%; border-collapse:collapse; margin-top:10px; }
th,td { border:1px solid #333; padding:5px; text-align:center; }
input { width:100%; background:#1F2937; border:none; color:white; }
button { margin-top:5px; padding:5px; background:#3A8DFF; border:none; color:white; cursor:pointer; }
</style>
</head>

<body>

<div class="container">
<button onclick="voltar()">⬅ Voltar</button>
<button onclick="salvar()">💾 Salvar</button>
<div id="tabelas"></div>
</div>

<script>
const tecnicos = ["Sibele","Empresa","Danilo","José Cicero","Welisson","Danilo BH","Thiago BH"];

function voltar(){
  window.location.href="/";
}

function hoje(){
  return new Date().toISOString().split("T")[0];
}

function criar(){
  let c = document.getElementById("tabelas");
  c.innerHTML = "";

  tecnicos.forEach(nome=>{
    c.innerHTML += `
    <h2>${nome}</h2>
    <table>
    <tr>
    <th>Data</th><th>KM Ini</th><th>KM Fim</th><th>KM</th>
    <th>Consumo</th><th>Litros</th><th>Valor</th><th></th>
    </tr>
    <tbody id="${nome}"></tbody>
    </table>
    <button onclick="add('${nome}')">+ Linha</button>
    `;
  });

  carregar();
}

function linha(dados={}){
  return `
  <tr>
  <td><input type="date" value="${dados.data || hoje()}"></td>
  <td><input oninput="calc(this)"></td>
  <td><input oninput="calc(this)"></td>
  <td><input readonly></td>
  <td><input readonly></td>
  <td><input oninput="calc(this)"></td>
  <td><input></td>
  <td><button onclick="remover(this)">🗑️</button></td>
  </tr>
  `;
}

function add(nome){
  let tr = document.createElement("tr");
  tr.innerHTML = linha();
  document.getElementById(nome).appendChild(tr);
}

function calc(el){
  let l = el.closest("tr");
  let i = l.querySelectorAll("input");

  let km = Number(i[2].value) - Number(i[1].value);
  i[3].value = km > 0 ? km : "";

  let consumo = km > 0 && i[5].value ? (km / i[5].value).toFixed(2) : "";
  i[4].value = consumo;
}

function remover(btn){
  btn.closest("tr").remove();
}

async function salvar(){
  let dados = [];

  tecnicos.forEach(nome=>{
    let linhas = document.querySelectorAll(`#${nome} tr`);

    linhas.forEach(l=>{
      let i = l.querySelectorAll("input");

      let data = i[0].value;
      let km = Number(i[3].value);
      let valor = Number(i[6].value);

      if(data && (km > 0 || valor > 0)){
        dados.push({ tecnico:nome, data, km, valor });
      }
    });
  });

  if(dados.length === 0){
    alert("Nada para salvar");
    return;
  }

  await fetch("/registro",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ dados })
  });

  alert("Salvo com sucesso!");
}

// carregar banco
async function carregar(){
  const res = await fetch("/registros");
  const lista = await res.json();

  lista.forEach(item=>{
    let tr = document.createElement("tr");
    tr.innerHTML = linha(item);
    document.getElementById(item.tecnico).appendChild(tr);
  });
}

criar();
</script>

</body>
</html>
