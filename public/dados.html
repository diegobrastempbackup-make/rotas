<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dados</title>

<style>

body{
  background:#0F172A;
  color:white;
  font-family:Arial;
  margin:0;
}

.container{
  padding:20px;
}

.topo{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

button{
  padding:8px 15px;
  background:#3A8DFF;
  border:none;
  border-radius:5px;
  color:white;
  cursor:pointer;
}

button:hover{
  opacity:0.9;
}

input{
  background:#1F2937;
  border:none;
  color:white;
  padding:6px;
  width:100%;
  box-sizing:border-box;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  margin-bottom:20px;
}

th,td{
  border:1px solid #333;
  padding:5px;
  text-align:center;
}

h2{
  background:#111827;
  padding:10px;
  border-radius:5px;
}

</style>
</head>

<body>

<div class="container">

<div class="topo">

<button onclick="voltar()">
⬅ Voltar
</button>

<button onclick="salvar()">
💾 Salvar
</button>

<input type="month" id="mesFiltro">

<button onclick="filtrarMes()">
🔍 Buscar
</button>

<button onclick="mostrarTudo()">
♻ Mostrar Tudo
</button>

</div>

<div id="tabelas"></div>

</div>

<script>

// 🔥 TÉCNICOS COM ID LIMPO
const tecnicos = [

  { nome:"Sibele", id:"sibele" },

  { nome:"Empresa", id:"empresa" },

  { nome:"Danilo", id:"danilo" },

  { nome:"José Cicero", id:"jose_cicero" },

  { nome:"Welisson", id:"welisson" },

  { nome:"Danilo BH", id:"danilo_bh" },

  { nome:"Thiago BH", id:"thiago_bh" }

];

// 🔥 VOLTAR
function voltar(){

  window.location.href = "/";

}

// 🔥 DATA ATUAL
function hoje(){

  return new Date()
    .toISOString()
    .split("T")[0];

}

// 🔥 CRIAR TABELAS
function criar(){

  const container =
    document.getElementById("tabelas");

  container.innerHTML = "";

  tecnicos.forEach(t=>{

    const bloco =
      document.createElement("div");

    bloco.innerHTML = `

      <h2>${t.nome}</h2>

      <table>

        <thead>

          <tr>

            <th>Data</th>

            <th>KM Ini</th>

            <th>KM Fim</th>

            <th>KM</th>

            <th>Consumo</th>

            <th>Abast Ant</th>

            <th>Abast Atual</th>

            <th>Litros</th>

            <th>Valor</th>

            <th></th>

          </tr>

        </thead>

        <tbody id="${t.id}"></tbody>

      </table>

      <button onclick="addLinha('${t.id}')">

      + Linha

      </button>

      <hr>

    `;

    container.appendChild(bloco);

  });

}

// 🔥 TEMPLATE LINHA
function linha(d = {}){

  return `

    <tr>

      <td>

        <input
        type="date"
        value="${d.data || hoje()}">

      </td>

      <td>

        <input
        value="${d.kmIni || ''}"
        oninput="calc(this)">

      </td>

      <td>

        <input
        value="${d.kmFim || ''}"
        oninput="calc(this)">

      </td>

      <td>

        <input
        readonly
        value="${d.km || ''}">

      </td>

      <td>

        <input
        readonly
        value="${d.consumo || ''}">

      </td>

      <td>

        <input
        value="${d.abastAnt || ''}">

      </td>

      <td>

        <input
        value="${d.abastAtual || ''}">

      </td>

      <td>

        <input
        value="${d.litros || ''}"
        oninput="calc(this)">

      </td>

      <td>

        <input
        value="${d.valor || ''}">

      </td>

      <td>

        <button onclick="remover(this)">
        🗑️
        </button>

      </td>

    </tr>

  `;

}

// 🔥 ADD LINHA
function addLinha(id){

  const tbody =
    document.getElementById(id);

  const tr =
    document.createElement("tr");

  tr.innerHTML = linha();

  tbody.appendChild(tr);

}

// 🔥 CALCULAR
function calc(el){

  const tr = el.closest("tr");

  const i = tr.querySelectorAll("input");

  const kmIni =
    Number(i[1].value);

  const kmFim =
    Number(i[2].value);

  const litros =
    Number(i[7].value);

  const km = kmFim - kmIni;

  i[3].value =
    km > 0 ? km : "";

  const consumo =

    (km > 0 && litros > 0)

    ? (km / litros).toFixed(2)

    : "";

  i[4].value = consumo;

}

// 🔥 REMOVER
function remover(btn){

  btn.closest("tr").remove();

}

// 🔥 SALVAR
async function salvar(){

  let dados = [];

  tecnicos.forEach(t=>{

    const linhas =

      document.querySelectorAll(
        `#${t.id} tr`
      );

    linhas.forEach(l=>{

      const i =
        l.querySelectorAll("input");

      const registro = {

        tecnico: t.nome,

        data: i[0].value,

        kmIni:
          Number(i[1].value) || 0,

        kmFim:
          Number(i[2].value) || 0,

        km:
          Number(i[3].value) || 0,

        consumo:
          Number(i[4].value) || 0,

        abastAnt:
          i[5].value || "",

        abastAtual:
          i[6].value || "",

        litros:
          Number(i[7].value) || 0,

        valor:
          parseFloat(
            i[8].value
              .replace(",", ".")
          ) || 0

      };

      // 🔥 IGNORA LINHAS VAZIAS
      const temDados =

        registro.kmIni > 0 ||

        registro.kmFim > 0 ||

        registro.km > 0 ||

        registro.valor > 0 ||

        registro.litros > 0 ||

        registro.abastAnt !== "" ||

        registro.abastAtual !== "";

      if(temDados){

        dados.push(registro);

      }

    });

  });

  if(dados.length === 0){

    alert("Nenhum dado preenchido");

    return;

  }

  const res = await fetch("/registro", {

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body: JSON.stringify({ dados })

  });

  if(res.ok){

    alert("Salvo com sucesso!");

    carregar();

  }else{

    alert("Erro ao salvar");

  }

}

// 🔥 CARREGAR
async function carregar(mes = ""){

  const res =
    await fetch("/registros");

  let lista =
    await res.json();

  // 🔥 FILTRO MÊS
  if(mes){

    lista = lista.filter(item=>{

      if(!item.data)
        return false;

      return item.data
        .startsWith(mes);

    });

  }

  // 🔥 LIMPA TABELAS
  tecnicos.forEach(t=>{

    const tbody =
      document.getElementById(t.id);

    if(tbody){

      tbody.innerHTML = "";

    }

  });

  // 🔥 CARREGA REGISTROS
  lista.forEach(item=>{

    const tecnico = tecnicos.find(

      t => t.nome === item.tecnico

    );

    if(!tecnico) return;

    const tbody =
      document.getElementById(
        tecnico.id
      );

    if(tbody){

      const tr =
        document.createElement("tr");

      tr.innerHTML =
        linha(item);

      tbody.appendChild(tr);

    }

  });

}

// 🔥 FILTRAR MÊS
function filtrarMes(){

  const mes =

    document
      .getElementById("mesFiltro")
      .value;

  carregar(mes);

}

// 🔥 MOSTRAR TUDO
function mostrarTudo(){

  document
    .getElementById("mesFiltro")
    .value = "";

  carregar();

}

// 🔥 INIT
async function iniciar(){

  criar();

  await carregar();

}

iniciar();

</script>

</body>
</html>
