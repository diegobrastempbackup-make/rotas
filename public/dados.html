<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dados</title>

<style>
body {
  background: #0F172A;
  color: white;
  font-family: Arial, sans-serif;
  margin: 0;
}

.container {
  padding: 25px;
  max-width: 1400px;
  margin: 0 auto;
}

.topo {
  display: flex;
  gap: 12px;
  margin-bottom: 30px;
  flex-wrap: wrap;
  align-items: center;
}

/* Estilização da Tabela */
table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 8px; /* Cria um espaçamento elegante entre as linhas */
  margin-top: 15px;
}

th {
  color: #94A3B8;
  font-size: 13px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 10px;
  text-align: center;
}

td {
  padding: 0 4px;
}

/* Inputs Modernizados */
input {
  width: 100%;
  background: #1E293B;
  border: 1px solid rgba(255, 255, 255, 0.05);
  color: white;
  padding: 8px 10px;
  box-sizing: border-box;
  border-radius: 6px;
  text-align: center;
  font-size: 14px;
  transition: all 0.2s ease;
}

/* Efeito de foco ao digitar */
input:focus {
  outline: none;
  border-color: #3B82F6;
  box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
  background: #1E293B;
}

/* Estilo para campos automáticos (Bloqueados) */
input[readonly] {
  background: rgba(15, 23, 42, 0.6);
  color: #64748B;
  border-color: transparent;
  cursor: not-allowed;
  font-weight: bold;
}

/* Inputs de data customizados */
input[type="date"]::-webkit-calendar-picker-indicator,
input[type="month"]::-webkit-calendar-picker-indicator {
  filter: invert(1); /* Deixa o ícone do calendário branco */
  cursor: pointer;
}

/* Botões do Topo e Gerais */
button {
  padding: 10px 16px;
  background: #2563EB;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 8px;
  font-weight: bold;
  font-size: 14px;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}

button:hover {
  background: #3B82F6;
  transform: translateY(-1px);
}

/* Botão + Linha específico */
button[onclick^="addLinha"] {
  background: rgba(59, 130, 246, 0.1);
  border: 1px dashed #3B82F6;
  color: #60A5FA;
  margin-top: 12px;
  padding: 8px 20px;
}

button[onclick^="addLinha"]:hover {
  background: #3B82F6;
  color: white;
  border-style: solid;
}

/* Botão de Lixeira */
td button {
  background: rgba(239, 68, 68, 0.1) !important;
  border: 1px solid rgba(239, 68, 68, 0.2) !important;
  color: #EF4444;
  padding: 6px 10px !important;
  border-radius: 6px !important;
  margin: 0 auto;
}

td button:hover {
  background: #EF4444 !important;
  color: white !important;
  transform: scale(1.05);
}

/* Títulos dos Técnicos */
h2 {
  margin-top: 45px;
  margin-bottom: 5px;
  color: #F8FAFC;
  font-size: 22px;
  border-left: 4px solid #3B82F6;
  padding-left: 12px;
}
</style>
</head>

<body>

<div class="container">
  <div class="topo">
    <button onclick="voltarAoDashboard()">⬅ Voltar</button>
    <button onclick="salvar()">💾 Salvar</button>
    <input type="month" id="mesFiltro" style="width: auto; display: inline-block;">
    <button onclick="filtrarMes()">🔍 Buscar</button>
    <button onclick="mostrarTudo()">♻ Mostrar Mês Atual</button>
  </div>

  <div id="tabelas"></div>
</div>

<script>
// ⏱️ SISTEMA DE CONTROLE DE INATIVIDADE (5 MINUTOS)
let temporizadorInatividade;

function resetarTemporizador() {
  clearTimeout(temporizadorInatividade);
  temporizadorInatividade = setTimeout(efetuarAutoLogout, 5 * 60 * 1000);
}

function efetuarAutoLogout() {
  alert("Sessão expirada por inatividade. Por favor, faça login novamente.");
  localStorage.removeItem("token");
  localStorage.removeItem("usuarioLogado");
  localStorage.removeItem("usuarioTipo");
  window.location.replace("/login.html");
}

window.onload = resetarTemporizador;
window.onmousemove = resetarTemporizador;
window.onmousedown = resetarTemporizador;
window.ontouchstart = resetarTemporizador;
window.onclick = resetarTemporizador;     
window.onkeydown = resetarTemporizador;   

const tecnicos = [
  "Sibele",
  "Empresa",
  "Danilo",
  "José Cicero",
  "Alex",
  "Danilo BH",
  "Thiago BH"
];

function obterMesAtual(){
  const hoje = new Date();
  const ano = hoje.getFullYear();
  const mes = String(hoje.getMonth() + 1).padStart(2,"0");
  return `${ano}-${mes}`;
}

function hoje(){
  return new Date().toISOString().split("T")[0];
}

function criar(){
  const container = document.getElementById("tabelas");
  container.innerHTML = "";

  tecnicos.forEach(nome=>{
    const bloco = document.createElement("div");
    bloco.innerHTML = `
      <h2>${nome}</h2>
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>KM Ini</th>
            <th>KM Fim</th>
            <th>KM</th>
            <th>Consumo</th>
            <th>Abast Ant</th>
            <th>Abast Atual</th>
            <th>Litros</th>
            <th>Valor</th>
            <th></th>
          </tr>
        </thead>
        <tbody data-tecnico="${nome}"></tbody>
      </table>
      <button onclick="addLinha('${nome}')">+ Linha</button>
    `;
    container.appendChild(bloco);
  });
}

function linha(d = {}){
  const dataFormatada = d.data ? String(d.data).split("T")[0] : hoje();

  return `
  <tr>
    <td>
      <input type="date" value="${dataFormatada}">
    </td>
    <td>
      <input value="${d.kmIni || ''}" oninput="calc(this)">
    </td>
    <td>
      <input value="${d.kmFim || ''}" oninput="calc(this)">
    </td>
    <td>
      <input readonly value="${d.km || ''}">
    </td>
    <td>
      <input readonly value="${d.consumo || ''}">
    </td>
    <td>
      <input value="${d.abastAnt || ''}">
    </td>
    <td>
      <input value="${d.abastAtual || ''}" oninput="calc(this)">
    </td>
    <td>
      <input value="${d.litros || ''}" oninput="calc(this)">
    </td>
    <td>
      <input value="${d.valor || ''}">
    </td>
    <td>
      <button onclick="remover(this)">🗑️</button>
    </td>
  </tr>
  `;
}

function addLinha(nome){
  const tbody = document.querySelector(`[data-tecnico="${nome}"]`);
  const tr = document.createElement("tr");
  tr.innerHTML = linha();
  tbody.appendChild(tr);
}

function calc(el){
  const tr = el.closest("tr");
  const i = tr.querySelectorAll("input");
  const kmIni = Number(i[1].value);
  const kmFim = Number(i[2].value);
  const abastAtualInput = i[6];
  const abastAntInput = i[5];
  const litros = Number(i[7].value);

  const km = kmFim - kmIni;
  i[3].value = km > 0 ? km : "";

  if (abastAtualInput.value.trim() !== "") {
    const tbody = tr.closest("tbody");
    const todasAsLinhas = Array.from(tbody.querySelectorAll("tr"));
    const indexAtual = todasAsLinhas.indexOf(tr);
    
    let encontrouAnterior = false;
    for (let j = indexAtual - 1; j >= 0; j--) {
      const inputsLinhaAnt = todasAsLinhas[j].querySelectorAll("input");
      const valorAbastAtualLinhaAnt = inputsLinhaAnt[6].value.trim();
      
      if (valorAbastAtualLinhaAnt !== "") {
        abastAntInput.value = valorAbastAtualLinhaAnt;
        encontrouAnterior = true;
        break;
      }
    }
    if (!encontrouAnterior && abastAntInput.value === "") {
      abastAntInput.value = "";
    }
  } else {
    abastAntInput.value = "";
  }

  const consumo = (km > 0 && litros > 0) ? (km / litros).toFixed(2) : "";
  i[4].value = consumo;
}

function remover(btn){
  btn.closest("tr").remove();
}

function obterChaveRegistro(r) {
  const dataLimpa = String(r.data || '').split('T')[0];
  const kmIni = Number(r.kmIni) || 0;
  const kmFim = Number(r.kmFim) || 0;
  const abastAtual = String(r.abastAtual || '').trim();
  const litros = Number(r.litros) ? Number(r.litros).toFixed(2) : "0.00";
  const valor = Number(r.valor) ? Number(r.valor).toFixed(2) : "0.00";
  return `${r.tecnico || ''}_${dataLimpa}_${kmIni}_${kmFim}_${abastAtual}_${litros}_${valor}`;
}

// 🔥 NOVO SALVAR: PUXA O HISTÓRICO COMPLETO DO BANCO, CORESSE EXCLUSIVAMENTE O MÊS FILTRADO E AJUSTA O ENVIO TOTAL
async function salvar(){
  const mesAtual = document.getElementById("mesFiltro").value;
  if(!mesAtual){
    alert("Selecione um mês");
    return;
  }

  // 1. Busca TUDO o que existe hoje no servidor primeiro
  const resBanco = await fetch("/registros");
  const bancoCompleto = await resBanco.json();

  // 2. Mantém intactos os registros que NÃO pertencem ao mês atual filtrado
  let dadosPreservados = bancoCompleto.filter(item => !item.data || !item.data.startsWith(mesAtual));

  // 3. Captura o que está na tela AGORA (onde você já apagou as lixeiras do dia 5 e 7)
  let dadosDaTela = [];
  const mapaLimpeza = new Set();

  tecnicos.forEach(nome=>{
    const linhas = document.querySelectorAll(`[data-tecnico="${nome}"] tr`);
    linhas.forEach(l=>{
      const i = l.querySelectorAll("input");
      const data = i[0].value;

      if(!data.startsWith(mesAtual)){
        return;
      }

      const registro = {
        tecnico: nome,
        data: data,
        kmIni: Number(i[1].value) || 0,
        kmFim: Number(i[2].value) || 0,
        km: Number(i[3].value) || 0,
        consumo: Number(i[4].value) || 0,
        abastAnt: i[5].value || "",
        abastAtual: i[6].value || "",
        litros: Number(i[7].value) || 0,
        valor: parseFloat(i[8].value.replace(",", ".")) || 0
      };

      const temDado =
        registro.km > 0 ||
        registro.valor > 0 ||
        registro.litros > 0 ||
        registro.abastAnt !== "" ||
        registro.abastAtual !== "";

      if(temDado){
        const tokenLinha = obterChaveRegistro(registro);
        if(!mapaLimpeza.has(tokenLinha)){
          dadosDaTela.push(registro);
          mapaLimpeza.add(tokenLinha);
        }
      }
    });
  });

  // 4. Une o passado intocado com a tela limpa atualizada
  const dadosFinaisSuperLimpos = [...dadosPreservados, ...dadosDaTela];

  console.log("GRAVANDO PACOTE TOTAL RECONSTRUÍDO:", dadosFinaisSuperLimpos);

  // 5. Envia o pacote completo consolidado para substituir o array empilhado do backend
  await fetch("/registro", {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body: JSON.stringify({ dados: dadosFinaisSuperLimpos })
  });

  alert("Tabela limpa e sincronizada no servidor!");
  await carregar(mesAtual);
}

// 🔥 CARREGAR
async function carregar(mes = ""){
  const res = await fetch("/registros");
  let lista = await res.json();

  lista.sort((a,b)=>{
    if(!a.data || !b.data) return 0;
    return new Date(a.data) - new Date(b.data);
  });

  if(mes){
    lista = lista.filter(item=>{
      if(!item.data) return false;
      return item.data.startsWith(mes);
    });
  }

  tecnicos.forEach(nome=>{
    const tbody = document.querySelector(`[data-tecnico="${nome}"]`);
    if(tbody){
      tbody.innerHTML = "";
    }
  });

  const chavesRenderizadas = new Set();

  lista.forEach(item=>{
    const tbody = document.querySelector(`[data-tecnico="${item.tecnico}"]`);
    if(tbody){
      const chaveItem = obterChaveRegistro(item);
      
      if (!chavesRenderizadas.has(chaveItem)) {
        const tr = document.createElement("tr");
        tr.innerHTML = linha(item);
        tbody.appendChild(tr);
        chavesRenderizadas.add(chaveItem);
      }
    }
  });
}

function filtrarMes(){
  const mes = document.getElementById("mesFiltro").value;
  carregar(mes);
}

function mostrarTudo(){
  const mesAtual = obterMesAtual();
  document.getElementById("mesFiltro").value = mesAtual;
  carregar(mesAtual);
}

async function iniciar(){
  criar();
  const mesAtual = obterMesAtual();
  document.getElementById("mesFiltro").value = mesAtual;
  await carregar(mesAtual);
}

iniciar();
</script>

<script>
  function voltarAoDashboard() {
    const token = localStorage.getItem("token");
    if (token) {
      window.location.href = "/index.html";
    } else {
      window.location.replace("/login.html");
    }
  }
</script>

</body>
</html>
