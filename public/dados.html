<!DOCTYPE html>
<html lang=\"pt-br\">
<head>
<meta charset="UTF-8">
<title>Dados - NERI</title>

<style>
body {
  background: #0F172A;
  color: white;
  font-family: Arial, sans-serif;
  margin: 0;
}

.container {
  padding: 25px;
  max-width: 1400px;
  margin: 0 auto;
}

.topo {
  display: flex;
  gap: 12px;
  margin-bottom: 30px;
  flex-wrap: wrap;
  align-items: center;
}

/* Estilo da Tabela */
table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 8px; /* Cria um espaçamento elegante entre as linhas */
  margin-top: 15px;
}

th {
  color: #94A3B8;
  font-size: 13px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 10px;
  text-align: center;
}

td {
  padding: 0 4px;
}

/* Inputs Modernizados */
input {
  width: 100%;
  background: #1E293B;
  border: 1px solid rgba(255, 255, 255, 0.05);
  color: white;
  padding: 12px 10px;
  border-radius: 8px;
  font-size: 14px;
  box-sizing: border-box;
  transition: all 0.2s ease;
}

input[readonly] {
  cursor: default;
}

input:focus {
  outline: none;
  border-color: #3B82F6;
  background: #1E293B;
}

/* Cartão do Técnico */
.card-tecnico {
  background: #1E293B;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 25px;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
}

.nome-tecnico {
  font-size: 18px;
  font-weight: bold;
  color: #F8FAFC;
  border-left: 4px solid #3B82F6;
  padding-left: 12px;
  margin-bottom: 10px;
}

/* Botões Modernos */
.btn {
  background: #3B82F6;
  color: white;
  border: none;
  padding: 12px 24px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  transition: background 0.2s;
  height: 45px;
  display: inline-flex;
  align-items: center;
}

.btn:hover {
  background: #2563EB;
}

.btn-voltar {
  background: #475569;
}

.btn-voltar:hover {
  background: #334155;
}

.input-busca {
  background: #1E293B;
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: white;
  padding: 0 15px;
  border-radius: 8px;
  font-size: 14px;
  height: 45px;
  width: 200px;
}
</style>
</head>
<body>

<div class="container">
  <div class="topo">
    <button class="btn btn-voltar" onclick="window.location.href='index.html'">Voltar para Dashboard</button>
    <input type="month" id="mesFiltro" class="input-busca" onchange="filtrarMes()">
    <button class="btn" onclick="mostrarTudo()">Mostrar Tudo</button>
  </div>

  <div id="historicos"></div>
</div>

<script>
const tecnicos = [
  "Sibele",
  "Empresa",
  "Danilo",
  "José Cicero",
  "Alex",
  "Danilo BH",
  "Thiago BH"
];

let cacheHistoricoCompleto = [];

function obtenerMesAtual() {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  return `${d.getFullYear()}-${mm}`;
}

// CORREÇÃO: Limpa o container antes de renderizar para garantir que NUNCA duplique
function criar() {
  const container = document.getElementById("historicos");
  container.innerHTML = ""; // <--- Zera o HTML anterior

  tecnicos.forEach(nome => {
    container.innerHTML += `
      <div class="card-tecnico">
        <div class="nome-tecnico">${nome}</div>
        <table>
          <thead>
            <tr>
              <th style="width: 12%;">Data</th>
              <th style="width: 12%;">KM</th>
              <th style="width: 12%;">Litros</th>
              <th style="width: 15%;">Valor</th>
              <th style="width: 15%;">Posto</th>
              <th>Cupom / Obs</th>
            </tr>
          </thead>
          <tbody data-tecnico="${nome}"></tbody>
        </table>
      </div>`;
  });
}

function linha(item) {
  const dataFmt = item.data ? item.data.split("-").reverse().join("/") : "-";
  const valorFmt = item.valor ? Number(item.valor).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }) : "R$ 0,00";
  
  return `
    <td><input type="text" value="${dataFmt}" readonly style="text-align:center;"></td>
    <td><input type="text" value="${item.km || ''}" readonly style="text-align:center;"></td>
    <td><input type="text" value="${item.litros || ''}" readonly style="text-align:center;"></td>
    <td><input type="text" value="${valorFmt}" readonly style="text-align:center; font-weight:bold; color:#60A5FA;"></td>
    <td><input type="text" value="${item.posto || ''}" readonly></td>
    <td><input type="text" value="${item.cupom || ''}" readonly></td>
  `;
}

async function carregar(mes) {
  try {
    const token = localStorage.getItem("token");
    const res = await fetch("/api/registros", {
      headers: { "Authorization": `Bearer ${token}` }
    });
    const listaCompleta = await res.json();
    
    cacheHistoricoCompleto = [...listaCompleta];
    let listaFiltrada = [...listaCompleta];

    listaFiltrada.sort((a, b) => {
      if (!a.data || !b.data) return 0;
      return new Date(a.data) - new Date(b.data);
    });

    // CORREÇÃO: Aplica o filtro apenas se um mês específico foi selecionado
    if (mes) {
      listaFiltrada = listaFiltrada.filter(item => {
        if (!item.data) return false;
        return item.data.startsWith(mes);
      });
    }

    // Limpa estritamente as linhas internas das tabelas antes de repovoar
    tecnicos.forEach(nome => {
      const tbody = document.querySelector(`[data-tecnico="${nome}"]`);
      if (tbody) tbody.innerHTML = "";
    });

    listaFiltrada.forEach(item => {
      const tbody = document.querySelector(`[data-tecnico="${item.tecnico}"]`);
      if (tbody) {
        const tr = document.createElement("tr");
        tr.innerHTML = linha(item);
        tbody.appendChild(tr);
      }
    });
  } catch (erro) {
    console.error("Erro ao carregar dados:", erro);
  }
}

function filtrarMes() {
  const mes = document.getElementById("mesFiltro").value;
  carregar(mes);
}

// CORREÇÃO: Limpa o input e traz os registros de todos os meses de verdade
function mostrarTudo() {
  document.getElementById("mesFiltro").value = "";
  carregar(""); 
}

async function iniciar() {
  criar(); // Cria as estruturas das tabelas uma única vez limpando resíduos
  const mesAtual = obtenerMesAtual();
  document.getElementById("mesFiltro").value = mesAtual;
  await carregar(mesAtual);
}

window.onload = () => {
  iniciar();
};
</script>
</body>
</html>
