<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dados - NERI</title>

<style>
body {
  background: #0F172A;
  color: white;
  font-family: Arial, sans-serif;
  margin: 0;
}

.container {
  padding: 25px;
  max-width: 1400px;
  margin: 0 auto;
}

.topo {
  display: flex;
  gap: 12px;
  margin-bottom: 30px;
  flex-wrap: wrap;
  align-items: center;
}

/* Estilo da Tabela */
table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 8px;
  margin-top: 15px;
}

th {
  color: #94A3B8;
  font-size: 13px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 10px;
  text-align: center;
}

td {
  padding: 0 4px;
}

/* Inputs Modernizados */
input {
  width: 100%;
  background: #1E293B;
  border: 1px solid rgba(255, 255, 255, 0.05);
  color: white;
  padding: 8px 10px;
  box-sizing: border-box;
  border-radius: 6px;
  text-align: center;
  font-size: 14px;
  transition: all 0.2s ease;
}

input:focus {
  outline: none;
  border-color: #3B82F6;
  box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
  background: #1E293B;
}

input[readonly] {
  background: rgba(15, 23, 42, 0.6);
  color: #64748B;
  border-color: transparent;
  cursor: not-allowed;
  font-weight: bold;
}

input[type="date"]::-webkit-calendar-picker-indicator,
input[type="month"]::-webkit-calendar-picker-indicator {
  filter: invert(1);
  cursor: pointer;
}

button {
  padding: 10px 16px;
  background: #2563EB;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 8px;
  font-weight: bold;
  font-size: 14px;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}

button:hover {
  background: #3B82F6;
  transform: translateY(-1px);
}

button[onclick^="addLinha"] {
  background: rgba(59, 130, 246, 0.1);
  border: 1px dashed #3B82F6;
  color: #60A5FA;
  margin-top: 12px;
  padding: 8px 20px;
}

button[onclick^="addLinha"]:hover {
  background: #3B82F6;
  color: white;
  border-style: solid;
}

td button {
  background: rgba(239, 68, 68, 0.1) !important;
  border: 1px solid rgba(239, 68, 68, 0.2) !important;
  color: #EF4444;
  padding: 6px 10px !important;
  border-radius: 6px !important;
  margin: 0 auto;
}

td button:hover {
  background: #EF4444 !important;
  color: white !important;
  transform: scale(1.05);
}

h2 {
  margin-top: 45px;
  margin-bottom: 5px;
  color: #F8FAFC;
  font-size: 22px;
  border-left: 4px solid #3B82F6;
  padding-left: 12px;
}
</style>
</head>

<body>

<div class="container">
  <div class="topo">
    <button onclick="voltarAoDashboard()">⬅ Voltar</button>
    <button onclick="salvar()">💾 Salvar</button>
    <input type="month" id="mesFiltro" style="width: auto; display: inline-block;">
    <button onclick="filtrarMes()">🔍 Buscar</button>
    <button onclick="mostrarTudo()">♻ Mostrar Mês Atual</button>
  </div>

  <div id="tabelas"></div>
</div>

<script>
const tecnicos = [
  "Sibele",
  "Empresa",
  "Danilo",
  "José Cicero",
  "Alex",
  "Danilo BH",
  "Thiago BH"
];

let cacheHistoricoCompleto = [];

function obtenerMesAtual(){
  const hoje = new Date();
  const ano = hoje.getFullYear();
  const mes = String(hoje.getMonth() + 1).padStart(2,"0");
  return `${ano}-${mes}`;
}

function hoje(){
  const agora = new Date();
  const ano = agora.getFullYear();
  const mes = String(agora.getMonth() + 1).padStart(2, '0');
  const dia = String(agora.getDate()).padStart(2, '0');
  return `${ano}-${mes}-${dia}`;
}

function criar(){
  const container = document.getElementById("tabelas");
  container.innerHTML = "";

  tecnicos.forEach(nome=>{
    const bloco = document.createElement("div");
    bloco.innerHTML = `
      <h2>${nome}</h2>
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>KM Ini</th>
            <th>KM Fim</th>
            <th>KM</th>
            <th>Consumo</th>
            <th>Abast Ant</th>
            <th>Abast Atual</th>
            <th>Litros</th>
            <th>Valor</th>
            <th></th>
          </tr>
        </thead>
        <tbody data-tecnico="${nome}"></tbody>
      </table>
      <button onclick="addLinha('${nome}')">+ Linha</button>
    `;
    container.appendChild(bloco);
  });
}

function linha(d = {}) {
  const dataFormatada = d.data ? String(d.data).split("T")[0] : hoje();
  const idRegistro = d._id || "";

  return `
  <tr>
    <td>
      <input type="date" value="${dataFormatada}">
    </td>
    <td>
      <input value="${d.kmIni || ''}" oninput="calc(this)">
    </td>
    <td>
      <input value="${d.kmFim || ''}" oninput="calc(this)">
    </td>
    <td>
      <input readonly value="${d.km || ''}">
    </td>
    <td>
      <input readonly value="${d.consumo || ''}">
    </td>
    <td>
      <input value="${d.abastAnt || ''}">
    </td>
    <td>
      <input value="${d.abastAtual || ''}" oninput="calc(this)">
    </td>
    <td>
      <input value="${d.litros || ''}" oninput="calc(this)">
    </td>
    <td>
      <input value="${d.valor || ''}">
    </td>
    <td>
      <button data-id="${idRegistro}" onclick="remover(this)">🗑️</button>
    </td>
  </tr>
  `;
}

function addLinha(nome){
  const tbody = document.querySelector(`[data-tecnico="${nome}"]`);
  const tr = document.createElement("tr");
  tr.innerHTML = linha();
  tbody.appendChild(tr);
}

function calc(el) {
  const tr = el.closest("tr");
  const i = tr.querySelectorAll("input");
  const tbody = tr.closest("tbody");
  const nomeTecnico = tbody.getAttribute("data-tecnico");

  const kmIni = Number(i[1].value);
  const kmFim = Number(i[2].value);
  const abastAtualInput = i[6];
  const abastAntInput = i[5];
  const litros = Number(i[7].value);

  const km = kmFim - kmIni;
  i[3].value = km > 0 ? km : "";

  if (abastAtualInput.value.trim() !== "") {
    const todasAsLinhas = Array.from(tbody.querySelectorAll("tr"));
    const indexAtual = todasAsLinhas.indexOf(tr);
    
    let encontrouAnterior = false;
    
    for (let j = indexAtual - 1; j >= 0; j--) {
      const inputsLinhaAnt = todasAsLinhas[j].querySelectorAll("input");
      const valorAbastAtualLinhaAnt = inputsLinhaAnt[6].value.trim();
      
      if (valorAbastAtualLinhaAnt !== "") {
        abastAntInput.value = valorAbastAtualLinhaAnt;
        encontrouAnterior = true;
        break;
      }
    }
    
    if (!encontrouAnterior) {
      const dataAtualDaLinha = i[0].value;
      const historicoFiltrado = cacheHistoricoCompleto
        .filter(item => item.tecnico === nomeTecnico && item.abastAtual && item.data && item.data < dataAtualDaLinha)
        .sort((a, b) => new Date(b.data) - new Date(a.data));

      if (historicoFiltrado.length > 0) {
        abastAntInput.value = historicoFiltrado[0].abastAtual;
      }
    }
  }

  const consumo = (km > 0 && litros > 0) ? (km / litros).toFixed(2) : "";
  i[4].value = consumo;
}

function remover(btn){
  const id = btn.getAttribute("data-id");
  if (id && id !== "" && id !== "undefined") {
    executarRemocaoDireta(id, btn);
  } else {
    btn.closest("tr").remove();
  }
}

async function ejecutarRemocaoDireta(id, btn) {
  if(!confirm("Deseja realmente excluir este registro?")) return;
  try {
    const token = localStorage.getItem("token");
    const res = await fetch(`/registro/${id}`, {
      method: "DELETE",
      headers: { "Authorization": "Bearer " + token }
    });
    if(res.ok) {
      btn.closest("tr").remove();
    } else {
      alert("Erro ao remover o registro.");
    }
  } catch(err) {
    console.error(err);
  }
}

async function salvar(){
  const token = localStorage.getItem("token");
  const mesAtual = document.getElementById("mesFiltro").value;
  if(!mesAtual){
    alert("Selecione um mês antes de salvar.");
    return;
  }

  let dados = [];
  tecnicos.forEach(nome=>{
    const linhas = document.querySelectorAll(`[data-tecnico="${nome}"] tr`);
    linhas.forEach(l=>{
      const i = l.querySelectorAll("input");
      if (i.length < 9) return; 
      
      const data = i[0].value;
      if(!data.startsWith(mesAtual)) return;

      const registro = {
        tecnico: nome,
        data: data,
        kmIni: Number(i[1].value) || 0,
        kmFim: Number(i[2].value) || 0,
        km: Number(i[3].value) || 0,
        consumo: Number(i[4].value) || 0,
        abastAnt: i[5].value || "",
        abastAtual: i[6].value || "",
        litros: Number(i[7].value) || 0,
        valor: parseFloat(String(i[8].value).replace(",", ".")) || 0
      };

      dados.push(registro);
    });
  });

  try {
    const respuesta = await fetch("/registro", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({ dados })
    });

    if (respuesta.ok) {
      alert("✅ Dados salvos com sucesso!");
      carregar(mesAtual); 
    } else {
      alert("⚠️ Erro ao salvar dados.");
    }
  } catch (err) {
    console.error(err);
  }
}

async function carregar(mes = ""){
  try {
    const token = localStorage.getItem("token");
    
    // CORREÇÃO: Enviando o cabeçalho idêntico ao app.js ("Bearer " + token)
    const res = await fetch("/registros", {
      headers: { "Authorization": "Bearer " + token }
    });
    
    if (!res.ok) {
      console.log("Erro na resposta do servidor ao carregar registros: Status", res.status);
      return;
    }

    const listaCompleta = await res.json();
    console.log("Registros recebidos do servidor:", listaCompleta);

    cacheHistoricoCompleto = [...listaCompleta];
    let listaFiltrada = [...listaCompleta];

    if(mes){
      listaFiltrada = listaFiltrada.filter(item=>{
        if(!item.data) return false;
        return String(item.data).split("T")[0].startsWith(mes);
      });
    }

    tecnicos.forEach(nome=>{
      const tbody = document.querySelector(`[data-tecnico="${nome}"]`);
      if(tbody) tbody.innerHTML = "";
    });

    listaFiltrada.forEach(item=>{
      const tbody = document.querySelector(`[data-tecnico="${item.tecnico}"]`);
      if(tbody){
        const tr = document.createElement("tr");
        tr.innerHTML = linha(item); 
        tbody.appendChild(tr);
      }
    });
  } catch (erro) {
    console.error("Erro na função carregar:", erro);
  }
}

function filtrarMes(){
  const mes = document.getElementById("mesFiltro").value;
  carregar(mes);
}

function mostrarTudo(){
  const mesAtual = obtenerMesAtual();
  document.getElementById("mesFiltro").value = mesAtual;
  carregar(mesAtual);
}

async function iniciar(){
  criar();
  const mesAtual = obtenerMesAtual();
  document.getElementById("mesFiltro").value = mesAtual;
  await carregar(mesAtual);
}

iniciar();
</script>

<script>
  function voltarAoDashboard() {
    window.location.href = "/index.html";
  }
</script>

</body>
</html>
