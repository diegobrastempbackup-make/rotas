<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dados</title>

<style>
body{
  background:#0F172A;
  color:white;
  font-family:Arial;
  margin:0;
}

.container{
  padding:20px;
}

.topo{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  border:1px solid #333;
  padding:5px;
  text-align:center;
}

input{
  width:100%;
  background:#1F2937;
  border:none;
  color:white;
  padding:5px;
  box-sizing:border-box;
}

button{
  margin-top:5px;
  padding:8px 12px;
  background:#3A8DFF;
  border:none;
  color:white;
  cursor:pointer;
  border-radius:5px;
}

button:hover{
  opacity:0.9;
}

h2{
  margin-top:40px;
  background:#111827;
  padding:10px;
  border-radius:5px;
}
</style>
</head>

<body>

<div class="container">

<div class="topo">

<button onclick="voltar()">
⬅ Voltar
</button>

<button onclick="salvar()">
💾 Salvar
</button>

<input type="month" id="mesFiltro">

<button onclick="filtrarMes()">
🔍 Buscar
</button>

<button onclick="mostrarTudo()">
♻ Mostrar Tudo
</button>

</div>

<div id="tabelas"></div>

</div>

<script>

const tecnicos = [
  "Sibele",
  "Empresa",
  "Danilo",
  "José Cicero",
  "Welisson",
  "Danilo BH",
  "Thiago BH"
];

function voltar(){
  window.location.href="/";
}

function hoje(){
  return new Date().toISOString().split("T")[0];
}

// 🔥 CRIAR TABELAS
function criar(){

  const container =
    document.getElementById("tabelas");

  container.innerHTML = "";

  tecnicos.forEach(nome=>{

    const bloco =
      document.createElement("div");

    bloco.innerHTML = `

      <h2>${nome}</h2>

      <table>

        <thead>

          <tr>
            <th>Data</th>
            <th>KM Ini</th>
            <th>KM Fim</th>
            <th>KM</th>
            <th>Consumo</th>
            <th>Abast Ant</th>
            <th>Abast Atual</th>
            <th>Litros</th>
            <th>Valor</th>
            <th></th>
          </tr>

        </thead>

        <tbody data-tecnico="${nome}"></tbody>

      </table>

      <button onclick="addLinha('${nome}')">
      + Linha
      </button>

    `;

    container.appendChild(bloco);

  });

}

// 🔥 LINHA
function linha(d = {}){

  return `

  <tr>

    <td>
      <input
      type="date"
      value="${d.data || hoje()}">
    </td>

    <td>
      <input
      value="${d.kmIni || ''}"
      oninput="calc(this)">
    </td>

    <td>
      <input
      value="${d.kmFim || ''}"
      oninput="calc(this)">
    </td>

    <td>
      <input
      readonly
      value="${d.km || ''}">
    </td>

    <td>
      <input
      readonly
      value="${d.consumo || ''}">
    </td>

    <td>
      <input
      value="${d.abastAnt || ''}">
    </td>

    <td>
      <input
      value="${d.abastAtual || ''}">
    </td>

    <td>
      <input
      value="${d.litros || ''}"
      oninput="calc(this)">
    </td>

    <td>
      <input
      value="${d.valor || ''}">
    </td>

    <td>
      <button onclick="remover(this)">
      🗑️
      </button>
    </td>

  </tr>

  `;

}

// 🔥 ADD LINHA
function addLinha(nome){

  const tbody =
    document.querySelector(
      `[data-tecnico="${nome}"]`
    );

  const tr =
    document.createElement("tr");

  tr.innerHTML = linha();

  tbody.appendChild(tr);

}

// 🔥 CALCULAR
function calc(el){

  const tr =
    el.closest("tr");

  const i =
    tr.querySelectorAll("input");

  const kmIni =
    Number(i[1].value);

  const kmFim =
    Number(i[2].value);

  const litros =
    Number(i[7].value);

  const km =
    kmFim - kmIni;

  i[3].value =
    km > 0 ? km : "";

  const consumo =

    (km > 0 && litros > 0)

    ? (km / litros).toFixed(2)

    : "";

  i[4].value = consumo;

}

// 🔥 REMOVER
function remover(btn){

  btn.closest("tr").remove();

}

// 🔥 SALVAR
async function salvar(){

  let dados = [];

  tecnicos.forEach(nome=>{

    const linhas =

      document.querySelectorAll(
        `[data-tecnico="${nome}"] tr`
      );

    linhas.forEach(l=>{

      const i =
        l.querySelectorAll("input");

      const registro = {

        tecnico: nome,

        data: i[0].value,

        kmIni:
          Number(i[1].value) || 0,

        kmFim:
          Number(i[2].value) || 0,

        km:
          Number(i[3].value) || 0,

        consumo:
          Number(i[4].value) || 0,

        abastAnt:
          i[5].value || "",

        abastAtual:
          i[6].value || "",

        litros:
          Number(i[7].value) || 0,

        valor:
          parseFloat(
            i[8].value.replace(",", ".")
          ) || 0

      };

      const temDado =

        registro.km > 0 ||

        registro.valor > 0 ||

        registro.litros > 0 ||

        registro.abastAnt !== "" ||

        registro.abastAtual !== "";

      if(temDado){

        dados.push(registro);

      }

    });

  });

  console.log("ENVIANDO:", dados);

  if(dados.length === 0){

    alert("Nenhum dado");

    return;

  }

  await fetch("/registro", {

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body: JSON.stringify({ dados })

  });

  alert("Salvo com sucesso!");

}

// 🔥 CARREGAR
async function carregar(mes = ""){

  const res =
    await fetch("/registros");

  let lista =
    await res.json();

  // 🔥 FILTRAR MÊS
  if(mes){

    lista = lista.filter(item=>{

      if(!item.data)
        return false;

      return item.data.startsWith(mes);

    });

  }

  // 🔥 LIMPA TUDO
  tecnicos.forEach(nome=>{

    const tbody =

      document.querySelector(
        `[data-tecnico="${nome}"]`
      );

    if(tbody){

      tbody.innerHTML = "";

    }

  });

  // 🔥 CARREGA
  lista.forEach(item=>{

    const tbody =

      document.querySelector(
        `[data-tecnico="${item.tecnico}"]`
      );

    if(tbody){

      const tr =
        document.createElement("tr");

      tr.innerHTML = linha(item);

      tbody.appendChild(tr);

    }

  });

}

// 🔥 FILTRAR MÊS
function filtrarMes(){

  const mes =

    document
      .getElementById("mesFiltro")
      .value;

  carregar(mes);

}

// 🔥 MOSTRAR TUDO
function mostrarTudo(){

  document
    .getElementById("mesFiltro")
    .value = "";

  carregar();

}

// INIT
async function iniciar(){

  criar();

  await carregar();

}

iniciar();

</script>

</body>
</html>
