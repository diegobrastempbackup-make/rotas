<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dados - NERI</title>

<style>
body {
  background: #0F172A;
  color: white;
  font-family: Arial, sans-serif;
  margin: 0;
}

.container {
  padding: 25px;
  max-width: 1400px;
  margin: 0 auto;
}

.topo {
  display: flex;
  gap: 12px;
  margin-bottom: 30px;
  flex-wrap: wrap;
  align-items: center;
}

/* Estilo da Tabela */
table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 8px;
  margin-top: 15px;
}

th {
  color: #94A3B8;
  font-size: 13px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 10px;
  text-align: center;
}

td {
  padding: 0 4px;
}

/* Inputs Modernizados */
input {
  width: 100%;
  background: #1E293B;
  border: 1px solid rgba(255, 255, 255, 0.05);
  color: white;
  padding: 8px 12px;
  border-radius: 6px;
  box-sizing: border-box;
  font-size: 13px;
  text-align: center;
}

input:focus {
  outline: none;
  border-color: #3B82F6;
}

/* Customização dos botões da tabela */
.btn-salvar {
  background: #10B981;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  font-size: 13px;
}

.btn-salvar:hover {
  background: #059669;
}

.btn-voltar {
  background: #334155;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  text-decoration: none;
  display: inline-block;
  font-size: 14px;
}

.btn-voltar:hover {
  background: #475569;
}

.card-tecnico {
  background: #1E293B;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 30px;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
  border: 1px solid rgba(255,255,255,0.05);
}

.titulo-tecnico {
  font-size: 18px;
  color: #3B82F6;
  margin: 0 0 15px 0;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: bold;
}
</style>
</head>
<body>

<div class="container">
  <div class="topo">
    <a href="/index.html" class="btn-voltar">← Voltar ao Painel</a>
    <input type="month" id="mesFiltro" style="width: auto;" onchange="filtrarMes()">
    <button class="btn-salvar" onclick="mostrarTudo()" style="background: #3B82F6;">Mês Atual</button>
  </div>

  <h2 style="margin-top: 0; color: #F8FAFC;">Carregando registros...</h2>

  <div id="tabelasClientes"></div>
</div>

<script>
const token = localStorage.getItem("token");
if (!token) {
  window.location.replace("/login.html");
}

let listaTecnicosGlobais = [];
let cacheHistoricoCompleto = [];

function obtenerMesAtual() {
  const d = new Date();
  const ano = d.getFullYear();
  let mes = d.getMonth() + 1;
  if (mes < 10) mes = "0" + mes;
  return `${ano}-${mes}`;
}

async function carregarTecnicosDaAPI() {
  try {
    const res = await fetch("/api/tecnicos/ativos", {
      headers: { "Authorization": `Bearer ${token}` }
    });
    if (!res.ok) throw new Error("Erro ao buscar lista de técnicos");
    listaTecnicosGlobais = await res.json();
  } catch (erro) {
    console.error(erro);
    alert("Não foi possível carregar os técnicos do banco de dados.");
  }
}

function criar() {
  const container = document.getElementById("tabelasClientes");
  container.innerHTML = "";

  if (listaTecnicosGlobais.length === 0) {
    container.innerHTML = `<p style="color:#94A3B8; font-style:italic;">Nenhum técnico ativo localizado no banco de dados.</p>`;
    return;
  }

  listaTecnicosGlobais.forEach(tec => {
    const div = document.createElement("div");
    div.className = "card-tecnico";

    div.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 class="titulo-tecnico">${tec.nome}</h3>
        <button class="btn-salvar" onclick="salvar('${tec.nome}')">Salvar Planilha</button>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th style="width: 100px;">Data</th>
              <th style="width: 90px;">KM Inicial</th>
              <th style="width: 90px;">KM Final</th>
              <th style="width: 90px;">KM Rodado</th>
              <th style="width: 90px;">Lts Comb.</th>
              <th style="width: 100px;">Vlr Litro</th>
              <th style="width: 100px;">Vlr Abast.</th>
              <th style="width: 80px;">Média</th>
              <th>Clientes Atendidos / Rotas do Dia</th>
            </tr>
          </thead>
          <tbody data-tecnico="${tec.nome}"></tbody>
        </table>
      </div>
    `;
    container.appendChild(div);
  });
}

function linha(item = {}) {
  const id = item._id || "";
  const dataExibicao = item.data ? formatarDataParaTela(item.data) : "";
  const km_inicial = item.km_inicial !== undefined ? item.km_inicial : "";
  const km_final = item.km_final !== undefined ? item.km_final : "";
  const km_rodado = item.km_rodado !== undefined ? item.km_rodado : "";
  const litros = item.litros !== undefined ? item.litros : "";
  const valor_litro = item.valor_litro !== undefined ? item.valor_litro : "";
  const valor_total = item.valor_total !== undefined ? item.valor_total : "";
  const media = item.media !== undefined ? item.media : "";
  const clientes = item.clientes || "";

  return `
    <tr data-id="${id}">
      <td><input type="text" class="data-input" value="${dataExibicao}" style="background:transparent; border:none; color:#94A3B8;" readonly></td>
      <td><input type="number" class="km_inicial" value="${km_inicial}" oninput="calcular(this)"></td>
      <td><input type="number" class="km_final" value="${km_final}" oninput="calcular(this)"></td>
      <td><input type="number" class="km_rodado" value="${km_rodado}" style="background:transparent; border:none; font-weight:bold;" readonly></td>
      <td><input type="number" class="litros" value="${litros}" step="0.01" oninput="calcular(this)"></td>
      <td><input type="number" class="valor_litro" value="${valor_litro}" step="0.01" oninput="calcular(this)"></td>
      <td><input type="number" class="valor_total" value="${valor_total}" step="0.01" style="background:transparent; border:none; font-weight:bold;" readonly></td>
      <td><input type="text" class="media" value="${media}" style="background:transparent; border:none; font-weight:bold; color:#10B981;" readonly></td>
      <td><input type="text" class="clientes" value="${clientes}" style="text-align:left; padding-left:10px;"></td>
    </tr>
  `;
}

function formatarDataParaTela(dataObjeto) {
  const dataStr = String(dataObjeto);
  if (dataStr.includes("/")) return dataStr; 
  const limpa = dataStr.split("T")[0];
  const partes = limpa.split("-");
  if (partes.length === 3) {
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }
  return dataStr;
}

function calcular(input) {
  const tr = input.closest("tr");
  const kmi = parseFloat(tr.querySelector(".km_inicial").value) || 0;
  const kmf = parseFloat(tr.querySelector(".km_final").value) || 0;
  const lts = parseFloat(tr.querySelector(".litros").value) || 0;
  const vlrLtr = parseFloat(tr.querySelector(".valor_litro").value) || 0;

  const inputKmRodado = tr.querySelector(".km_rodado");
  const inputValorTotal = tr.querySelector(".valor_total");
  const inputMedia = tr.querySelector(".media");

  let rodado = 0;
  if (kmf > kmi) {
    rodado = kmf - kmi;
    inputKmRodado.value = rodado;
  } else {
    inputKmRodado.value = "";
  }

  if (lts > 0 && vlrLtr > 0) {
    inputValorTotal.value = (lts * vlrLtr).toFixed(2);
  } else {
    inputValorTotal.value = "";
  }

  if (rodado > 0 && lts > 0) {
    inputMedia.value = (rodado / lts).toFixed(2);
  } else {
    inputMedia.value = "";
  }
}

async function carregar(mes) {
  try {
    const res = await fetch("/api/registros", {
      headers: { "Authorization": `Bearer ${token}` }
    });
    
    if (!res.ok) {
      console.error("Erro na requisição da API:", res.status);
      return;
    }

    const listaCompleta = await res.json();
    cacheHistoricoCompleto = [...listaCompleta];
    let listaFiltrada = [...listaCompleta];

    if (mes) {
      const [ano, mesNum] = mes.split("-");
      const mesesNomes = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
      const nomeMes = mesesNomes[parseInt(mesNum) - 1];
      
      const tituloPagina = document.querySelector("h2");
      if (tituloPagina) {
        tituloPagina.innerText = `${nomeMes} de ${ano}`;
      }

      // FILTRAGEM INTELIGENTE E UNIVERSAL (ISO E PT-BR)
      listaFiltrada = listaFiltrada.filter(item => {
        if (!item.data) return false;
        
        let dataStr = String(item.data).trim();
        let anoItem = "";
        let mesItem = "";

        if (dataStr.includes("-") && dataStr.indexOf("-") === 4) {
          const partes = dataStr.split("T")[0].split("-");
          anoItem = partes[0];
          mesItem = partes[1];
        } 
        else if (dataStr.includes("/")) {
          const partes = dataStr.split("/");
          if (partes.length === 3) {
            anoItem = partes[2].split(" ")[0]; 
            mesItem = partes[1];
          }
        }

        if (anoItem && mesItem) {
          return anoItem === ano && mesItem === mesNum;
        }

        const dataFormatada = dataStr.includes("T") ? dataStr.split("T")[0] : dataStr;
        return dataFormatada.startsWith(mes);
      });
    }

    // Inicializa ou limpa as tabelas existentes
    listaTecnicosGlobais.forEach(tec => {
      const tbody = document.querySelector(`[data-tecnico="${tec.nome}"]`);
      if (tbody) tbody.innerHTML = "";
    });

    // Se não houver registros salvos para o mês, cria linhas vazias baseadas no calendário
    if (listaFiltrada.length === 0 && mes) {
      const [ano, mesNum] = mes.split("-");
      const diasNoMes = new Date(ano, mesNum, 0).getDate();

      listaTecnicosGlobais.forEach(tec => {
        const tbody = document.querySelector(`[data-tecnico="${tec.nome}"]`);
        if (tbody) {
          for (let d = 1; d <= diasNoMes; d++) {
            const diaStr = d < 10 ? "0" + d : d;
            const dataFalsaISO = `${ano}-${mesNum}-${diaStr}`;
            const tr = document.createElement("tr");
            tr.innerHTML = linha({ data: dataFalsaISO, tecnico: tec.nome });
            tbody.appendChild(tr);
          }
        }
      });
      return;
    }

    // Distribui os dados carregados do banco nas tabelas certas
    listaFiltrada.forEach(item => {
      const tbody = document.querySelector(`[data-tecnico="${item.tecnico}"]`);
      if (tbody) {
        const tr = document.createElement("tr");
        tr.innerHTML = linha(item); 
        tbody.appendChild(tr);
      }
    });

    // Para dias que faltarem no histórico do mês, adiciona a linha em branco correspondente
    if (mes) {
      const [ano, mesNum] = mes.split("-");
      const diasNoMes = new Date(ano, mesNum, 0).getDate();

      listaTecnicosGlobais.forEach(tec => {
        const tbody = document.querySelector(`[data-tecnico="${tec.nome}"]`);
        if (tbody) {
          for (let d = 1; d <= diasNoMes; d++) {
            const diaStr = d < 10 ? "0" + d : d;
            const dataVerificacaoBR = `${diaStr}/${mesNum}/${ano}`;
            
            // Verifica se o dia já está renderizado na tabela
            let jaExiste = false;
            const inputsData = tbody.querySelectorAll(".data-input");
            inputsData.forEach(inp => {
              if (inp.value === dataVerificacaoBR) jaExiste = true;
            });

            if (!jaExiste) {
              const dataFalsaISO = `${ano}-${mesNum}-${diaStr}`;
              const tr = document.createElement("tr");
              tr.innerHTML = linha({ data: dataFalsaISO, tecnico: tec.nome });
              
              // Insere ordenadamente mantendo os dias sequenciais
              const linhasAtuais = Array.from(tbody.querySelectorAll("tr"));
              const linhaPosicao = linhasAtuais.find(l => {
                const txt = l.querySelector(".data-input").value.split("/")[0];
                return parseInt(txt) > d;
              });

              if (linePosicao) {
                tbody.insertBefore(tr, linhaPosicao);
              } else {
                tbody.appendChild(tr);
              }
            }
          }
        }
      });
    }

  } catch (erro) {
    console.error("Erro crítico ao carregar e filtrar dados:", erro);
  }
}

function filtrarMes() {
  const mes = document.getElementById("mesFiltro").value;
  carregar(mes);
}

function mostrarTudo() {
  const mesAtual = obtenerMesAtual();
  document.getElementById("mesFiltro").value = mesAtual;
  carregar(mesAtual);
}

async function salvar(nomeTecnico) {
  const tbody = document.querySelector(`[data-tecnico="${nomeTecnico}"]`);
  if (!tbody) return;

  const linhasHTML = tbody.querySelectorAll("tr");
  const payload = [];

  const mesFiltroValor = document.getElementById("mesFiltro").value;
  if (!mesFiltroValor) return alert("Selecione um mês de referência para salvar.");
  const [ano, mesNum] = mesFiltroValor.split("-");

  linhasHTML.forEach(tr => {
    const id = tr.getAttribute("data-id") || null;
    const dataInput = tr.querySelector(".data-input").value;
    
    let dataISO = "";
    if (dataInput.includes("/")) {
      const [d, m, a] = dataInput.split("/");
      dataISO = `${a}-${m}-${d}`;
    } else {
      dataISO = dataInput;
    }

    const km_inicial = tr.querySelector(".km_inicial").value;
    const km_final = tr.querySelector(".km_final").value;
    const litros = tr.querySelector(".litros").value;
    const valor_litro = tr.querySelector(".valor_litro").value;
    const clientes = tr.querySelector(".clientes").value;

    if (!km_inicial && !km_final && !litros && !valor_litro && !clientes) {
      return; 
    }

    const item = {
      tecnico: nomeTecnico,
      data: dataISO,
      clientes: clientes,
      km_inicial: km_inicial !== "" ? parseFloat(km_inicial) : 0,
      km_final: km_final !== "" ? parseFloat(km_final) : 0,
      km_rodado: parseFloat(tr.querySelector(".km_rodado").value) || 0,
      litros: litros !== "" ? parseFloat(litros) : 0,
      valor_litro: valor_litro !== "" ? parseFloat(valor_litro) : 0,
      valor_total: parseFloat(tr.querySelector(".valor_total").value) || 0,
      media: parseFloat(tr.querySelector(".media").value) || 0
    };

    if (id && id.trim() !== "") {
      item._id = id;
    }

    payload.push(item);
  });

  if (payload.length === 0) {
    alert("Não há dados preenchidos para salvar nesta planilha.");
    return;
  }

  try {
    const res = await fetch("/api/registros", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify(payload)
    });

    const result = await res.json();
    if (res.ok && result.ok) {
      alert(`Planilha de ${nomeTecnico} gravada com sucesso no banco de dados!`);
      carregar(mesFiltroValor);
    } else {
      alert("Erro ao gravar dados: " + (result.erro || "Verifique o console."));
    }
  } catch (err) {
    console.error(err);
    alert("Erro de conexão com o servidor.");
  }
}

async function iniciar() {
  await carregarTecnicosDaAPI(); 
  criar(); 
  const mesAtual = obtenerMesAtual();
  document.getElementById("mesFiltro").value = mesAtual;
  await carregar(mesAtual); 
}

window.onload = iniciar;
</script>

</body>
</html>
