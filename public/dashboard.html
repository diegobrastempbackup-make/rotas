<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>NERI Dashboard</title>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <link rel="stylesheet" href="style.css">

  <style>
    #btnIrParaDados, #btnMenuCadastro, #btnIrParaEstoque {
      display: none;
    }

    .main {
      flex-grow: 1;
      padding: 15px 20px; 
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      justify-content: flex-start !important; 
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      width: 100%;
      margin-top: 0 !important; 
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 10px;
      box-sizing: border-box;
    }

    .modal-conteudo {
      background: #1E293B;
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 450px;
      color: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      margin-bottom: 4px;
      color: #94A3B8;
      font-size: 13px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 8px;
      background: #0F172A;
      border: 1px solid #334155;
      color: white;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .btn-bloco {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .item-usuario {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0F172A;
      padding: 8px 12px;
      border-radius: 4px;
      margin-bottom: 6px;
      border: 1px solid #334155;
    }

    .btn-excluir-user {
      background: #EF4444;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="sidebar">
      <h2>NERI frotas</h2>
      
      <label for="filtroMes" style="color:#94A3B8; font-size:12px; font-weight:bold; text-transform:uppercase;">Filtrar Mês:</label>
      <input type="month" id="filtroMes" style="background:#1E293B; color:white; border:1px solid #334155; padding:8px; border-radius:4px; margin-bottom:15px; width:100%; box-sizing:border-box;">

      <p onclick="filtrar('TODOS')" class="active" id="btnTodos">Geral Dashboard</p>
      
      <div id="containerTecnicosDinamicos" style="display:flex; flex-direction:column; gap:2px; width:100%;">
         </div>

      <hr style="border:0; border-top:1px solid rgba(255,255,255,0.05); margin:15px 0; width:100%;">

      <button id="btnIrParaDados" onclick="window.location.href='/dados.html'" style="background:#2563EB; color:white; border:none; padding:10px; border-radius:4px; font-weight:bold; width:100%; cursor:pointer; margin-bottom:8px;">📝 Lançar Dados</button>
      <button id="btnIrParaEstoque" onclick="window.location.href='/estoque.html'" style="background:#10B981; color:white; border:none; padding:10px; border-radius:4px; font-weight:bold; width:100%; cursor:pointer; margin-bottom:8px;">📦 Ver Estoque</button>
      <button id="btnMenuCadastro" onclick="abrirModalCadastro()" style="background:#475569; color:white; border:none; padding:10px; border-radius:4px; font-weight:bold; width:100%; cursor:pointer; margin-bottom:8px;">⚙️ Gerenciar Usuários</button>
      
      <button onclick="logout()" style="background:#EF4444; color:white; border:none; padding:10px; border-radius:4px; font-weight:bold; width:100%; cursor:pointer; margin-top:auto;">🚪 Sair</button>
    </div>

    <div class="main">
      
      <div class="cards">
        <div class="card">
          <h3>KM Total</h3>
          <p id="cardKm">-</p>
        </div>
        <div class="card">
          <h3>Litros Combustível</h3>
          <p id="cardLitros">-</p>
        </div>
        <div class="card">
          <h3>Valor Investido</h3>
          <p id="cardValor">-</p>
        </div>
        <div class="card">
          <h3>Média Geral (KM/L)</h3>
          <p id="cardMedia">-</p>
        </div>
      </div>

      <div style="width:100%; display:flex; justify-content:flex-end;">
         <button onclick="gerarPDF()" style="background:#DC2626; color:white; border:none; padding:10px 20px; border-radius:4px; font-weight:bold; cursor:pointer; display:flex; align-items:center; gap:8px;">📄 Exportar Relatório Mensal para PDF</button>
      </div>

      <div class="charts-container" style="display: flex; flex-direction: column; gap: 20px; width: 100%;">
        <div class="chart-box" style="background: #1E293B; padding: 15px; border-radius: 8px; width: 100%; box-sizing: border-box;">
          <h3 style="margin-top: 0; color: #94A3B8; font-size: 16px;" id="tituloGrafico1">Evolução de Gastos e KM</h3>
          <div style="position: relative; width: 100%; height: 320px;">
             <canvas id="graficoKmGeral"></canvas>
          </div>
        </div>

        <div class="chart-box" style="background: #1E293B; padding: 15px; border-radius: 8px; width: 100%; box-sizing: border-box;">
          <h3 style="margin-top: 0; color: #94A3B8; font-size: 16px;">Média de Consumo de Combustível (KM/L)</h3>
          <div style="position: relative; width: 100%; height: 320px;">
             <canvas id="graficoMediaGeral"></canvas>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div id="modalCadastro" class="modal">
    <div class="modal-conteudo">
      <h3 style="margin-top: 0; border-bottom: 1px solid #334155; padding-bottom: 8px;">Gerenciamento de Usuários</h3>
      
      <div id="listaUsuariosSecao">
        <label style="color:#94A3B8; font-size:12px; font-weight:bold; display:block; margin-bottom:8px;">USUÁRIOS CADASTRADOS:</label>
        <div id="listaUsuariosContainer" style="max-height:200px; overflow-y:auto; margin-bottom:15px;"></div>
        <button onclick="mostrarFormularioCadastro()" class="btn-bloco" style="background:#10B981;">+ Criar Novo Usuário</button>
      </div>

      <div id="formUsuario" style="display: none;" class="form-group">
        <h4 id="formTitulo" style="margin: 0 0 15px 0; color: #60A5FA;">Novo Usuário</h4>
        <input type="hidden" id="editId">
        
        <label>Nome Completo:</label>
        <input type="text" id="cadNome" placeholder="Nome Completo">
        
        <label>Nome de Usuário (Login):</label>
        <input type="text" id="cadUsuario" placeholder="Usuário (ex: joao)">
        
        <label id="lblSenha">Senha:</label>
        <input type="password" id="cadSenha" placeholder="Digite a senha">
        
        <label>Nível de Acesso:</label>
        <select id="cadTipo">
          <option value="simples">Acesso Simples</option>
          <option value="estoque">Estoque</option>
          <option value="admin">Administrador</option>
          <option value="master">Master</option>
        </select>
      </div>

      <div class="modal-botoes" style="display:flex; gap:10px; margin-top:15px;">
        <button class="btn-bloco" style="background:#64748B; margin:0;" onclick="fecharModalCadastro()">Fechar</button>
        <button id="btnSalvarUsuario" class="btn-bloco" style="background:#2563EB; margin:0; display:none;" onclick="salvarNovoUsuario()">Gravar Usuário</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
