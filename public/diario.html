<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App do Técnico - NERI</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0F172A; color: white; -webkit-tap-highlight-color: transparent; }
        .header { background-color: #1E293B; padding: 20px 15px; text-align: center; border-bottom: 3px solid #3B82F6; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .header h2 { margin: 0; font-size: 18px; color: #E2E8F0; text-transform: uppercase; letter-spacing: 1px; }
        .btn-sair { position: absolute; top: 15px; right: 15px; background: rgba(239, 68, 68, 0.1); color: #EF4444; border: 1px solid #EF4444; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .resumo-dia { display: flex; justify-content: space-between; gap: 10px; padding: 15px; background: #172033; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .resumo-box { flex: 1; background: #1E293B; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .resumo-valor { font-size: 20px; font-weight: bold; color: #3B82F6; margin-bottom: 4px; }
        .resumo-titulo { font-size: 11px; color: #94A3B8; text-transform: uppercase; }
        .container { padding: 15px; padding-bottom: 80px; }
        
        .paragem-card { background: #1E293B; border-radius: 12px; margin-bottom: 12px; overflow: hidden; border-left: 5px solid #64748B; transition: all 0.4s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .status-pendente { border-left-color: #64748B; } 
        .status-deslocamento { border-left-color: #FACC15; } 
        .status-chegada { border-left-color: #F97316; } 

        .paragem-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .p-seq { font-size: 18px; font-weight: bold; color: white; width: 35px; }
        .p-info { flex: 1; padding: 0 10px; }
        .p-os { color: #60A5FA; font-size: 13px; font-weight: bold; margin-bottom: 3px; display: block; }
        .p-cliente { color: #E2E8F0; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .p-icon { font-size: 18px; color: #94A3B8; transition: transform 0.3s; }

        .paragem-body { display: none; padding: 15px; background: rgba(15, 23, 42, 0.4); border-top: 1px solid rgba(255,255,255,0.05); }
        .info-linha { margin-bottom: 12px; }
        .info-titulo { color: #94A3B8; font-size: 12px; display: block; margin-bottom: 2px; text-transform: uppercase; }
        .info-valor { color: #F8FAFC; font-size: 14px; line-height: 1.4; }

        .btn-gigante { width: 100%; padding: 16px; font-size: 15px; font-weight: bold; text-align: center; border-radius: 8px; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-deslocamento { background: #FACC15; color: #422006; margin-top: 10px; }
        .btn-cheguei { background: #F97316; color: white; margin-top: 10px; }
        .botoes-duplos { display: flex; gap: 10px; margin-top: 10px; }
        .btn-sucesso { background: #10B981; color: white; flex: 1; padding: 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-insucesso { background: #EF4444; color: white; flex: 1; padding: 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-nav-pequeno { border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; flex: 1; display: flex; justify-content: center; align-items: center; gap: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }

        .loading-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,0.9); z-index:999; display:flex; justify-content:center; align-items:center; flex-direction:column; display: none; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #3B82F6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Sinalizador Visual de Rastreamento Ativo */
        #avisoRastreio { display: none; background: #EF4444; color: white; text-align: center; padding: 8px; font-size: 12px; font-weight: bold; animation: piscar 2s infinite; }
        @keyframes piscar { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .custom-pin { background: transparent; border: none; }
    </style>
</head>
<body>

    <div class="header">
        <button class="btn-sair" onclick="sair()">Sair</button>
        <h2 id="nomeTecnico">Carregando...</h2>
    </div>

    <!-- Barra que avisa ao técnico que o GPS dele está a ser gravado -->
    <div id="avisoRastreio">📡 Rastreamento de Rota em andamento...</div>

    <div class="resumo-dia">
        <div class="resumo-box"><div class="resumo-valor" id="resumoKM">0</div><div class="resumo-titulo">KM Total</div></div>
        <div class="resumo-box"><div class="resumo-valor" id="resumoM" style="color:#F59E0B;">0</div><div class="resumo-titulo">Manhã</div></div>
        <div class="resumo-box"><div class="resumo-valor" id="resumoT" style="color:#10B981;">0</div><div class="resumo-titulo">Tarde</div></div>
    </div>

    <div style="padding: 15px 15px 0 15px;">
        <button class="btn-gigante" style="background-color: #3B82F6; color: white;" onclick="abrirMapa()">🗺️ Visualizar Mapa do Dia</button>
    </div>

    <div class="container" id="listaOrdens">
        <div style="text-align: center; color: #94A3B8; margin-top: 50px;">A buscar rotas de hoje...</div>
    </div>

    <div id="modalMapa" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#0F172A; z-index:1000; flex-direction:column;">
        <div style="background:#1E293B; padding:20px 15px; display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid #3B82F6;">
            <h3 style="margin:0; color:white; font-size: 18px;">O que falta fazer</h3>
            <button onclick="fecharMapa()" style="background:#EF4444; color:white; border:none; padding:8px 15px; border-radius:6px; font-weight:bold; cursor:pointer;">Fechar</button>
        </div>
        <div id="mapaTecnico" style="flex:1; width:100%;"></div>
    </div>

    <div class="loading-overlay" id="loader"><div class="spinner"></div><div style="color:white; font-weight:bold;">A sincronizar...</div></div>

<script>
    const token = localStorage.getItem("token");
    const nomeUsuario = localStorage.getItem("nomeUsuario"); 
    
    if (!token) window.location.replace("/login.html");

    const nomePartes = nomeUsuario.split(' ');
    document.getElementById("nomeTecnico").innerText = `🚗 ${nomePartes[0]} ${nomePartes[nomePartes.length-1] || ''}`;

    let itinerarioDia = [];
    let dataDeHojeBR = "";
    let mapaTecnico = null;
    let layerGrupoTecnico = null;
    
    // VARIÁVEIS DO RASTREAMENTO EM TEMPO REAL
    let intervaloRastreio = null;
    let osEmDeslocamento = null; // Guarda o código da OS atual

    function calcularDistanciaKM(lat1, lon1, lat2, lon2) {
        const R = 6371; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function buscarRotaDoServidor() {
        const dataAtual = new Date();
        dataDeHojeBR = `${String(dataAtual.getDate()).padStart(2, '0')}/${String(dataAtual.getMonth() + 1).padStart(2, '0')}/${dataAtual.getFullYear()}`;
        
        try {
            const res = await fetch(`/api/rotas?data=${encodeURIComponent(dataDeHojeBR)}`, { headers: { 'Authorization': `Bearer ${token}` } });
            const rotas = await res.json();
            const minhaRota = rotas.find(r => r.tecnico.toUpperCase() === nomeUsuario.toUpperCase());

            if (minhaRota && minhaRota.itinerario.length > 0) {
                itinerarioDia = minhaRota.itinerario.map(item => ({ ...item, status: item.status || 'pendente' }));
                atualizarResumoTopo();
                renderizarLista();
                
                // Se o App foi reiniciado e o técnico já estava em deslocamento, retoma o GPS!
                const ordemAberta = itinerarioDia.find(i => i.status === 'deslocamento');
                if (ordemAberta) iniciarRastreioGPS(ordemAberta.codigo);
                
            } else {
                document.getElementById("listaOrdens").innerHTML = `<div style="text-align:center; margin-top:40px; padding:20px; background:#1E293B; border-radius:12px;">🎉 Nenhuma rota para hoje. Bom descanso!</div>`;
            }
        } catch (e) { alert("Falha na ligação com a central."); }
    }

    function atualizarResumoTopo() {
        let qtdM = 0; let qtdT = 0; let kmTotal = 0;
        itinerarioDia.forEach(item => { if(item.periodo === 'MANHA') qtdM++; else qtdT++; });
        for(let i = 0; i < itinerarioDia.length - 1; i++) {
            kmTotal += calcularDistanciaKM(itinerarioDia[i].lat, itinerarioDia[i].lon, itinerarioDia[i+1].lat, itinerarioDia[i+1].lon);
        }
        document.getElementById("resumoM").innerText = qtdM;
        document.getElementById("resumoT").innerText = qtdT;
        document.getElementById("resumoKM").innerText = (kmTotal * 1.3).toFixed(1); 
    }

    function renderizarLista() {
        const container = document.getElementById("listaOrdens");
        container.innerHTML = "";
        let itensPendentesNaTela = 0;

        itinerarioDia.forEach((cliente, index) => {
            if (cliente.status === 'sucesso' || cliente.status === 'insucesso') return;
            
            itensPendentesNaTela++;
            const seq = index + 1; 
            const wazeUrl = `https://waze.com/ul?ll=${cliente.lat},${cliente.lon}&navigate=yes`;
            const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${cliente.lat},${cliente.lon}`;
            
            let botoesHTML = "";
            let iconeStatus = "▼";

            if (cliente.status === 'pendente') {
                botoesHTML = `<button class="btn-gigante btn-deslocamento" onclick="mudarStatus('${cliente.codigo}', 'deslocamento', 'horaSaida', ${index})">🚗 Iniciar Deslocamento</button>`;
            } else if (cliente.status === 'deslocamento') {
                botoesHTML = `<button class="btn-gigante btn-cheguei" onclick="mudarStatus('${cliente.codigo}', 'chegada', 'horaChegada', ${index})">📍 Cheguei no Cliente</button>`;
            } else if (cliente.status === 'chegada') {
                botoesHTML = `<div class="botoes-duplos"><button class="btn-sucesso" onclick="mudarStatus('${cliente.codigo}', 'sucesso', 'horaFinal', ${index})">✅ Sucesso</button><button class="btn-insucesso" onclick="mudarStatus('${cliente.codigo}', 'insucesso', 'horaFinal', ${index})">❌ Insucesso</button></div>`;
            }

            container.innerHTML += `
                <div class="paragem-card status-${cliente.status}" id="card-${index}">
                    <div class="paragem-header" onclick="toggleCard(${index})">
                        <div class="p-seq">#${seq}</div>
                        <div class="p-info">
                            <span class="p-os">OS: ${cliente.codigo}</span>
                            <div class="p-cliente">${cliente.cliente}</div>
                        </div>
                        <div class="p-icon" id="icon-${index}">${iconeStatus}</div>
                    </div>
                    
                    <div class="paragem-body" id="body-${index}">
                        <div style="margin-bottom: 15px; display: flex; gap: 10px;">
                            <button class="btn-nav-pequeno" style="background-color: #00C3FF; color: #0F172A;" onclick="window.open('${wazeUrl}', '_blank')">🧭 Waze</button>
                            <button class="btn-nav-pequeno" style="background-color: #10B981; color: white;" onclick="window.open('${mapsUrl}', '_blank')">🗺️ Maps</button>
                        </div>
                        <div class="info-linha"><span class="info-titulo">Endereço</span><span class="info-valor">${cliente.rua}, ${cliente.cidade}</span></div>
                        <div class="info-linha"><span class="info-titulo">Serviço</span><span class="info-valor" style="color:#F59E0B;">${cliente.servico || 'Padrão'}</span></div>
                        <div id="areaBotoes-${index}">${botoesHTML}</div>
                    </div>
                </div>
            `;
        });

        if (itensPendentesNaTela === 0) {
            container.innerHTML = `<div style="text-align:center; margin-top:40px; padding:20px; background:#1E293B; border-radius:12px; border: 1px solid rgba(16, 185, 129, 0.3);">🎉 Todas as tarefas de hoje foram concluídas! Bom descanso.</div>`;
        }
    }

    function toggleCard(indexExpandir) {
        itinerarioDia.forEach((cliente, index) => {
            if (cliente.status === 'sucesso' || cliente.status === 'insucesso') return;
            const body = document.getElementById(`body-${index}`);
            if(body) {
                if (index === indexExpandir) body.style.display = body.style.display === "block" ? "none" : "block";
                else body.style.display = "none";
            }
        });
    }

    // ========================================================
    // MOTOR DE RASTREAMENTO (BREADCRUMBING)
    // ========================================================
    function iniciarRastreioGPS(codigoOs) {
        pararRastreioGPS(); // Garante que não temos 2 cronômetros rodando
        osEmDeslocamento = codigoOs;
        document.getElementById("avisoRastreio").style.display = "block";

        // Tenta capturar a primeira migalha imediatamente
        enviarMigalhaAoServidor();

        // Configura o robô para capturar de 1 em 1 minuto (60.000 ms)
        intervaloRastreio = setInterval(enviarMigalhaAoServidor, 60000);
    }

    function pararRastreioGPS() {
        if (intervaloRastreio) {
            clearInterval(intervaloRastreio);
            intervaloRastreio = null;
        }
        osEmDeslocamento = null;
        document.getElementById("avisoRastreio").style.display = "none";
    }

    function enviarMigalhaAoServidor() {
        if (!osEmDeslocamento || !navigator.geolocation) return;

        navigator.geolocation.getCurrentPosition(async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            
            try {
                // Envia de forma invisível, sem travar a tela do técnico
                fetch('/api/rotas/tracking', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ 
                        data: dataDeHojeBR, 
                        tecnico: nomeUsuario, 
                        codigoOs: osEmDeslocamento, 
                        lat: lat, 
                        lon: lon 
                    })
                });
            } catch (e) { console.log("Falha silenciosa ao enviar tracking", e); }
        }, 
        (err) => { console.log("Erro de GPS no celular:", err); }, 
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
    }
    // ========================================================

    async function mudarStatus(codigoOs, novoStatus, campoCronometro, indexArray) {
        document.getElementById("loader").style.display = "flex";
        const horaExata = new Date().toLocaleTimeString('pt-BR', { hour12: false });

        try {
            const res = await fetch('/api/rotas/status', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ data: dataDeHojeBR, tecnico: nomeUsuario, codigoOs: codigoOs, novoStatus: novoStatus, campoTempo: campoCronometro, valorTempo: horaExata })
            });

            if (res.ok) {
                itinerarioDia[indexArray].status = novoStatus;
                
                // GATILHOS DO RASTREAMENTO
                if (novoStatus === 'deslocamento') iniciarRastreioGPS(codigoOs);
                if (novoStatus === 'chegada') pararRastreioGPS();

                if (novoStatus === 'sucesso' || novoStatus === 'insucesso') {
                    const cardElement = document.getElementById(`card-${indexArray}`);
                    if (cardElement) {
                        cardElement.style.opacity = "0";
                        cardElement.style.transform = "scale(0.8)";
                    }
                    setTimeout(() => { renderizarLista(); }, 400); 
                } else {
                    renderizarLista();
                    document.getElementById(`body-${indexArray}`).style.display = "block"; 
                }
            } else { alert("❌ Erro ao comunicar com a base."); }
        } catch (e) { alert("❌ Sem internet. Verifique o seu sinal 4G/Wifi."); } 
        finally { document.getElementById("loader").style.display = "none"; }
    }

    function abrirMapa() {
        const rotasRestantes = itinerarioDia.filter(c => c.status !== 'sucesso' && c.status !== 'insucesso');
        if(rotasRestantes.length === 0) return alert("Não há rotas pendentes para desenhar no mapa.");
        document.getElementById("modalMapa").style.display = "flex";
        
        if (!mapaTecnico) {
            let startLat = rotasRestantes[0].lat; let startLon = rotasRestantes[0].lon;
            mapaTecnico = L.map('mapaTecnico').setView([startLat, startLon], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(mapaTecnico);
        }

        if(layerGrupoTecnico) mapaTecnico.removeLayer(layerGrupoTecnico);
        layerGrupoTecnico = L.featureGroup().addTo(mapaTecnico);

        let latlngs = [];
        itinerarioDia.forEach((cliente, index) => {
            if (cliente.status === 'sucesso' || cliente.status === 'insucesso') return;
            const seq = index + 1;
            latlngs.push([cliente.lat, cliente.lon]);
            let corPino = "#64748B";
            if (cliente.status === 'deslocamento') corPino = "#FACC15"; 
            else if (cliente.status === 'chegada') corPino = "#F97316"; 
            const miniIcon = L.divIcon({ className: 'custom-pin', html: `<div style="background-color: ${corPino}; color: white; border-radius: 50%; width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; font-weight: bold; border: 2px solid white; box-shadow: 0 3px 6px rgba(0,0,0,0.5); font-size: 12px;">${seq}</div>`, iconSize: [24, 24], iconAnchor: [12, 12] });
            L.marker([cliente.lat, cliente.lon], {icon: miniIcon}).bindPopup(`<b>#${seq} - ${cliente.cliente}</b><br>OS: ${cliente.codigo}`).addTo(layerGrupoTecnico);
        });

        if(latlngs.length > 0) {
            L.polyline(latlngs, {color: '#3B82F6', weight: 3, dashArray: '5, 5'}).addTo(layerGrupoTecnico);
            mapaTecnico.fitBounds(layerGrupoTecnico.getBounds(), {padding: [30, 30]});
        }
        setTimeout(() => { mapaTecnico.invalidateSize(); }, 300);
    }

    function fecharMapa() { document.getElementById("modalMapa").style.display = "none"; }
    function sair() { localStorage.clear(); window.location.replace("/login.html"); }

    buscarRotaDoServidor();
</script>
</body>
</html>
