<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diário de Bordo - NERI</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0F172A; 
            color: white; 
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Cabeçalho Fixo */
        .header { 
            background-color: #1E293B; 
            padding: 20px 15px; 
            text-align: center; 
            border-bottom: 3px solid #3B82F6; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h2 { margin: 0; font-size: 18px; color: #E2E8F0; text-transform: uppercase; letter-spacing: 1px; }
        .header p { margin: 5px 0 0 0; color: #94A3B8; font-size: 13px; font-weight: bold; }
        .btn-sair { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            background: rgba(239, 68, 68, 0.1); 
            color: #EF4444; 
            border: 1px solid #EF4444; 
            padding: 6px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
        }

        .container { padding: 20px 15px; padding-bottom: 80px; }
        
        .card-aviso { 
            background-color: #1E293B; 
            padding: 30px 20px; 
            text-align: center; 
            border-radius: 12px; 
            margin-top: 30px; 
            border: 1px solid rgba(255,255,255,0.05); 
        }
        
        /* Cartão da Paragem Atual */
        .cliente-card { 
            background: linear-gradient(145deg, #1E293B, #172033); 
            padding: 25px 20px; 
            border-radius: 16px; 
            border-left: 5px solid #3B82F6; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.4); 
        }
        .cliente-card h3 { 
            margin: 0 0 15px 0; 
            font-size: 18px; 
            color: #60A5FA; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .badge-os { 
            color: white; 
            font-size: 14px; 
            background: #3B82F6; 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-weight: bold;
        }
        
        .info-linha { margin-bottom: 12px; }
        .info-titulo { color: #94A3B8; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 2px; }
        .info-valor { color: #F8FAFC; font-size: 16px; font-weight: 500; }
        
        /* Botões de Ação */
        .botoes-acao { display: flex; flex-direction: column; gap: 12px; margin-top: 25px; }
        
        .btn-gigante { 
            width: 100%;
            padding: 18px; 
            font-size: 16px; 
            font-weight: bold; 
            text-align: center; 
            border-radius: 10px; 
            border: none; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        
        .btn-waze { background-color: #00C3FF; color: #0F172A; }
        .btn-maps { background-color: #10B981; color: white; }
        .btn-cheguei { background-color: #F59E0B; color: white; margin-top: 15px; }
        .btn-finalizar { background-color: #EF4444; color: white; }
        
        .btn-gigante:active { transform: scale(0.98); }
        .btn-gigante:disabled { opacity: 0.5; pointer-events: none; }

        .estado-servico {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #10B981;
            display: none;
            padding: 10px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 8px;
        }

        .progresso-texto { text-align: center; margin-top: 25px; font-size: 13px; color: #64748B; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <button class="btn-sair" onclick="sair()">🚪 Sair</button>
        <h2 id="nomeTecnico">Carregando...</h2>
        <p id="dataHoje">Buscando Rota...</p>
    </div>

    <div class="container" id="telaPrincipal">
        <!-- O conteúdo dinâmico é injetado aqui -->
    </div>

<script>
    const token = localStorage.getItem("token");
    const nomeUsuario = localStorage.getItem("nomeUsuario"); 
    const tipoUsuario = localStorage.getItem("usuarioTipo");
    
    // Bloqueio de segurança
    if (!token || tipoUsuario !== "tecnico") {
        window.location.replace("/login.html");
    }

    // Limpa o nome para mostrar apenas o primeiro e último nome
    const nomePartes = nomeUsuario.split(' ');
    const nomeCurto = nomePartes.length > 1 ? `${nomePartes[0]} ${nomePartes[nomePartes.length-1]}` : nomePartes[0];
    document.getElementById("nomeTecnico").innerText = `🚗 ${nomeCurto}`;

    let rotaDoDia = [];
    let clienteAtualIndex = parseInt(localStorage.getItem("paragemAtualIndex")) || 0;

    async function buscarRotaDoServidor() {
        const dataAtual = new Date();
        const dia = String(dataAtual.getDate()).padStart(2, '0');
        const mes = String(dataAtual.getMonth() + 1).padStart(2, '0');
        const ano = dataAtual.getFullYear();
        const hojeBR = `${dia}/${mes}/${ano}`;
        
        document.getElementById("dataHoje").innerText = `📅 Rota de ${hojeBR}`;

        try {
            const res = await fetch(`/api/rotas?data=${encodeURIComponent(hojeBR)}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const rotasDeHoje = await res.json();

            // Encontra a rota específica deste técnico
            const minhaRota = rotasDeHoje.find(r => r.tecnico.toUpperCase() === nomeUsuario.toUpperCase());

            if (minhaRota && minhaRota.itinerario && minhaRota.itinerario.length > 0) {
                rotaDoDia = minhaRota.itinerario;
                renderizarClienteAtual();
            } else {
                mostrarAviso("Nenhum roteiro enviado para si hoje.<br><br>☕ Bom descanso!");
            }

        } catch (e) {
            mostrarAviso("Falha de ligação com a central. Tente recarregar a página.");
        }
    }

    function renderizarClienteAtual() {
        // Guarda o progresso no telemóvel para se ele fechar o navegador sem querer, não perder a viagem
        localStorage.setItem("paragemAtualIndex", clienteAtualIndex);

        if (clienteAtualIndex >= rotaDoDia.length) {
            return mostrarAviso("🎉 Parabéns!<br><br>Você finalizou todas as ordens de serviço planeadas para hoje.<br><br>Pode retornar à base.");
        }

        const cliente = rotaDoDia[clienteAtualIndex];
        const tela = document.getElementById("telaPrincipal");

        // Links Universais de Navegação (Funcionam em Android e iOS)
        const wazeUrl = `https://waze.com/ul?ll=${cliente.lat},${cliente.lon}&navigate=yes`;
        const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${cliente.lat},${cliente.lon}`;

        tela.innerHTML = `
            <div class="cliente-card">
                <h3>Paragem #${clienteAtualIndex + 1} <span class="badge-os">OS: ${cliente.codigo}</span></h3>
                
                <div class="info-linha">
                    <span class="info-titulo">Cliente</span>
                    <span class="info-valor">${cliente.cliente}</span>
                </div>
                
                <div class="info-linha">
                    <span class="info-titulo">Serviço Solicitado</span>
                    <span class="info-valor" style="color: #F59E0B;">${cliente.servico || 'Não especificado'}</span>
                </div>

                <div class="info-linha">
                    <span class="info-titulo">Endereço de Destino</span>
                    <span class="info-valor">${cliente.rua}, ${cliente.cidade}</span>
                </div>
                
                <div id="statusCheckIn" class="estado-servico">✔️ Chegada Registada! Em atendimento.</div>

                <div class="botoes-acao">
                    <div style="display:flex; gap:10px;">
                        <button class="btn-gigante btn-waze" id="btnWaze" onclick="window.open('${wazeUrl}', '_blank')">
                            🧭 Waze
                        </button>
                        <button class="btn-gigante btn-maps" id="btnMaps" onclick="window.open('${mapsUrl}', '_blank')">
                            🗺️ Maps
                        </button>
                    </div>
                    
                    <button class="btn-gigante btn-cheguei" id="btnCheguei" onclick="marcarChegada()">
                        📍 Registar Chegada
                    </button>
                    
                    <button class="btn-gigante btn-finalizar" id="btnFinalizar" onclick="finalizarServico()" style="display:none;">
                        🏁 Finalizar Serviço
                    </button>
                </div>
            </div>
            
            <div class="progresso-texto">
                Progresso: ${clienteAtualIndex} de ${rotaDoDia.length} serviços concluídos.
            </div>
        `;
    }

    function marcarChegada() {
        // Altera a interface visual para modo "Em Atendimento"
        document.getElementById('btnWaze').style.display = 'none';
        document.getElementById('btnMaps').style.display = 'none';
        document.getElementById('btnCheguei').style.display = 'none';
        
        document.getElementById('statusCheckIn').style.display = 'block';
        document.getElementById('btnFinalizar').style.display = 'flex';
        
        // (No futuro, este botão enviará o horário exato para o server.js)
    }

    function finalizarServico() {
        if(confirm("Confirma a conclusão do serviço nesta OS?")) {
            // (No futuro, este botão enviará o horário de saída para o server.js)
            clienteAtualIndex++; 
            renderizarClienteAtual();
        }
    }

    function mostrarAviso(msg) {
        document.getElementById("telaPrincipal").innerHTML = `
            <div class="card-aviso">
                <h3 style="color:#94A3B8; font-size:18px; line-height: 1.5;">${msg}</h3>
            </div>
        `;
    }

    function sair() {
        localStorage.clear();
        window.location.replace("/login.html");
    }

    // Inicia a aplicação e carrega a rota
    buscarRotaDoServidor();
</script>
</body>
</html>
