<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel de Fila - NERI</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0F172A; color: white; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background: #1E293B; border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; padding: 20px; }
        .menu button { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #94A3B8; padding: 12px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 14px; transition: 0.2s; width: 100%; }
        .menu button:hover { background: rgba(255,255,255,0.05); color: white; }
        .btn-sair { color: #EF4444 !important; border-color: rgba(239,68,68,0.3) !important; margin-top: auto; }
        
        .main { padding: 25px; display: flex; flex-direction: column; gap: 20px; height: 100vh; overflow-y: auto; flex: 1; box-sizing: border-box;}
        .abas-nav { display: flex; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .aba-btn { background: transparent; border: none; color: #94A3B8; font-size: 16px; font-weight: bold; cursor: pointer; padding: 10px 20px; border-radius: 8px; transition: 0.2s; }
        .aba-btn.ativa { background: rgba(59, 130, 246, 0.2); color: #3B82F6; }
        
        .fila-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-top: 20px; }
        .fila-card { background: #1E293B; border: 1px solid rgba(255,255,255,0.05); border-left: 5px solid #64748B; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: all 0.3s; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .tec-nome { font-size: 18px; font-weight: bold; color: white; margin: 0; }
        .tec-hora { font-size: 12px; color: #94A3B8; }
        .status-badge { font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }
        
        .botoes-acao { display: flex; gap: 10px; margin-top: 10px; }
        .btn-finalizar { flex: 1; background: #10B981; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center;}
        
        .painel-controles { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 15px; }
        .box-controle { flex: 1; min-width: 300px; background: #1E293B; padding: 15px; border-radius: 8px; display: flex; gap: 10px; align-items: flex-end; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script>function navegarSeguro(rota) { window.location.href = `${rota}?token=${localStorage.getItem("token")}`; }</script>
</head>
<body>

<div class="sidebar">
    <div class="logo-area"><img src="logo.svg" alt="Logo NERI" style="max-width: 100%; margin-bottom: 20px;" onerror="this.style.display='none'" /></div>
    <div class="menu">
        <button onclick="navegarSeguro('/index.html')">📊 Dashboard Geral</button>
        <button onclick="navegarSeguro('/dados.html')">📂 Lançar Dados</button>
        <button onclick="navegarSeguro('/roteirizador.html')">🗺️ Roteirizador</button>
        <button style="background: #2563EB; color: white; border-color: #3B82F6;">🗣️ Triagem e Ponto</button>
        <button onclick="navegarSeguro('/estoque.html')">📦 Almoxarifado</button>
        <button onclick="localStorage.clear(); window.location.replace('/login.html')" class="btn-sair" style="margin-top: 20px;">🚪 Sair</button>
    </div>
</div>

<div class="main">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h1 style="margin: 0 0 5px 0; font-size: 24px;">Controle da Base (Doca)</h1>
            <p style="margin: 0; color: #94A3B8; font-size: 14px;">Painel de Chegadas: Acompanhe a ordem e chame no microfone.</p>
        </div>
        <button onclick="limparTodaFila()" style="background: #EF4444; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer;">🧹 Limpar Tela (Finalizar Todos)</button>
    </div>

    <div class="abas-nav" style="margin-top: 15px;">
        <button class="aba-btn ativa" onclick="mudarAba('fila')">📍 Fila ao Vivo</button>
    </div>

    <div id="abaFila">
        <div class="painel-controles">
            <!-- BOX 1: Entrada Manual -->
            <div class="box-controle" style="border: 1px dashed rgba(255,255,255,0.2);">
                <div style="flex: 1;">
                    <label style="font-size:12px; color:#94A3B8; display:block; margin-bottom:5px;">Entrada Manual</label>
                    <select id="manualTecnico" style="width:100%; padding:10px; background:#0F172A; color:white; border:1px solid rgba(255,255,255,0.1); border-radius:8px;">
                        <option value="">Selecione o funcionário...</option>
                    </select>
                </div>
                <button onclick="registrarEntradaManual()" style="padding:10px 20px; background:#8B5CF6; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">➕ Entrada</button>
            </div>

            <!-- BOX 2: MICROFONE -->
            <div class="box-controle" style="border: 1px solid rgba(59, 130, 246, 0.4); background: rgba(59, 130, 246, 0.05);">
                <div style="flex: 1;">
                    <label style="font-size:12px; color:#60A5FA; display:block; margin-bottom:5px; font-weight:bold;">📢 Chamar no Totem (Microfone)</label>
                    <select id="listaCascataChamada" style="width:100%; padding:10px; background:#0F172A; color:white; border:1px solid rgba(59, 130, 246, 0.3); border-radius:8px;">
                        <option value="">Aguardando técnicos chegarem...</option>
                    </select>
                </div>
                <button onclick="chamarPelaLista()" style="padding:10px 20px; background:#3B82F6; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">🗣️ Emitir Chamada</button>
            </div>
        </div>

        <div class="fila-grid" id="containerFila"></div>
        <div id="msgFilaVazia" style="display:none; text-align:center; padding: 40px; color: #94A3B8; background: #1E293B; border-radius: 12px; margin-top:20px;">
            Nenhum técnico na fila no momento.
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem("token");
    if (!token) window.location.replace("/login.html");
    
    let filaAtual = [];

    document.addEventListener("DOMContentLoaded", async () => {
        await carregarListaTecnicosParaFiltro();
        atualizarFila();
        setInterval(atualizarFila, 4000); 
    });

    async function carregarListaTecnicosParaFiltro() {
        try {
            const res = await fetch("/api/equipe-totem", { headers: { "Authorization": `Bearer ${token}` } });
            const equipe = await res.json();
            const comboManual = document.getElementById("manualTecnico");
            comboManual.innerHTML = `<option value="">Selecione o funcionário...</option>`;
            equipe.forEach(p => { comboManual.innerHTML += `<option value="${p.nome}">${p.nome}</option>`; });
        } catch(e) {}
    }

    async function registrarEntradaManual() {
        const nome = document.getElementById("manualTecnico").value;
        if (!nome) return alert("Selecione um funcionário na lista primeiro!");
        const agora = new Date();
        const dataAtual = `${String(agora.getDate()).padStart(2, '0')}/${String(agora.getMonth() + 1).padStart(2, '0')}/${agora.getFullYear()}`;
        const horaAtual = agora.toLocaleTimeString('pt-BR', { hour12: false }).substring(0, 5);

        try {
            await fetch('/api/fila/bipar', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ codigoBarras: nome, dataBatida: dataAtual, horaBatida: horaAtual })
            });
            document.getElementById("manualTecnico").value = ""; 
            atualizarFila();
        } catch (err) {}
    }

    async function atualizarFila() {
        const dataHoje = new Date().toLocaleDateString('pt-BR');
        try {
            const res = await fetch(`/api/fila/hoje?data=${encodeURIComponent(dataHoje)}`, { headers: { "Authorization": `Bearer ${token}` } });
            filaAtual = await res.json();
            desenharFila();
        } catch(e) {}
    }

    function desenharFila() {
        const container = document.getElementById("containerFila");
        const selectChamada = document.getElementById("listaCascataChamada");
        const valorSelecionado = selectChamada.value;
        
        container.innerHTML = "";
        
        // Remove os Finalizados para limpar a tela
        const filaVisivel = filaAtual.filter(i => i.status !== "Finalizado");
        
        if (filaVisivel.length === 0) { 
            document.getElementById("msgFilaVazia").style.display = "block"; 
            selectChamada.innerHTML = '<option value="">Fila vazia...</option>';
            return; 
        }
        
        document.getElementById("msgFilaVazia").style.display = "none";
        selectChamada.innerHTML = '';

        // Preenche Cascata
        const tecnicosNaBase = filaVisivel.filter(item => item.status !== "Liberado");
        tecnicosNaBase.sort((a, b) => a.tecnico.localeCompare(b.tecnico));
        
        if(tecnicosNaBase.length === 0) {
            selectChamada.innerHTML = '<option value="">Todos já foram liberados!</option>';
        } else {
            tecnicosNaBase.forEach(item => {
                const isSelected = item._id === valorSelecionado ? "selected" : "";
                selectChamada.innerHTML += `<option value="${item._id}" ${isSelected}>${item.tecnico}</option>`;
            });
        }

        // Desenha Cards
        filaVisivel.forEach((item, index) => {
            let isAtendido = item.status === "Liberado";
            let corBorda = item.atrasado ? "#EF4444" : (isAtendido ? "#10B981" : "#3B82F6"); 
            let badgeHtml = item.atrasado ? `<span class="status-badge" style="background:rgba(239, 68, 68, 0.2); color:#F87171; margin-left:10px;">⏰ Atrasado</span>` : `<span class="status-badge" style="background:rgba(16, 185, 129, 0.2); color:#34D399; margin-left:10px;">✅ No Horário</span>`;
            
            let statusCor = isAtendido ? "#10B981" : "#94A3B8"; 
            let statusTexto = isAtendido ? "✅ Liberado p/ Rua" : "Aguardando Despacho";
            
            let opacity = isAtendido ? "0.5" : "1";
            let pointerEvents = isAtendido ? "display: none;" : "";

            container.innerHTML += `
                <div class="fila-card" style="border-left-color: ${corBorda}; opacity: ${opacity};">
                    <div class="card-header">
                        <div>
                            <span style="color:#60A5FA; font-size:12px; font-weight:bold;">Chegada #${index + 1}</span>
                            <h3 class="tec-nome">${item.tecnico}</h3>
                            <div class="tec-hora">Entrou às ${item.horaChegada} ${badgeHtml}</div>
                        </div>
                        <div style="color: ${statusCor}; font-size:12px; font-weight:bold;">${statusTexto}</div>
                    </div>
                    <div class="botoes-acao" style="${pointerEvents}">
                        <button class="btn-finalizar" onclick="alterarStatusFila('${item._id}', 'Liberado')">✅ Confirmar Liberação</button>
                    </div>
                </div>
            `;
        });
    }

    async function chamarPelaLista() {
        const idRegistro = document.getElementById("listaCascataChamada").value;
        if (!idRegistro) return alert("Selecione um técnico!");
        
        try {
            await fetch(`/api/fila/${idRegistro}/status`, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ status: 'Aguardando' }) });
            await fetch(`/api/fila/${idRegistro}/chamar-totem`, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } });
            
            const btn = document.querySelector("button[onclick='chamarPelaLista()']");
            btn.innerHTML = "✅ Chamado!"; btn.style.background = "#10B981";
            setTimeout(() => { btn.innerHTML = "🗣️ Emitir Chamada"; btn.style.background = "#3B82F6"; }, 1500);
            atualizarFila();
        } catch(e) {}
    }

    async function alterarStatusFila(idRegistro, novoStatus) {
        try {
            await fetch(`/api/fila/${idRegistro}/status`, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ status: novoStatus }) });
            atualizarFila();
        } catch(e) {}
    }

    // NOVA FUNÇÃO: Limpar toda a tela de uma vez!
    async function limparTodaFila() {
        if (!confirm("Tem certeza que deseja limpar todos os cards da tela? Eles serão marcados como finalizados e ocultados.")) return;
        
        const filaVisivel = filaAtual.filter(i => i.status !== "Finalizado");
        for(let item of filaVisivel) {
            await fetch(`/api/fila/${item._id}/status`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ status: 'Finalizado' })
            });
        }
        alert("Tela limpa com sucesso!");
        atualizarFila();
    }
</script>
</body>
</html>
