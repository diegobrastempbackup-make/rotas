<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<title>NERI Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  font-family:Arial;

  background:
    linear-gradient(
      135deg,
      #020617,
      #0F172A,
      #111827
    );

  color:white;
}

.container{
  display:flex;
}

/* SIDEBAR */

.sidebar{

  width:250px;

  background:
    rgba(15,23,42,0.95);

  backdrop-filter:blur(10px);

  height:100vh;

  padding:20px;

  overflow:auto;

  border-right:
    1px solid rgba(255,255,255,0.05);

  box-shadow:
    5px 0 20px rgba(0,0,0,0.4);

  display:flex;

  flex-direction:column;
}

/* LOGO */

.logo-area{

  display:flex;

  flex-direction:column;

  align-items:center;

  margin-bottom:25px;
}

.logo{

  width:120px;

  margin-bottom:10px;

  transition:0.4s;

  filter:
    drop-shadow(
      0 0 15px
      rgba(59,130,246,0.5)
    );
}

.logo:hover{

  transform:scale(1.05);

  filter:
    drop-shadow(
      0 0 25px
      rgba(59,130,246,0.8)
    );
}

.sidebar h2{

  margin:0;

  color:#60A5FA;

  font-size:28px;
}

/* MENU */

.sidebar p{

  cursor:pointer;

  padding:12px;

  border-radius:10px;

  margin:5px 0;

  transition:0.3s;

  font-weight:bold;
}

.sidebar p:hover{

  background:
    linear-gradient(
      90deg,
      #2563EB,
      #3B82F6
    );

  transform:translateX(5px);
}

.sidebar input,
.sidebar button{

  width:100%;

  margin-top:10px;

  padding:12px;

  border:none;

  border-radius:10px;
}

.sidebar input{

  background:#1E293B;

  color:white;
}

.sidebar button{

  background:
    linear-gradient(
      90deg,
      #2563EB,
      #3B82F6
    );

  color:white;

  cursor:pointer;

  font-weight:bold;

  transition:0.3s;
}

.sidebar button:hover{

  transform:scale(1.03);

  box-shadow:
    0 0 15px rgba(59,130,246,0.5);
}

/* FOOTER */

.footer{

  margin-top:auto;

  text-align:center;

  font-size:12px;

  color:#94A3B8;

  opacity:0.8;

  padding-top:30px;
}

/* MAIN */

.main{

  flex:1;

  padding:25px;
}

/* CARDS */

.cards{

  display:flex;

  gap:20px;

  flex-wrap:wrap;
}

.card{

  background:
    linear-gradient(
      145deg,
      rgba(30,41,59,0.95),
      rgba(15,23,42,0.95)
    );

  border-radius:20px;

  padding:25px;

  flex:1;

  min-width:220px;

  border:
    1px solid rgba(255,255,255,0.05);

  box-shadow:
    0 10px 25px rgba(0,0,0,0.4);

  transition:0.3s;
}

.card:hover{

  transform:translateY(-5px);

  box-shadow:
    0 15px 35px rgba(0,0,0,0.5);
}

.card h3{

  margin-top:0;

  color:#93C5FD;
}

.card p{

  font-size:28px;

  font-weight:bold;

  margin-top:15px;
}

/* GRÁFICOS */

.graficos{

  display:flex;

  gap:20px;

  margin-top:30px;

  flex-wrap:wrap;
}

.grafico{

  background:
    linear-gradient(
      145deg,
      rgba(30,41,59,0.95),
      rgba(15,23,42,0.95)
    );

  border-radius:20px;

  padding:20px;

  flex:1;

  min-width:350px;

  height:450px;

  border:
    1px solid rgba(255,255,255,0.05);

  box-shadow:
    0 10px 30px rgba(0,0,0,0.45);
}

canvas{

  width:100% !important;

  height:100% !important;
}

</style>

</head>

<body>

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<!-- LOGO -->

<div class="logo-area">

<img
  src="logo.png"
  class="logo"
/>

<h2>Dashboard</h2>

</div>

<!-- MENU -->

<p onclick="filtrar('TODOS')">
📊 Geral
</p>

<p onclick="filtrar('Sibele')">
Sibele
</p>

<p onclick="filtrar('Empresa')">
Empresa
</p>

<p onclick="filtrar('Danilo')">
Danilo
</p>

<p onclick="filtrar('José Cicero')">
José Cicero
</p>

<p onclick="filtrar('Alex')">
Alex
</p>

<p onclick="filtrar('Danilo BH')">
Danilo BH
</p>

<p onclick="filtrar('Thiago BH')">
Thiago BH
</p>

<hr>

<h3>Filtrar por mês</h3>

<input
  type="month"
  id="mesFiltro"
>

<button onclick="filtrarMes()">
🔍 Buscar
</button>

<button onclick="limparFiltro()">
♻ Limpar Filtro
</button>

<hr>

<button onclick="gerarPDF()">
📄 Extrair Relatório
</button>

<hr>

<input
  type="password"
  id="senha"
  placeholder="Senha"
>

<button onclick="acessar()">
📂 Ir para Dados
</button>

<!-- FOOTER -->

<div class="footer">

© Diego Neri

</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- CARDS -->

<div class="cards">

<div class="card">

<h3>💰 Gasto Total</h3>

<p id="gastoTotal">
R$ 0,00
</p>

</div>

<div class="card">

<h3>🛣 KM Total</h3>

<p id="kmTotal">
0 KM
</p>

</div>

<div class="card">

<h3>👤 Individual</h3>

<p id="gastoIndividual">
R$ 0,00
</p>

<p id="kmIndividual">
0 KM
</p>

</div>

</div>

<!-- GRÁFICOS -->

<div class="graficos">

<div class="grafico">
<canvas id="g1"></canvas>
</div>

<div class="grafico">
<canvas id="g2"></canvas>
</div>

</div>

</div>

</div>

<script>

// TÉCNICOS

const tecnicos = [

  "Sibele",
  "Empresa",
  "Danilo",
  "José Cicero",
  "Alex",
  "Danilo BH",
  "Thiago BH"

];

let dadosGlobal = [];

let tecnicoAtual = "TODOS";

let grafico1;
let grafico2;

// ACESSAR

function acessar(){

  const senha =
    document.getElementById(
      "senha"
    ).value;

  if(senha === "Brastemp1234"){

    window.location.href =
      "/dados.html";

  }else{

    alert("Senha incorreta");

  }

}

// MÊS ATUAL

function obterMesAtual(){

  const hoje = new Date();

  const ano =
    hoje.getFullYear();

  const mes = String(
    hoje.getMonth() + 1
  ).padStart(2,"0");

  return `${ano}-${mes}`;

}

// FILTRO MÊS

function dadosPorMes(mes){

  return dadosGlobal.filter(d=>{

    if(!d.data)
      return false;

    return d.data.startsWith(mes);

  });

}

// CARREGAR

async function carregarDados(){

  const res =
    await fetch("/registros");

  dadosGlobal =
    await res.json();

  dadosGlobal.sort((a,b)=>{

    return new Date(a.data)
      - new Date(b.data);

  });

  const mesAtual =
    obterMesAtual();

  document.getElementById(
    "mesFiltro"
  ).value = mesAtual;

  const filtrado =
    dadosPorMes(mesAtual);

  processar(
    filtrado,
    tecnicoAtual
  );

}

// FILTRAR TÉCNICO

function filtrar(nome){

  tecnicoAtual = nome;

  const mes =
    document.getElementById(
      "mesFiltro"
    ).value;

  const filtrado =
    dadosPorMes(mes);

  processar(
    filtrado,
    tecnicoAtual
  );

}

// FILTRAR MÊS

function filtrarMes(){

  const mes =
    document.getElementById(
      "mesFiltro"
    ).value;

  const filtrado =
    dadosPorMes(mes);

  processar(
    filtrado,
    tecnicoAtual
  );

}

// LIMPAR FILTRO

function limparFiltro(){

  const mesAtual =
    obterMesAtual();

  document.getElementById(
    "mesFiltro"
  ).value = mesAtual;

  const filtrado =
    dadosPorMes(mesAtual);

  processar(
    filtrado,
    tecnicoAtual
  );

}

// PROCESSAR

function processar(
  dados,
  tecnico
){

  let valores =
    Array(tecnicos.length)
    .fill(0);

  let kms =
    Array(tecnicos.length)
    .fill(0);

  dados.forEach(d=>{

    if(
      tecnico === "TODOS" ||
      d.tecnico === tecnico
    ){

      const i =
        tecnicos.indexOf(
          d.tecnico
        );

      if(i >= 0){

        kms[i] +=
          Number(d.km) || 0;

        valores[i] +=
          Number(d.valor) || 0;

      }

    }

  });

  atualizarDashboard(
    valores,
    kms,
    tecnico
  );

}

// DASHBOARD

function atualizarDashboard(
  valores,
  kms,
  tecnico
){

  const totalValor =
    valores.reduce((a,b)=>a+b,0);

  const totalKm =
    kms.reduce((a,b)=>a+b,0);

  document.getElementById(
    "gastoTotal"
  ).innerText =

    "R$ " +
    totalValor.toFixed(2);

  document.getElementById(
    "kmTotal"
  ).innerText =

    totalKm + " KM";

  if(tecnico !== "TODOS"){

    const i =
      tecnicos.indexOf(tecnico);

    document.getElementById(
      "gastoIndividual"
    ).innerText =

      "R$ " +
      valores[i].toFixed(2);

    document.getElementById(
      "kmIndividual"
    ).innerText =

      kms[i] + " KM";

  }else{

    document.getElementById(
      "gastoIndividual"
    ).innerText =

      "R$ 0,00";

    document.getElementById(
      "kmIndividual"
    ).innerText =

      "0 KM";

  }

  if(grafico1) grafico1.destroy();
  if(grafico2) grafico2.destroy();

  // GRÁFICO 1

  const ctx1 =
    document.getElementById("g1")
    .getContext("2d");

  const grad1 =
    ctx1.createLinearGradient(
      0,0,0,400
    );

  grad1.addColorStop(
    0,
    "#60A5FA"
  );

  grad1.addColorStop(
    1,
    "#2563EB"
  );

  grafico1 =
    new Chart(ctx1,{

    type:"bar",

    data:{

      labels:tecnicos,

      datasets:[{

        label:"Gastos",

        data:valores,

        backgroundColor:grad1,

        borderRadius:10,

        borderSkipped:false

      }]

    },

    plugins:[ChartDataLabels],

    options:{

      responsive:true,

      maintainAspectRatio:false,

      plugins:{

        legend:{
          labels:{
            color:"#fff"
          }
        },

        title:{

          display:true,

          text:
            "💰 CONSUMO GERAL",

          color:"#fff",

          font:{
            size:20,
            weight:"bold"
          }

        },

        datalabels:{

          color:"#fff",

          anchor:"end",

          align:"top",

          formatter:(value)=>{

            return "R$ " +
              value.toFixed(0);

          }

        }

      },

      scales:{

        x:{

          ticks:{
            color:"#fff"
          },

          grid:{
            display:false
          }

        },

        y:{

          ticks:{
            color:"#CBD5E1"
          },

          grid:{
            color:
              "rgba(255,255,255,0.08)"
          }

        }

      }

    }

  });

  // GRÁFICO 2

  const ctx2 =
    document.getElementById("g2")
    .getContext("2d");

  const grad2 =
    ctx2.createLinearGradient(
      0,0,0,400
    );

  grad2.addColorStop(
    0,
    "#34D399"
  );

  grad2.addColorStop(
    1,
    "#059669"
  );

  grafico2 =
    new Chart(ctx2,{

    type:"bar",

    data:{

      labels:tecnicos,

      datasets:[{

        label:"KM",

        data:kms,

        backgroundColor:grad2,

        borderRadius:10,

        borderSkipped:false

      }]

    },

    plugins:[ChartDataLabels],

    options:{

      responsive:true,

      maintainAspectRatio:false,

      plugins:{

        legend:{
          labels:{
            color:"#fff"
          }
        },

        title:{

          display:true,

          text:
            "🛣 KM GERAL",

          color:"#fff",

          font:{
            size:20,
            weight:"bold"
          }

        },

        datalabels:{

          color:"#fff",

          anchor:"end",

          align:"top",

          formatter:(value)=>{

            return value + " KM";

          }

        }

      },

      scales:{

        x:{

          ticks:{
            color:"#fff"
          },

          grid:{
            display:false
          }

        },

        y:{

          ticks:{
            color:"#CBD5E1"
          },

          grid:{
            color:
              "rgba(255,255,255,0.08)"
          }

        }

      }

    }

  });

}

// PDF

function gerarPDF(){

  const { jsPDF } = window.jspdf;

  const doc = new jsPDF();

  let y = 10;

  doc.setFontSize(18);

  doc.text(
    "RELATÓRIO DE KM",
    10,
    y
  );

  y += 15;

  // MÊS FILTRADO

  const mes =
    document.getElementById(
      "mesFiltro"
    ).value;

  const filtrado =
    dadosPorMes(mes);

  // GERAL

  if(tecnicoAtual === "TODOS"){

    tecnicos.forEach(nome=>{

      const dadosTecnico =
        filtrado.filter(
          d => d.tecnico === nome
        );

      if(dadosTecnico.length === 0)
        return;

      // TÍTULO

      doc.setFontSize(14);

      doc.text(
        "===================================",
        10,
        y
      );

      y += 8;

      doc.text(
        nome,
        10,
        y
      );

      y += 8;

      doc.text(
        "===================================",
        10,
        y
      );

      y += 10;

      let totalKm = 0;
      let totalValor = 0;
      let totalLitros = 0;

      dadosTecnico.forEach(d=>{

        totalKm +=
          Number(d.km) || 0;

        totalValor +=
          Number(d.valor) || 0;

        totalLitros +=
          Number(d.litros) || 0;

        doc.setFontSize(10);

        doc.text(

`${d.data} | KM: ${d.km} | Litros: ${d.litros} | Valor: R$ ${Number(d.valor).toFixed(2)}`,

          10,
          y

        );

        y += 7;

        // NOVA PÁGINA

        if(y > 280){

          doc.addPage();

          y = 10;

        }

      });

      y += 5;

      // TOTAIS

      doc.setFontSize(11);

      doc.text(
        `TOTAL KM: ${totalKm} KM`,
        10,
        y
      );

      y += 7;

      doc.text(
        `TOTAL LITROS: ${totalLitros.toFixed(2)} L`,
        10,
        y
      );

      y += 7;

      doc.text(
        `TOTAL GASTO: R$ ${totalValor.toFixed(2)}`,
        10,
        y
      );

      y += 15;

    });

  }else{

    // INDIVIDUAL

    const dadosTecnico =
      filtrado.filter(
        d => d.tecnico === tecnicoAtual
      );

    let totalKm = 0;
    let totalValor = 0;
    let totalLitros = 0;

    doc.setFontSize(14);

    doc.text(
      tecnicoAtual,
      10,
      y
    );

    y += 12;

    dadosTecnico.forEach(d=>{

      totalKm +=
        Number(d.km) || 0;

      totalValor +=
        Number(d.valor) || 0;

      totalLitros +=
        Number(d.litros) || 0;

      doc.setFontSize(10);

      doc.text(

`${d.data} | KM: ${d.km} | Litros: ${d.litros} | Valor: R$ ${Number(d.valor).toFixed(2)}`,

        10,
        y

      );

      y += 8;

      // NOVA PÁGINA

      if(y > 280){

        doc.addPage();

        y = 10;

      }

    });

    y += 5;

    // TOTAIS

    doc.setFontSize(12);

    doc.text(
      `TOTAL KM: ${totalKm} KM`,
      10,
      y
    );

    y += 8;

    doc.text(
      `TOTAL LITROS: ${totalLitros.toFixed(2)} L`,
      10,
      y
    );

    y += 8;

    doc.text(
      `TOTAL GASTO: R$ ${totalValor.toFixed(2)}`,
      10,
      y
    );

  }

  doc.save("relatorio.pdf");

}

// INICIAR

carregarDados();

</script>

</body>
</html>
