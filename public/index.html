<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<title>NERI Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  font-family:Arial;

  background:
    linear-gradient(
      135deg,
      #020617,
      #0F172A,
      #111827
    );

  color:white;
}

.container{
  display:flex;
}

/* SIDEBAR */

.sidebar{

  width:250px;

  background:
    rgba(15,23,42,0.95);

  backdrop-filter:blur(10px);

  height:100vh;

  padding:20px;

  overflow:auto;

  border-right:
    1px solid rgba(255,255,255,0.05);

  box-shadow:
    5px 0 20px rgba(0,0,0,0.4);

  display:flex;

  flex-direction:column;
}

/* LOGO */

.logo-area{

  display:flex;

  flex-direction:column;

  align-items:center;

  margin-bottom:25px;
}

.logo{

  width:120px;

  margin-bottom:10px;

  transition:0.4s;

  filter:
    drop-shadow(
      0 0 15px
      rgba(59,130,246,0.5)
    );
}

.logo:hover{

  transform:scale(1.05);

  filter:
    drop-shadow(
      0 0 25px
      rgba(59,130,246,0.8)
    );
}

.sidebar h2{

  margin:0;

  color:#60A5FA;

  font-size:28px;
}

/* MENU */

.sidebar p{

  cursor:pointer;

  padding:12px;

  border-radius:10px;

  margin:5px 0;

  transition:0.3s;

  font-weight:bold;
}

.sidebar p:hover{

  background:
    linear-gradient(
      90deg,
      #2563EB,
      #3B82F6
    );

  transform:translateX(5px);
}

.sidebar input,
.sidebar button{

  width:100%;

  margin-top:10px;

  padding:12px;

  border:none;

  border-radius:10px;
}

.sidebar input{

  background:#1E293B;

  color:white;
}

.sidebar button{

  background:
    linear-gradient(
      90deg,
      #2563EB,
      #3B82F6
    );

  color:white;

  cursor:pointer;

  font-weight:bold;

  transition:0.3s;
}

.sidebar button:hover{

  transform:scale(1.03);

  box-shadow:
    0 0 15px rgba(59,130,246,0.5);
}

/* FOOTER */

.footer{

  margin-top:auto;

  text-align:center;

  font-size:12px;

  color:#94A3B8;

  opacity:0.8;

  padding-top:30px;
}

/* MAIN */

.main{

  flex:1;

  padding:25px;
}

/* CARDS */

.cards{

  display:flex;

  gap:20px;

  flex-wrap:wrap;
}

.card{

  background:
    linear-gradient(
      145deg,
      rgba(30,41,59,0.95),
      rgba(15,23,42,0.95)
    );

  border-radius:20px;

  padding:25px;

  flex:1;

  min-width:220px;

  border:
    1px solid rgba(255,255,255,0.05);

  box-shadow:
    0 10px 25px rgba(0,0,0,0.4);

  transition:0.3s;
}

.card:hover{

  transform:translateY(-5px);

  box-shadow:
    0 15px 35px rgba(0,0,0,0.5);
}

.card h3{

  margin-top:0;

  color:#93C5FD;
}

.card p{

  font-size:28px;

  font-weight:bold;

  margin-top:15px;
}

/* GRÁFICOS */

.graficos{

  display:flex;

  gap:20px;

  margin-top:30px;

  flex-wrap:wrap;
}

.grafico{

  background:
    linear-gradient(
      145deg,
      rgba(30,41,59,0.95),
      rgba(15,23,42,0.95)
    );

  border-radius:20px;

  padding:20px;

  flex:1;

  min-width:350px;

  height:450px;

  border:
    1px solid rgba(255,255,255,0.05);

  box-shadow:
    0 10px 30px rgba(0,0,0,0.45);
}

canvas{

  width:100% !important;

  height:100% !important;
}

</style>

</head>

<body>

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<!-- LOGO -->

<div class="logo-area">

<img
  src="logo.png"
  class="logo"
/>

<h2>Dashboard</h2>

</div>

<!-- MENU -->

<p onclick="filtrar('TODOS')">
📊 Geral
</p>

<p onclick="filtrar('Sibele')">
Sibele
</p>

<p onclick="filtrar('Empresa')">
Empresa
</p>

<p onclick="filtrar('Danilo')">
Danilo
</p>

<p onclick="filtrar('José Cicero')">
José Cicero
</p>

<p onclick="filtrar('Alex')">
Alex
</p>

<p onclick="filtrar('Danilo BH')">
Danilo BH
</p>

<p onclick="filtrar('Thiago BH')">
Thiago BH
</p>

<hr>

<h3>Filtrar por mês</h3>

<input
  type="month"
  id="mesFiltro"
>

<button onclick="filtrarMes()">
🔍 Buscar
</button>

<button onclick="limparFiltro()">
♻ Limpar Filtro
</button>

<hr>

<button onclick="gerarPDF()">
📄 Extrair Relatório
</button>

<hr>

<input
  type="password"
  id="senha"
  placeholder="Senha"
>

<button onclick="acessar()">
📂 Ir para Dados
</button>

<!-- FOOTER -->

<div class="footer">

© Diego Neri

</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- CARDS -->

<div class="cards">

<div class="card">

<h3>💰 Gasto Total</h3>

<p id="gastoTotal">
R$ 0,00
</p>

</div>

<div class="card">

<h3>🛣 KM Total</h3>

<p id="kmTotal">
0 KM
</p>

</div>

<div class="card">

<h3>👤 Individual</h3>

<p id="gastoIndividual">
R$ 0,00
</p>

<p id="kmIndividual">
0 KM
</p>

</div>

</div>

<!-- GRÁFICOS -->

<div class="graficos">

<div class="grafico">
<canvas id="g1"></canvas>
</div>

<div class="grafico">
<canvas id="g2"></canvas>
</div>

</div>

</div>

</div>

<img
    id="logoNERI"
    src="/logo.png"
    style="display:none;"
>

<script>

// TÉCNICOS

const tecnicos = [

  "Sibele",
  "Empresa",
  "Danilo",
  "José Cicero",
  "Alex",
  "Danilo BH",
  "Thiago BH"

];

let dadosGlobal = [];

let tecnicoAtual = "TODOS";

let grafico1;
let grafico2;

// ACESSAR

function acessar(){

  const senha =
    document.getElementById(
      "senha"
    ).value;

  if(senha === "Brastemp1234"){

    window.location.href =
      "/dados.html";

  }else{

    alert("Senha incorreta");

  }

}

// MÊS ATUAL

function obterMesAtual(){

  const hoje = new Date();

  const ano =
    hoje.getFullYear();

  const mes = String(
    hoje.getMonth() + 1
  ).padStart(2,"0");

  return `${ano}-${mes}`;

}

// FILTRO MÊS

function dadosPorMes(mes){

  return dadosGlobal.filter(d=>{

    if(!d.data)
      return false;

    return d.data.startsWith(mes);

  });

}

// CARREGAR

async function carregarDados(){

  const res =
    await fetch("/registros");

  dadosGlobal =
    await res.json();

  dadosGlobal.sort((a,b)=>{

    return new Date(a.data)
      - new Date(b.data);

  });

  const mesAtual =
    obterMesAtual();

  document.getElementById(
    "mesFiltro"
  ).value = mesAtual;

  const filtrado =
    dadosPorMes(mesAtual);

  processar(
    filtrado,
    tecnicoAtual
  );

}

// FILTRAR TÉCNICO

function filtrar(nome){

  tecnicoAtual = nome;

  const mes =
    document.getElementById(
      "mesFiltro"
    ).value;

  const filtrado =
    dadosPorMes(mes);

  processar(
    filtrado,
    tecnicoAtual
  );

}

// FILTRAR MÊS

function filtrarMes(){

  const mes =
    document.getElementById(
      "mesFiltro"
    ).value;

  const filtrado =
    dadosPorMes(mes);

  processar(
    filtrado,
    tecnicoAtual
  );

}

// LIMPAR FILTRO

function limparFiltro(){

  const mesAtual =
    obterMesAtual();

  document.getElementById(
    "mesFiltro"
  ).value = mesAtual;

  const filtrado =
    dadosPorMes(mesAtual);

  processar(
    filtrado,
    tecnicoAtual
  );

}

// PROCESSAR

function processar(
  dados,
  tecnico
){

  let valores =
    Array(tecnicos.length)
    .fill(0);

  let kms =
    Array(tecnicos.length)
    .fill(0);

  dados.forEach(d=>{

    if(
      tecnico === "TODOS" ||
      d.tecnico === tecnico
    ){

      const i =
        tecnicos.indexOf(
          d.tecnico
        );

      if(i >= 0){

        kms[i] +=
          Number(d.km) || 0;

        valores[i] +=
          Number(d.valor) || 0;

      }

    }

  });

  atualizarDashboard(
    valores,
    kms,
    tecnico
  );

}

// DASHBOARD

function atualizarDashboard(
  valores,
  kms,
  tecnico
){

  const totalValor =
    valores.reduce((a,b)=>a+b,0);

  const totalKm =
    kms.reduce((a,b)=>a+b,0);

  document.getElementById(
    "gastoTotal"
  ).innerText =

    "R$ " +
    totalValor.toFixed(2);

  document.getElementById(
    "kmTotal"
  ).innerText =

    totalKm + " KM";

  if(tecnico !== "TODOS"){

    const i =
      tecnicos.indexOf(tecnico);

    document.getElementById(
      "gastoIndividual"
    ).innerText =

      "R$ " +
      valores[i].toFixed(2);

    document.getElementById(
      "kmIndividual"
    ).innerText =

      kms[i] + " KM";

  }else{

    document.getElementById(
      "gastoIndividual"
    ).innerText =

      "R$ 0,00";

    document.getElementById(
      "kmIndividual"
    ).innerText =

      "0 KM";

  }

  if(grafico1) grafico1.destroy();
  if(grafico2) grafico2.destroy();

  // GRÁFICO 1

  const ctx1 =
    document.getElementById("g1")
    .getContext("2d");

  const grad1 =
    ctx1.createLinearGradient(
      0,0,0,400
    );

  grad1.addColorStop(
    0,
    "#60A5FA"
  );

  grad1.addColorStop(
    1,
    "#2563EB"
  );

  grafico1 =
    new Chart(ctx1,{

    type:"bar",

    data:{

      labels:tecnicos,

      datasets:[{

        label:"Gastos",

        data:valores,

        backgroundColor:grad1,

        borderRadius:10,

        borderSkipped:false

      }]

    },

    plugins:[ChartDataLabels],

    options:{

      responsive:true,

      maintainAspectRatio:false,

      plugins:{

        legend:{
          labels:{
            color:"#fff"
          }
        },

        title:{

          display:true,

          text:
            "💰 CONSUMO GERAL",

          color:"#fff",

          font:{
            size:20,
            weight:"bold"
          }

        },

        datalabels:{

          color:"#fff",

          anchor:"end",

          align:"top",

          formatter:(value)=>{

            return "R$ " +
              value.toFixed(0);

          }

        }

      },

      scales:{

        x:{

          ticks:{
            color:"#fff"
          },

          grid:{
            display:false
          }

        },

        y:{

          ticks:{
            color:"#CBD5E1"
          },

          grid:{
            color:
              "rgba(255,255,255,0.08)"
          }

        }

      }

    }

  });

  // GRÁFICO 2

  const ctx2 =
    document.getElementById("g2")
    .getContext("2d");

  const grad2 =
    ctx2.createLinearGradient(
      0,0,0,400
    );

  grad2.addColorStop(
    0,
    "#34D399"
  );

  grad2.addColorStop(
    1,
    "#059669"
  );

  grafico2 =
    new Chart(ctx2,{

    type:"bar",

    data:{

      labels:tecnicos,

      datasets:[{

        label:"KM",

        data:kms,

        backgroundColor:grad2,

        borderRadius:10,

        borderSkipped:false

      }]

    },

    plugins:[ChartDataLabels],

    options:{

      responsive:true,

      maintainAspectRatio:false,

      plugins:{

        legend:{
          labels:{
            color:"#fff"
          }
        },

        title:{

          display:true,

          text:
            "🛣 KM GERAL",

          color:"#fff",

          font:{
            size:20,
            weight:"bold"
          }

        },

        datalabels:{

          color:"#fff",

          anchor:"end",

          align:"top",

          formatter:(value)=>{

            return value + " KM";

          }

        }

      },

      scales:{

        x:{

          ticks:{
            color:"#fff"
          },

          grid:{
            display:false
          }

        },

        y:{

          ticks:{
            color:"#CBD5E1"
          },

          grid:{
            color:
              "rgba(255,255,255,0.08)"
          }

        }

      }

    }

  });

}

// PDF

function gerarPDF() {


const { jsPDF } = window.jspdf;
const doc = new jsPDF();

const logo =
    document.getElementById("logoNERI");

let y = 40;

const mes =
    document.getElementById("mesFiltro").value;

const filtrado =
    dadosPorMes(mes);

function desenharCabecalho() {

    doc.setFillColor(25, 118, 210);

    doc.rect(
        0,
        0,
        210,
        30,
        "F"
    );

    if (logo && logo.complete) {

        doc.addImage(
            logo,
            "PNG",
            8,
            4,
            20,
            20
        );
    }

    doc.setTextColor(
        255,
        255,
        255
    );

    doc.setFontSize(18);

    doc.setFont(
        undefined,
        "bold"
    );

    doc.text(
        "NERI",
        35,
        13
    );

    doc.setFontSize(10);

    doc.setFont(
        undefined,
        "normal"
    );

    doc.text(
        "Relatório de Consumo e Quilometragem",
        35,
        21
    );

    doc.text(
        `Mês: ${mes}`,
        145,
        13
    );

    doc.text(
        new Date().toLocaleString("pt-BR"),
        120,
        21
    );

    doc.setTextColor(
        0,
        0,
        0
    );

    y = 40;
}

function desenharTabela() {

    doc.setFillColor(
        15,
        23,
        42
    );

    doc.rect(
        0,
        0,
        210,
        30,
        "F"
    );

    doc.setTextColor(
        255,
        255,
        255
    );

    doc.setFontSize(9);

    doc.text(
        "DATA",
        15,
        y + 5
    );

    doc.text(
        "KM",
        55,
        y + 5
    );

    doc.text(
        "LITROS",
        85,
        y + 5
    );

    doc.text(
        "VALOR",
        120,
        y + 5
    );

    doc.text(
        "KM/L",
        165,
        y + 5
    );

    doc.setTextColor(
        0,
        0,
        0
    );

    y += 12;
}

function verificarPagina() {

    if (y > 270) {

        doc.addPage();

        desenharCabecalho();

        desenharTabela();
    }
}

desenharCabecalho();

if (tecnicoAtual === "TODOS") {

    tecnicos.forEach(nome => {

        const dadosTecnico =
            filtrado.filter(
                d => d.tecnico === nome
            );

        if (!dadosTecnico.length)
            return;

        verificarPagina();

        doc.setFontSize(13);

        doc.setFont(
            undefined,
            "bold"
        );

        doc.text(
            nome,
            10,
            y
        );

        y += 8;

        desenharTabela();

        let totalKm = 0;
        let totalLitros = 0;
        let totalValor = 0;

        dadosTecnico.forEach((d, indice) => {

            const km =
                Number(d.km) || 0;

            const litros =
                Number(d.litros) || 0;

            const valor =
                Number(d.valor) || 0;

            const media =
                litros > 0
                    ? km / litros
                    : 0;

            totalKm += km;
            totalLitros += litros;
            totalValor += valor;

            const cor =
                indice % 2 === 0
                    ? 255
                    : 245;

            doc.setFillColor(
                cor,
                cor,
                cor
            );

            doc.rect(
                10,
                y - 5,
                190,
                8,
                "F"
            );

            doc.rect(
                10,
                y - 5,
                190,
                8
            );

            doc.text(
                String(d.data),
                15,
                y
            );

            doc.text(
                km.toFixed(0),
                55,
                y
            );

            doc.text(
                litros.toFixed(2),
                85,
                y
            );

            doc.text(
                valor.toFixed(2),
                120,
                y
            );

            doc.text(
                media.toFixed(2),
                165,
                y
            );

            y += 8;

            verificarPagina();
        });

        const mediaKmL =
            totalLitros > 0
                ? totalKm / totalLitros
                : 0;

        const valorLitro =
            totalLitros > 0
                ? totalValor / totalLitros
                : 0;

        doc.setFillColor(
            230,
            236,
            245
        );

        doc.roundedRect(
            10,
            y,
            190,
            40,
            3,
            3,
            "FD"
        );

        doc.setFontSize(10);

        doc.setFont(
            undefined,
            "bold"
        );

        doc.text(
            `TOTAL KM: ${totalKm.toFixed(0)} KM`,
            15,
            y + 10
        );

        doc.text(
            `TOTAL LITROS: ${totalLitros.toFixed(2)} L`,
            15,
            y + 20
        );

        doc.text(
            `TOTAL GASTO: R$ ${totalValor.toFixed(2)}`,
            15,
            y + 30
        );

        doc.text(
            `MÉDIA KM/L: ${mediaKmL.toFixed(2)}`,
            110,
            y + 10
        );

        doc.text(
            `VALOR/LITRO: R$ ${valorLitro.toFixed(2)}`,
            110,
            y + 20
        );

        y += 50;
    });

} else {

    const dadosTecnico =
        filtrado.filter(
            d => d.tecnico === tecnicoAtual
        );

    doc.setFontSize(13);

    doc.setFont(
        undefined,
        "bold"
    );

    doc.text(
        tecnicoAtual,
        10,
        y
    );

    y += 8;

    desenharTabela();

    let totalKm = 0;
    let totalLitros = 0;
    let totalValor = 0;

    dadosTecnico.forEach((d, indice) => {

        const km =
            Number(d.km) || 0;

        const litros =
            Number(d.litros) || 0;

        const valor =
            Number(d.valor) || 0;

        const media =
            litros > 0
                ? km / litros
                : 0;

        totalKm += km;
        totalLitros += litros;
        totalValor += valor;

        const cor =
            indice % 2 === 0
                ? 255
                : 245;

        doc.setFillColor(
            cor,
            cor,
            cor
        );

        doc.rect(
            10,
            y - 5,
            190,
            8,
            "F"
        );

        doc.rect(
            10,
            y - 5,
            190,
            8
        );

        doc.text(
            String(d.data),
            15,
            y
        );

        doc.text(
            km.toFixed(0),
            55,
            y
        );

        doc.text(
            litros.toFixed(2),
            85,
            y
        );

        doc.text(
            valor.toFixed(2),
            120,
            y
        );

        doc.text(
            media.toFixed(2),
            165,
            y
        );

        y += 8;

        verificarPagina();
    });

    const mediaKmL =
        totalLitros > 0
            ? totalKm / totalLitros
            : 0;

    const valorLitro =
        totalLitros > 0
            ? totalValor / totalLitros
            : 0;

    doc.setFillColor(
        230,
        236,
        245
    );

    doc.roundedRect(
        10,
        y,
        190,
        40,
        3,
        3,
        "FD"
    );

    doc.setFontSize(10);

    doc.text(
        `TOTAL KM: ${totalKm.toFixed(0)} KM`,
        15,
        y + 10
    );

    doc.text(
        `TOTAL LITROS: ${totalLitros.toFixed(2)} L`,
        15,
        y + 20
    );

    doc.text(
        `TOTAL GASTO: R$ ${totalValor.toFixed(2)}`,
        15,
        y + 30
    );

    doc.text(
        `MÉDIA KM/L: ${mediaKmL.toFixed(2)}`,
        110,
        y + 10
    );

    doc.text(
        `VALOR/LITRO: R$ ${valorLitro.toFixed(2)}`,
        110,
        y + 20
    );
}

const paginas =
    doc.getNumberOfPages();

for (
    let i = 1;
    i <= paginas;
    i++
) {

    doc.setPage(i);

    doc.setFontSize(8);

    doc.setTextColor(
        120,
        120,
        120
    );

    doc.text(
        "Sistema NERI © 2026",
        10,
        290
    );

    doc.text(
        `Página ${i} de ${paginas}`,
        170,
        290
    );
}

doc.save("relatorio.pdf");


}


// INICIAR

carregarDados();

</script>

</body>
</html>
