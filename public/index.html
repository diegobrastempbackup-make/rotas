<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Geral - NERI</title>
    <link rel="stylesheet" href="style.css?v=2">
    <style>
        .main { flex-grow: 1; height: 100vh; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; }
        .header-painel h1 { margin: 0 0 5px 0; font-size: 24px; color: white; }
        .header-painel p { margin: 0 0 20px 0; color: #94A3B8; font-size: 14px; }
        
        .cards-resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: #1E293B; border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative; overflow: hidden; }
        .card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: #3B82F6; }
        .card.verde::before { background: #10B981; }
        .card.amarelo::before { background: #F59E0B; }
        .card h3 { color: #94A3B8; font-size: 13px; margin: 0 0 10px 0; text-transform: uppercase; }
        .card .valor { color: white; font-size: 32px; font-weight: 800; margin: 0; }
    </style>
    <script>
        // Função de navegação segura passando o Token
        function navegarSeguro(rota) { 
            const token = localStorage.getItem("token"); 
            window.location.href = `${rota}?token=${token}`; 
        }
    </script>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="logo-area"><img src="logo.svg" class="logo" alt="Logo NERI" style="max-width: 100%; height: auto; margin-bottom: 10px;" /></div>
        <div class="menu">
            <button style="background: #2563EB; color: white; border-color: #3B82F6;">📊 Dashboard Geral</button>
            <button onclick="navegarSeguro('/dados.html')">📂 Lançar Dados</button>
            
            <!-- NOVO BOTÃO DO ROTEIRIZADOR AQUI -->
            <button onclick="navegarSeguro('/roteirizador.html')">🗺️ Roteirizador</button>
            
            <button onclick="navegarSeguro('/estoque.html')">📦 Almoxarifado</button>
            <hr>
            <button onclick="navegarSeguro('/tecnicos.html')" id="btnAdmin" style="display:none;">⚙️ Administração</button>
            <hr>
            <button onclick="localStorage.clear(); window.location.replace('/login.html')" class="btn-sair">🚪 Sair</button>
        </div>
    </div>

    <div class="main">
        <div class="header-painel">
            <h1>Visão Geral da Frota</h1>
            <p>Bem-vindo ao centro de comando. Aqui tem o resumo das operações diárias.</p>
        </div>

        <div class="cards-resumo">
            <div class="card verde">
                <h3>Total de Quilómetros</h3>
                <p class="valor" id="totalKm">0</p>
            </div>
            <div class="card amarelo">
                <h3>Combustível Gasto (Litros)</h3>
                <p class="valor" id="totalLitros">0</p>
            </div>
            <div class="card">
                <h3>Custos de Abastecimento</h3>
                <p class="valor" id="totalValor">R$ 0,00</p>
            </div>
        </div>
        
        <!-- O resto do seu dashboard original pode continuar abaixo desta área -->
        
    </div>
</div>

<script>
    const token = localStorage.getItem("token");
    if (!token) window.location.replace("/login.html");

    // Liberta o botão de Administração apenas para o Master / SuperAdmin
    const usuarioTipo = localStorage.getItem("usuarioTipo");
    if (usuarioTipo === "master" || usuarioTipo === "superadmin" || usuarioTipo === "admin") {
        document.getElementById("btnAdmin").style.display = "block";
    }

    // Lógica para carregar os números grandes do painel
    async function carregarIndicadores() {
        try {
            const res = await fetch("/api/registros", { headers: { "Authorization": `Bearer ${token}` } });
            const registros = await res.json();
            
            let km = 0, litros = 0, valor = 0;
            
            registros.forEach(r => {
                km += Number(r.km) || 0;
                litros += Number(r.litros) || 0;
                valor += Number(r.valor) || 0;
            });

            document.getElementById("totalKm").innerText = km.toLocaleString('pt-BR') + " km";
            document.getElementById("totalLitros").innerText = litros.toLocaleString('pt-BR', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + " L";
            document.getElementById("totalValor").innerText = "R$ " + valor.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        } catch (e) { console.error("Erro ao carregar dados", e); }
    }

    carregarIndicadores();
</script>
</body>
</html>
