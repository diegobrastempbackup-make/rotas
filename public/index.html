<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#0F172A;
  color:white;
}

.container{
  display:flex;
}

.sidebar{
  width:230px;
  background:#111827;
  height:100vh;
  padding:20px;
  overflow:auto;
}

.sidebar p{
  cursor:pointer;
  padding:8px;
  border-radius:5px;
  margin:3px 0;
}

.sidebar p:hover{
  background:#1F2937;
}

.sidebar input,
.sidebar button{
  width:100%;
  margin-top:8px;
  padding:8px;
  border:none;
  border-radius:5px;
}

.sidebar button{
  background:#3A8DFF;
  color:white;
  cursor:pointer;
}

.main{
  flex:1;
  padding:20px;
}

.cards{
  display:flex;
  gap:20px;
}

.card{
  background:#1F2937;
  padding:20px;
  border-radius:10px;
  flex:1;
}

.graficos{
  display:flex;
  gap:20px;
  margin-top:30px;
}

.grafico{
  background:#1F2937;
  border-radius:10px;
  padding:10px;
  flex:1;
  height:320px;
}

</style>
</head>

<body>

<div class="container">

<!-- MENU -->
<div class="sidebar">

<h2>Dashboard</h2>

<p onclick="filtrar('TODOS')">📊 Geral</p>
<p onclick="filtrar('Sibele')">Sibele</p>
<p onclick="filtrar('Empresa')">Empresa</p>
<p onclick="filtrar('Danilo')">Danilo</p>
<p onclick="filtrar('José Cicero')">José Cicero</p>
<p onclick="filtrar('Alex')">Alex</p>
<p onclick="filtrar('Danilo BH')">Danilo BH</p>
<p onclick="filtrar('Thiago BH')">Thiago BH</p>

<hr>

<h3>Filtrar por mês</h3>

<input type="month" id="mesFiltro">

<button onclick="filtrarMes()">
🔍 Buscar
</button>

<button onclick="limparFiltro()">
♻ Limpar Filtro
</button>

<hr>

<button onclick="gerarPDF()">
📄 Extrair Relatório
</button>

<hr>

<input type="password" id="senha" placeholder="Senha">

<button onclick="acessar()">
📂 Ir para Dados
</button>

</div>

<!-- CONTEÚDO -->
<div class="main">

<div class="cards">

<div class="card">
<h3>💰 Gasto Total</h3>
<p id="gastoTotal">R$ 0,00</p>
</div>

<div class="card">
<h3>🛣 KM Total</h3>
<p id="kmTotal">0 KM</p>
</div>

<div class="card">
<h3>👤 Individual</h3>
<p id="gastoIndividual">R$ 0,00</p>
<p id="kmIndividual">0 KM</p>
</div>

</div>

<div class="graficos">

<div class="grafico">
<canvas id="g1"></canvas>
</div>

<div class="grafico">
<canvas id="g2"></canvas>
</div>

</div>

</div>
</div>

<script>

// 🔥 TÉCNICOS
const tecnicos = [
  "Sibele",
  "Empresa",
  "Danilo",
  "José Cicero",
  "Alex",
  "Danilo BH",
  "Thiago BH"
];

let dadosGlobal = [];
let tecnicoAtual = "TODOS";

let grafico1;
let grafico2;

// 🔥 IR PARA DADOS
function acessar(){

  const senha =
    document.getElementById("senha").value;

  if(senha === "Brastemp1234"){

    window.location.href =
      "/dados.html";

  }else{

    alert("Senha incorreta");

  }

}

// 🔥 PEGAR MÊS ATUAL
function obterMesAtual(){

  const hoje = new Date();

  const ano = hoje.getFullYear();

  const mes = String(
    hoje.getMonth() + 1
  ).padStart(2,"0");

  return `${ano}-${mes}`;

}

// 🔥 FILTRAR DADOS POR MÊS
function dadosPorMes(mes){

  return dadosGlobal.filter(d=>{

    if(!d.data) return false;

    return d.data.startsWith(mes);

  });

}

// 🔥 CARREGAR DADOS
async function carregarDados(){

  const res =
    await fetch("/registros");

  dadosGlobal =
    await res.json();

  // 🔥 ORDENA POR DATA
  dadosGlobal.sort((a,b)=>{

    return new Date(a.data)
      - new Date(b.data);

  });

  // 🔥 DEFINE MÊS ATUAL
  const mesAtual =
    obterMesAtual();

  document.getElementById("mesFiltro")
    .value = mesAtual;

  // 🔥 MOSTRA APENAS O MÊS ATUAL
  const filtrado =
    dadosPorMes(mesAtual);

  processar(filtrado, tecnicoAtual);

}

// 🔥 FILTRAR TÉCNICO
function filtrar(nome){

  tecnicoAtual = nome;

  const mes =
    document.getElementById("mesFiltro")
      .value;

  const filtrado =
    dadosPorMes(mes);

  processar(filtrado, tecnicoAtual);

}

// 🔥 FILTRAR MÊS
function filtrarMes(){

  const mes =
    document.getElementById("mesFiltro")
      .value;

  if(!mes){

    const mesAtual =
      obterMesAtual();

    document.getElementById("mesFiltro")
      .value = mesAtual;

    const filtrado =
      dadosPorMes(mesAtual);

    processar(filtrado, tecnicoAtual);

    return;

  }

  const filtrado =
    dadosPorMes(mes);

  processar(filtrado, tecnicoAtual);

}

// 🔥 LIMPAR FILTRO
function limparFiltro(){

  const mesAtual =
    obterMesAtual();

  document.getElementById("mesFiltro")
    .value = mesAtual;

  const filtrado =
    dadosPorMes(mesAtual);

  processar(filtrado, tecnicoAtual);

}

// 🔥 PROCESSAR DADOS
function processar(dados, tecnico){

  let valores =
    Array(tecnicos.length).fill(0);

  let kms =
    Array(tecnicos.length).fill(0);

  dados.forEach(d=>{

    if(
      tecnico === "TODOS" ||
      d.tecnico === tecnico
    ){

      const i =
        tecnicos.indexOf(d.tecnico);

      if(i >= 0){

        kms[i] += Number(d.km) || 0;

        valores[i] += Number(d.valor) || 0;

      }

    }

  });

  atualizarDashboard(
    valores,
    kms,
    tecnico
  );

}

// 🔥 ATUALIZAR DASHBOARD
function atualizarDashboard(
  valores,
  kms,
  tecnico
){

  const totalValor =
    valores.reduce((a,b)=>a+b,0);

  const totalKm =
    kms.reduce((a,b)=>a+b,0);

  document.getElementById("gastoTotal")
    .innerText =
    "R$ " + totalValor.toFixed(2);

  document.getElementById("kmTotal")
    .innerText =
    totalKm + " KM";

  // 🔥 INDIVIDUAL
  if(tecnico !== "TODOS"){

    const i =
      tecnicos.indexOf(tecnico);

    document.getElementById(
      "gastoIndividual"
    ).innerText =
      "R$ " + valores[i].toFixed(2);

    document.getElementById(
      "kmIndividual"
    ).innerText =
      kms[i] + " KM";

  }else{

    document.getElementById(
      "gastoIndividual"
    ).innerText =
      "R$ 0,00";

    document.getElementById(
      "kmIndividual"
    ).innerText =
      "0 KM";

  }

  // 🔥 DESTRUIR GRÁFICOS
  if(grafico1) grafico1.destroy();
  if(grafico2) grafico2.destroy();

  // 🔥 GRÁFICO GASTOS
  grafico1 = new Chart(
    document.getElementById("g1"),
    {
      type:"bar",
      data:{
        labels:tecnicos,
        datasets:[{
          label:"Gastos",
          data:valores
        }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false
      }
    }
  );

  // 🔥 GRÁFICO KM
  grafico2 = new Chart(
    document.getElementById("g2"),
    {
      type:"bar",
      data:{
        labels:tecnicos,
        datasets:[{
          label:"KM",
          data:kms
        }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false
      }
    }
  );

}

// 🔥 GERAR PDF
function gerarPDF(){

  const { jsPDF } = window.jspdf;

  const doc = new jsPDF();

  let y = 10;

  doc.setFontSize(16);

  doc.text("RELATÓRIO DE KM", 10, y);

  y += 12;

  // 🔥 PEGA MÊS FILTRADO
  const mes =
    document.getElementById("mesFiltro")
      .value;

  const filtrado =
    dadosPorMes(mes);

  // 🔥 RELATÓRIO GERAL
  if(tecnicoAtual === "TODOS"){

    tecnicos.forEach(nome=>{

      const dadosTecnico =
        filtrado.filter(
          d => d.tecnico === nome
        );

      if(dadosTecnico.length === 0)
        return;

      doc.setFontSize(13);

      doc.text(
        "===================================",
        10,
        y
      );

      y += 8;

      doc.text(nome, 10, y);

      y += 8;

      doc.text(
        "===================================",
        10,
        y
      );

      y += 10;

      let totalKm = 0;
      let totalValor = 0;
      let totalLitros = 0;

      dadosTecnico.forEach(d=>{

        totalKm +=
          Number(d.km) || 0;

        totalValor +=
          Number(d.valor) || 0;

        totalLitros +=
          Number(d.litros) || 0;

        doc.setFontSize(10);

        doc.text(

`${d.data} | KM: ${d.km} | Litros: ${d.litros} | Valor: R$ ${Number(d.valor).toFixed(2)}`,

          10,

          y

        );

        y += 7;

        // 🔥 NOVA PÁGINA
        if(y > 280){

          doc.addPage();

          y = 10;

        }

      });

      y += 3;

      doc.setFontSize(11);

      doc.text(
        `TOTAL KM: ${totalKm} KM`,
        10,
        y
      );

      y += 7;

      doc.text(
        `TOTAL LITROS: ${totalLitros.toFixed(2)} L`,
        10,
        y
      );

      y += 7;

      doc.text(
        `TOTAL GASTO: R$ ${totalValor.toFixed(2)}`,
        10,
        y
      );

      y += 15;

    });

  }else{

    // 🔥 RELATÓRIO INDIVIDUAL

    const dadosTecnico =
      filtrado.filter(
        d => d.tecnico === tecnicoAtual
      );

    let totalKm = 0;
    let totalValor = 0;
    let totalLitros = 0;

    doc.setFontSize(14);

    doc.text(tecnicoAtual, 10, y);

    y += 12;

    dadosTecnico.forEach(d=>{

      totalKm +=
        Number(d.km) || 0;

      totalValor +=
        Number(d.valor) || 0;

      totalLitros +=
        Number(d.litros) || 0;

      doc.setFontSize(10);

      doc.text(

`${d.data} | KM: ${d.km} | Litros: ${d.litros} | Valor: R$ ${Number(d.valor).toFixed(2)}`,

        10,

        y

      );

      y += 8;

      // 🔥 NOVA PÁGINA
      if(y > 280){

        doc.addPage();

        y = 10;

      }

    });

    y += 5;

    doc.setFontSize(12);

    doc.text(
      `TOTAL KM: ${totalKm} KM`,
      10,
      y
    );

    y += 8;

    doc.text(
      `TOTAL LITROS: ${totalLitros.toFixed(2)} L`,
      10,
      y
    );

    y += 8;

    doc.text(
      `TOTAL GASTO: R$ ${totalValor.toFixed(2)}`,
      10,
      y
    );

  }

  doc.save("relatorio.pdf");

}

// 🔥 INICIAR
carregarDados();

</script>

</body>
</html>
