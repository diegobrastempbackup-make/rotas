<!DOCTYPE html>
<html lang=\"pt-br\">
<head>
  <meta charset="UTF-8">
  <title>NERI Dashboard</title>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <link rel="stylesheet" href="style.css">

  <style>
    /* Esconde os botões sensíveis por padrão antes da checagem do script */
    #btnIrParaDados, #btnMenuCadastro, #btnIrParaEstoque {
      display: none;
    }

    /* AJUSTE PARA OS CARDS FICAREM COLADOS NO TOPO NO CELULAR E PC */
    .main {
      flex-grow: 1;
      padding: 15px 20px; 
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      justify-content: flex-start !important; 
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); \n      gap: 15px;
      width: 100%;
      margin-top: 0 !important; \n    }

    /* BLINDAGEM DO MODAL COM O CORRETO DO JAVASCRIPT */
    .modal {
      display: none; 
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #1E293B;
      padding: 25px;
      border-radius: 8px;
      width: 400px;
      max-width: 90%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #94A3B8;
      font-size: 13px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 8px;
      background: #0F172A;
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      border-radius: 4px;
    }
    .btn-bloco {
      width: 100%;
      padding: 10px;
      border: none;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="logo">NERI</div>
    <nav>
      <div class="nav-section">
        <h3>FILTROS</h3>
        
        <label for="filtroMes">Mês:</label>
        <select id="filtroMes" onchange="atualizarDashboard()">
          <option value="01">Janeiro</option>
          <option value="02">Fevereiro</option>
          <option value="03">Março</option>
          <option value="04">Abril</option>
          <option value="05">Maio</option>
          <option value="06">Junho</option>
          <option value="07">Julho</option>
          <option value="08">Agosto</option>
          <option value="09">Setembro</option>
          <option value="10">Outubro</option>
          <option value="11">Novembro</option>
          <option value="12">Dezembro</option>
        </select>

        <label for="filtroAno">Ano:</label>
        <select id="filtroAno" onchange="atualizarDashboard()">
          </select>

        <label for="filtroTecnico">Técnico:</label>
        <select id="filtroTecnico" onchange="atualizarDashboard()">
          <option value="TODOS">Todos os Técnicos</option>
          </select>
      </div>

      <div class="nav-section">
        <h3>NAVEGAÇÃO</h3>
        <button id="btnIrParaDados" onclick="window.location.href='/dados.html'" style="background: #3B82F6;" class="btn-bloco">Planilha de Dados</button>
        <button id="btnIrParaEstoque" onclick="window.location.href='/estoque.html'" style="background: #10B981;" class="btn-bloco">Estoque & Cautela</button>
        <button id="btnMenuCadastro" onclick="abrirModalCadastro()" style="background: #8B5CF6;" class="btn-bloco">Gerenciar Usuários</button>
        <button onclick="exportarPDF()" style="background: #EF4444;" class="btn-bloco">Exportar PDF</button>
        <button onclick="efetuarLogoutManual()" style="background: #475569;" class="btn-bloco">Sair</button>
      </div>
    </nav>
  </div>

  <div class="main">
    <div class="cards">
      <div class="card">
        <h3>Gasto Total</h3>
        <p id="gastoTotalVal">R$ 0,00</p>
      </div>
      <div class="card">
        <h3>KM Total Rodado</h3>
        <p id="kmTotalVal">0 KM</p>
      </div>
      <div class="card">
        <h3>Litros Abastecidos</h3>
        <p id="litrosTotalVal">0.00 L</p>
      </div>
      <div class="card">
        <h3>Média Geral Frota</h3>
        <p id="mediaGeralVal">-</p>
      </div>
    </div>

    <div class="charts-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 20px; width:100%; flex-grow:1;">
      <div class="chart-box" style="background:#1E293B; padding:15px; border-radius:8px; height:320px; position:relative;">
        <h4 style="margin:0 0 10px 0; color:#94A3B8; font-size:14px;">Investimento por Técnico (R$)</h4>
        <div style="width:100%; height:260px;">
          <canvas id="graficoGastos"></canvas>
        </div>
      </div>
      <div class="chart-box" style="background:#1E293B; padding:15px; border-radius:8px; height:320px; position:relative;">
        <h4 style="margin:0 0 10px 0; color:#94A3B8; font-size:14px;">Quilometragem Percorrida (KM)</h4>
        <div style="width:100%; height:260px;">
          <canvas id="graficoKm"></canvas>
        </div>
      </div>
    </div>
  </div>

  <div id="modalCadastro" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0; color:white;">Controle de Usuários</h3>
      
      <div id="listaUsuariosContainer" style="max-height: 180px; overflow-y: auto; background:#0F172A; padding:10px; border-radius:4px; margin-bottom:15px;"></div>
      <button onclick="mostrarFormularioCadastro()" class="btn-bloco" style="background:#10B981;">+ Criar Novo Usuário</button>
    </div>

    <div id="formUsuario" style="display: none;" class="form-group">
      <h4 id="formTitulo" style="margin: 0 0 15px 0; color: #60A5FA;">Novo Usuário</h4>
      <input type="hidden" id="editId">
      
      <label>Nome Completo:</label>
      <input type="text" id="cadNome" placeholder="Nome Completo">
      
      <label>Nome de Usuário (Login):</label>
      <input type="text" id="cadUsuario" placeholder="Usuário (ex: joao)">
      
      <label id="lblSenha">Senha:</label>
      <input type="password" id="cadSenha" placeholder="Digite a senha">
      
      <label>Nível de Acesso:</label>
      <select id="cadTipo">
        <option value="simples">Acesso Simples</option>
        <option value="estoque">Estoque</option>
        <option value="admin">Administrador</option>
        <option value="master">Master</option>
      </select>
    </div>

    <div class="modal-botoes" style="display:flex; gap:10px; margin-top:15px;">
      <button class="btn-bloco" style="background:#64748B; margin:0;" onclick="fecharModalCadastro()">Fechar</button>
      <button id="btnSalvarUsuario" class="btn-bloco" style="background:#2563EB; margin:0; display:none;" onclick="guardarUsuario()">Gravar Usuário</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="usuarios.js"></script>
</body>
</html>
