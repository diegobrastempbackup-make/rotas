<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { margin:0; font-family:Arial; background:#0F172A; color:white; }
.container { display:flex; }
.sidebar { width:220px; background:#111827; height:100vh; padding:20px; }
.sidebar p { cursor:pointer; padding:8px; border-radius:5px; }
.sidebar p:hover { background:#1F2937; }

.main { flex:1; padding:20px; }

.cards { display:flex; gap:20px; }
.card { background:#1F2937; padding:20px; border-radius:10px; flex:1; }

.graficos { display:flex; gap:20px; margin-top:30px; }
.grafico { background:#1F2937; border-radius:10px; padding:10px; flex:1; height:300px; }

input, button {
  margin-top:5px;
  padding:5px;
  border:none;
}

button {
  background:#3A8DFF;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="sidebar">
<h2>Dashboard</h2>

<p onclick="filtrar('TODOS')">Geral</p>
<p onclick="filtrar('Sibele')">Sibele</p>
<p onclick="filtrar('Empresa')">Empresa</p>
<p onclick="filtrar('Danilo')">Danilo</p>
<p onclick="filtrar('José Cicero')">José Cicero</p>
<p onclick="filtrar('Welisson')">Welisson</p>
<p onclick="filtrar('Danilo BH')">Danilo BH</p>
<p onclick="filtrar('Thiago BH')">Thiago BH</p>

<br>

<input type="date" id="inicio">
<input type="date" id="fim">
<button onclick="filtrarData()">Filtrar Data</button>

<br><br>

<button onclick="gerarPDF()">📄 Relatório</button>

<br><br>

<input type="password" id="senha" placeholder="Senha">
<button onclick="acessar()">Ir para Dados</button>

</div>

<div class="main">

<div class="cards">
<div class="card">
<h3>Gasto Total</h3>
<p id="gastoTotal">R$ 0</p>
</div>

<div class="card">
<h3>Km Total</h3>
<p id="kmTotal">0</p>
</div>

<div class="card">
<h3>Individual</h3>
<p id="gastoIndividual">R$ 0</p>
<p id="kmIndividual">0</p>
</div>
</div>

<div class="graficos">
<div class="grafico"><canvas id="g1"></canvas></div>
<div class="grafico"><canvas id="g2"></canvas></div>
</div>

</div>
</div>

<script>
const API = "";
const tecnicos = ["Sibele","Empresa","Danilo","José Cicero","Welisson","Danilo BH","Thiago BH"];

let dadosGlobal = [];
let tecnicoAtual = "TODOS";
let g1, g2;

// 🔥 IR PARA DADOS
function acessar(){
  if(document.getElementById("senha").value==="Brastemp1234"){
    window.location.href="/dados.html";
  } else {
    alert("Senha incorreta");
  }
}

// 🔥 BUSCAR DO BACKEND
async function carregar(){
  const res = await fetch("/registros");
  dadosGlobal = await res.json();
  processar(dadosGlobal, tecnicoAtual);
}

// 🔥 FILTRO POR TÉCNICO
function filtrar(nome){
  tecnicoAtual = nome;
  processar(dadosGlobal, nome);
}

// 🔥 FILTRO POR DATA
function filtrarData(){
  const inicio = document.getElementById("inicio").value;
  const fim = document.getElementById("fim").value;

  let filtrado = dadosGlobal.filter(d=>{
    if(!inicio || !fim) return true;
    return d.data >= inicio && d.data <= fim;
  });

  processar(filtrado, tecnicoAtual);
}

// 🔥 PROCESSAMENTO
function processar(dados, tecnico){
  let valores = Array(tecnicos.length).fill(0);
  let kms = Array(tecnicos.length).fill(0);

  dados.forEach(d=>{
    let i = tecnicos.indexOf(d.tecnico);

    if(i >= 0){
      if(tecnico==="TODOS" || d.tecnico === tecnico){
        valores[i] += Number(d.valor) || 0;
        kms[i] += Number(d.km) || 0;
      }
    }
  });

  atualizar(valores, kms, tecnico);
}

// 🔥 ATUALIZA DASHBOARD
function atualizar(valores, kms, tecnico){

  const totalValor = valores.reduce((a,b)=>a+b,0);
  const totalKm = kms.reduce((a,b)=>a+b,0);

  document.getElementById("gastoTotal").innerText = "R$ " + totalValor.toFixed(2);
  document.getElementById("kmTotal").innerText = totalKm;

  if(tecnico !== "TODOS"){
    let i = tecnicos.indexOf(tecnico);
    document.getElementById("gastoIndividual").innerText = "R$ " + valores[i].toFixed(2);
    document.getElementById("kmIndividual").innerText = kms[i];
  } else {
    document.getElementById("gastoIndividual").innerText = "R$ 0";
    document.getElementById("kmIndividual").innerText = "0";
  }

  if(g1) g1.destroy();
  if(g2) g2.destroy();

  g1 = new Chart(document.getElementById("g1"),{
    type:"bar",
    data:{
      labels:tecnicos,
      datasets:[{label:"Gastos",data:valores}]
    },
    options:{responsive:true,maintainAspectRatio:false}
  });

  g2 = new Chart(document.getElementById("g2"),{
    type:"bar",
    data:{
      labels:tecnicos,
      datasets:[{label:"KM",data:kms}]
    },
    options:{responsive:true,maintainAspectRatio:false}
  });
}

// 🔥 PDF
function gerarPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let y = 10;

  doc.text("RELATÓRIO", 10, y);
  y += 10;

  dadosGlobal.forEach(d=>{
    doc.text(
      `${d.tecnico} | ${d.data} | KM: ${d.km} | R$: ${d.valor}`,
      10,
      y
    );
    y += 8;
  });

  doc.save("relatorio.pdf");
}

// INIT
carregar();

</script>

</body>
</html>
