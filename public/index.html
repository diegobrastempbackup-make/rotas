<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>NERI Dashboard</title>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <link rel="stylesheet" href="style.css">

  <style>
    /* Esconde os botões sensíveis por padrão antes da checagem do script */
    #btnIrParaDados, #btnMenuCadastro, #btnIrParaEstoque {
      display: none;
    }

    /* AJUSTE PARA OS CARDS FICAREM COLADOS NO TOPO NO CELULAR E PC */
    .main {
      flex-grow: 1;
      padding: 15px 20px; 
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      justify-content: flex-start !important; 
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
      gap: 15px;
      width: 100%;
      margin-top: 0 !important; 
    }

    /* BLINDAGEM DO MODAL COM O CORRETO DO JAVASCRIPT (.show) */
    .modal.show {
      opacity: 1 !important;
      pointer-events: auto !important;
      display: flex !important;
    }
    .modal.show .modal-conteudo {
      transform: translateY(0) !important;
    }
    
    /* Correção de inputs internos do formulário */
    .form-group input, .form-group select {
      margin-bottom: 10px;
    }
  </style>

  <script>
    const token = localStorage.getItem("token");
    let usuarioTipo = localStorage.getItem("usuarioTipo");
    const usuarioNome = localStorage.getItem("usuarioNome");

    // Trava de segurança inicial: Sem token vai pro login
    if (!token) {
      window.location.replace("/login.html");
    }

    // Intercepta e força o perfil de estoque caso o nome venha com a marcação de segurança
    if (usuarioNome && usuarioNome.includes("[ESTOQUE]")) {
      usuarioTipo = "estoque";
      localStorage.setItem("usuarioTipo", "estoque");
    }

    // Se o usuário for do tipo estoque, ele não entra no Dashboard de forma alguma
    if (usuarioTipo === "estoque") {
      window.location.replace("/estoque.html");
    }

    window.addEventListener("DOMContentLoaded", () => {
      const btnDados = document.getElementById("btnIrParaDados");
      const btnCadastrar = document.getElementById("btnMenuCadastro");
      const btnEstoque = document.getElementById("btnIrParaEstoque");
      const btnRelatorio = document.getElementById("btnExtrairRelatorio");
      const perfilBadge = document.getElementById("perfilTipo");

      // Atualiza o Badge do Perfil na barra lateral
      if (perfilBadge && usuarioTipo) {
        perfilBadge.innerText = `Dashboard (${usuarioTipo.toUpperCase()})`;
      }

      // APLICAÇÃO RÍGIDA DOS NÍVEIS DE ACESSO SOLICITADOS
      if (usuarioTipo === "master") {
        if (btnDados) btnDados.style.display = "block";
        if (btnEstoque) btnEstoque.style.display = "block";
        if (btnCadastrar) btnCadastrar.style.display = "block";
        if (btnRelatorio) btnRelatorio.style.display = "block";
        
      } else if (usuarioTipo === "admin") {
        if (btnDados) btnDados.style.display = "block";
        if (btnEstoque) btnEstoque.style.display = "block";
        if (btnCadastrar) btnCadastrar.style.display = "none";
        if (btnRelatorio) btnRelatorio.style.display = "block";
        
      } else if (usuarioTipo === "simples") {
        if (btnDados) btnDados.style.display = "none";
        if (btnEstoque) btnEstoque.style.display = "none";
        if (btnCadastrar) btnCadastrar.style.display = "none";
        if (btnRelatorio) btnRelatorio.style.display = "block";
      }
    });
  </script>
</head>
<body>

<div class="container">
  <div class="sidebar">
    <div class="logo-area">
      <img src="logo.png" class="logo" alt="Logo NERI" style="max-width: 100%; height: auto; margin-bottom: 10px;" />
      <div class="user-badge" id="perfilTipo" style="margin-top: 5px;">Dashboard</div>
    </div>

    <div class="menu">
      <p onclick="filtrar('TODOS')" style="cursor:pointer; padding: 5px 10px;">📊 Geral</p>
      
      <div class="dropdown-tecnicos">
        <button onclick="toggleDropdown()" class="btn-dropdown">👥 Técnicos ▾</button>
        <div id="dropdownLista" class="dropdown-conteudo">
          <p onclick="filtrar('Sibele')">Sibele</p>
          <p onclick="filtrar('Empresa')">Empresa</p>
          <p onclick="filtrar('Danilo')">Danilo</p>
          <p onclick="filtrar('José Cicero')">José Cicero</p>
          <p onclick="filtrar('Alex')">Alex</p>
          <p onclick="filtrar('Danilo BH')">Danilo BH</p>
          <p onclick="filtrar('Thiago BH')">Thiago BH</p>
        </div>
      </div>

      <hr style="border:0; border-top:1px solid rgba(255,255,255,0.05);">

      <h3 style="font-size:12px; color:#94A3B8; padding-left:10px;">FILTRAR POR MÊS</h3>
      <input type="month" id="mesFiltro" style="width:100%; background:#0F172A; border:1px solid rgba(255,255,255,0.1); color:white; padding:8px; border-radius:5px; margin-bottom:8px;">
      <button onclick="filtrarMes()" style="margin-bottom:5px;">🔍 Buscar</button>
      <button onclick="limparFiltro()">♻ Limpar Filtro</button>

      <hr style="border:0; border-top:1px solid rgba(255,255,255,0.05);">

      <button id="btnExtrairRelatorio" onclick="exportarPDF()">📄 Extrair Relatório</button>

      <hr style="border:0; border-top:1px solid rgba(255,255,255,0.05);">

      <button id="btnIrParaDados" onclick="acessar()">📂 Ir para Dados</button>
      <button id="btnIrParaEstoque" onclick="irParaEstoque()">📦 Estoque</button>
      
      <button id="btnMenuCadastro" onclick="abrirModalGerenciamento()" class="btn-gerenciar">
        👤 Gerenciar Usuários
      </button>

      <hr style="border:0; border-top:1px solid rgba(255,255,255,0.05);">
        
      <button onclick="sair()" class="btn-sair">🚪 Sair</button>
    </div>

    <div class="footer" style="font-size:11px; text-align:center; color:#64748B; margin-top:15px;">
      © Diego Neri
    </div>
  </div>

  <div class="main">
    
    <div class="cards">
      <div class="card azul">
        <div class="card-titulo">💰 Gasto Total</div>
        <div id="gastoTotal" class="card-valor">R$ 0,00</div>
      </div>

      <div class="card verde">
        <div class="card-titulo">🛣 KM Total</div>
        <div id="kmTotal" class="card-valor">0 KM</div>
      </div>

      <div class="card amarelo">
        <div class="card-titulo">👤 Consumo de (<span id="nomeTecnicoSelecionado">TODOS</span>)</div>
        <div style="font-size:13px; margin-top:10px; display:flex; flex-direction:column; gap:4px;">
          <div>Gasto: <span id="gastoIndividual" style="font-weight:bold; color:#F8FAFC;">R$ 0,00</span></div>
          <div>KM: <span id="kmIndividual" style="font-weight:bold; color:#F8FAFC;">0 KM</span></div>
          <div>Média: <span id="mediaIndividual" style="font-weight:bold; color:#F8FAFC;">0.0 KM/L</span></div>
        </div>
      </div>
    </div> 

    <div class="graficos">
      <div class="grafico">
        <canvas id="g1"></canvas>
      </div>
      <div class="grafico">
        <canvas id="g2"></canvas>
      </div>
    </div>

  </div> 
</div> 

<img id="logoNERI" src="/logo.png" style="display:none;" alt="Logo Oculta">

<div id="modalCadastro" class="modal">
  <div class="modal-conteudo">
    <div class="modal-header">
      <h3 id="formTituloMain">👤 Gerenciar Usuários</h3>
      <button class="fechar-modal" onclick="fecharModalCadastro()">×</button>
    </div>
    
    <p style="font-size:13px; color:#94A3B8; margin-top:-10px; margin-bottom:20px;">Cadastre, altere permissões ou mude senhas.</p>
    
    <div id="secaoListaUsuarios">
      <div id="listaUsuariosContainer" style="max-height:200px; overflow-y:auto; margin-bottom:15px;"></div>
      <button onclick="mostrarFormularioCadastro()" class="btn-bloco" style="background:#10B981;">+ Criar Novo Usuário</button>
    </div>

    <div id="formUsuario" style="display: none;" class="form-group">
      <h4 id="formTitulo" style="margin: 0 0 15px 0; color: #60A5FA;">Novo Usuário</h4>
      <input type="hidden" id="editId">
      
      <label>Nome Completo:</label>
      <input type="text" id="cadNome" placeholder="Nome Completo">
      
      <label>Nome de Usuário (Login):</label>
      <input type="text" id="cadUsuario" placeholder="Usuário (ex: joao)">
      
      <label id="lblSenha">Senha:</label>
      <input type="password" id="cadSenha" placeholder="Digite a senha">
      
      <label>Nível de Acesso:</label>
      <select id="cadTipo">
        <option value="simples">Acesso Simples</option>
        <option value="estoque">Estoque</option>
        <option value="admin">Administrador</option>
        <option value="master">Master</option>
      </select>
    </div>

    <div class="modal-botoes" style="display:flex; gap:10px; margin-top:15px;">
      <button class="btn-bloco" style="background:#64748B; margin:0;" onclick="fecharModalCadastro()">Fechar</button>
      <button id="btnSalvarUsuario" class="btn-bloco" style="margin:0; display: none;" onclick="salvarUsuario()">Salvar</button>
    </div>
  </div>
</div>
  <img id="logoNERI" src="logo.png" style="display:none;" alt="Logo Oculta">
  <script src="app.js"></script>
</body>
</html>
