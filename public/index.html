<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { margin:0; font-family:Arial; background:#0F172A; color:white; }
.container { display:flex; }
.sidebar { width:220px; background:#111827; height:100vh; padding:20px; }
.sidebar p { cursor:pointer; padding:8px; border-radius:5px; }
.sidebar p:hover { background:#1F2937; }
.main { flex:1; padding:20px; }
.cards { display:flex; gap:20px; }
.card { background:#1F2937; padding:20px; border-radius:10px; flex:1; }
</style>
</head>

<body>

<div class="container">

<div class="sidebar">
<h2>⛽ Km Diário</h2>

<p onclick="filtrar('TODOS')">Geral</p>
<p onclick="filtrar('Sibele')">Sibele</p>
<p onclick="filtrar('Empresa')">Empresa</p>
<p onclick="filtrar('Danilo')">Danilo</p>
<p onclick="filtrar('Jose Cicero')">José Cicero</p>
<p onclick="filtrar('Welisson')">Welisson</p>
<p onclick="filtrar('Danilo BH')">Danilo BH</p>
<p onclick="filtrar('Thiago BH')">Thiago BH</p>

<input type="password" id="senha" placeholder="Senha">
<button onclick="acessar()">Ir para Dados</button>
</div>

<div class="main">
<div class="cards">
<div class="card"><h3>Gasto Total</h3><p id="gastoTotal">R$ 0</p></div>
<div class="card"><h3>Km Total</h3><p id="kmTotal">0 Km</p></div>
</div>
</div>

</div>

<script>
const tecnicos = ["Sibele","Empresa","Danilo","Jose Cicero","Welisson","Danilo BH","Thiago BH"];

let dadosGlobais = [];

function acessar(){
  if(document.getElementById("senha").value==="Brastemp1234"){
    window.location.href="/dados.html";
  } else alert("Senha incorreta");
}

async function carregar(){
  const res = await fetch("/registros");
  return await res.json();
}

function processar(dados, tecnico="TODOS"){
  let totalGasto = 0;
  let totalKm = 0;

  dados.forEach(d=>{
    if(tecnico==="TODOS" || d.tecnico===tecnico){
      totalGasto += Number(d.valor) || 0;
      totalKm += Number(d.km) || 0;
    }
  });

  document.getElementById("gastoTotal").innerText = "R$ " + totalGasto.toFixed(2);
  document.getElementById("kmTotal").innerText = totalKm + " Km";
}

function filtrar(t){
  processar(dadosGlobais, t);
}

async function init(){
  dadosGlobais = await carregar();
  processar(dadosGlobais);
}

init();
</script>

</body>
</html>
