<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login NERI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0F172A;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 420px;
      background: #1E293B;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0,0,0,.4);
      text-align: center;
    }

    .logo {
      width: 280px;
      max-width: 100%;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      background: #0F172A;
      color: white;
    }

    input::placeholder {
      color: #94A3B8;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: #22C55E;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover {
      background: #16A34A;
    }

    .titulo {
      color: white;
      margin-bottom: 20px;
      font-size: 22px;
    }
  </style>
</head>
<body>

<div class="card">
  <img src="logo.png" class="logo" alt="NERI">

  <div class="titulo">
    Gestão de Frotas
  </div>

  <input id="usuario" placeholder="Usuário">
  <input id="senha" type="password" placeholder="Senha">

  <button onclick="entrar()">Entrar</button>
</div>

<script>
async function entrar() {
  const usuario = document.getElementById("usuario").value.trim();
  const senha = document.getElementById("senha").value;

  if (!usuario || !senha) {
    alert("Preencha usuário e senha");
    return;
  }

  try {
    // Rota alterada para se comunicar com o endpoint correto do seu server.js (/api/login)
    const resposta = await fetch("/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ usuario, senha })
    });

    const dados = await resposta.json();

    if (!resposta.ok) {
      alert(dados.erro || "Erro ao fazer login");
      return;
    }

    // 1. Grava o token obtido do backend
    localStorage.setItem("token", dados.token);
    
    // 2. Acessa de forma segura o objeto interno retornado pelo MongoDB
    const infoUsuario = dados.usuario || {};
    const nomeUsuario = infoUsuario.nome || "";
    let tipoDefinido = String(infoUsuario.tipo || "").toLowerCase().trim();

    localStorage.setItem("usuarioLogado", infoUsuario.usuario || "");
    localStorage.setItem("usuarioNome", nomeUsuario);

    // 3. CAPTURA RÍGIDA DO ESTOQUE (Verifica se tipo é estoque OU se é "simples" com carimbo no nome)
    if (tipoDefinido === "estoque" || (tipoDefinido === "simples" && (nomeUsuario.toUpperCase().includes("ESTOQUE") || nomeUsuario.toUpperCase().includes("[ESTOQUE]")))) {
      tipoDefinido = "estoque";
    }

    localStorage.setItem("usuarioTipo", tipoDefinido);

    // 4. REDIRECIONAMENTO SEPARADO POR NÍVEL DE ACESSO
    if (tipoDefinido === "estoque") {
      // Usuário de estoque vai direto para as ferramentas sem passar pela index
      window.location.replace(`/estoque.html?token=${dados.token}`);
    } else {
      // Master e Administradores vão para o Dashboard Principal (index.html)
      window.location.replace(`/index.html?token=${dados.token}`);
    }

  } catch (err) {
    console.error(err);
    alert("Erro ao conectar ao servidor. Certifique-se de que o backend está rodando.");
  }
}

// Permite efetuar o login ao pressionar a tecla Enter dentro dos inputs
document.getElementById("senha").addEventListener("keypress", function(event) {
  if (event.key === "Enter") entrar();
});
document.getElementById("usuario").addEventListener("keypress", function(event) {
  if (event.key === "Enter") entrar();
});
</script>

</body>
</html>
