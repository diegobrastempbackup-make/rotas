<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NERI 2.0</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0F172A; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            color: white; 
        }
        .login-box { 
            background-color: #1E293B; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 380px; 
            text-align: center; 
            border: 1px solid rgba(255,255,255,0.05);
        }
        .login-box h2 { 
            margin-top: 0; 
            color: #E2E8F0; 
            font-size: 24px; 
            margin-bottom: 30px;
        }
        .input-group { 
            margin-bottom: 20px; 
            text-align: left; 
        }
        .input-group label { 
            display: block; 
            margin-bottom: 8px; 
            color: #94A3B8; 
            font-size: 14px; 
        }
        .input-group input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.1); 
            background-color: #0F172A; 
            color: white; 
            box-sizing: border-box; 
            font-size: 15px;
            transition: 0.3s;
        }
        .input-group input:focus { 
            outline: none; 
            border-color: #3B82F6; 
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        .btn-login { 
            width: 100%; 
            padding: 12px; 
            background-color: #3B82F6; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 10px;
        }
        .btn-login:hover { 
            background-color: #2563EB; 
        }
        .btn-login:disabled { 
            background-color: #475569; 
            cursor: not-allowed; 
        }
        .erro-msg { 
            color: #EF4444; 
            margin-top: 15px; 
            font-size: 14px; 
            min-height: 20px; 
        }
        .logo-container img {
            max-width: 150px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo-container">
            <img src="logo.svg" alt="NERI Logo" onerror="this.style.display='none'">
        </div>
        <h2>Acesso ao Sistema</h2>
        
        <div class="input-group">
            <label for="usuario">Utilizador</label>
            <input type="text" id="usuario" placeholder="Digite o seu login" autocomplete="username">
        </div>
        
        <div class="input-group">
            <label for="senha">Palavra-passe</label>
            <input type="password" id="senha" placeholder="Digite a sua senha" autocomplete="current-password">
        </div>
        
        <button class="btn-login" id="btn-entrar" onclick="fazerLogin()">Entrar</button>
        
        <div class="erro-msg" id="erro-msg"></div>
    </div>

    <script>
        document.getElementById("senha").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                fazerLogin();
            }
        });

        async function fazerLogin() {
            const usuario = document.getElementById('usuario').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const erroMsg = document.getElementById('erro-msg');
            const btn = document.getElementById('btn-entrar');

            if (!usuario || !senha) {
                erroMsg.innerText = "Por favor, preencha todos os campos.";
                return;
            }

            erroMsg.innerText = "";
            btn.innerText = "Aguarde...";
            btn.disabled = true;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });

                const dados = await res.json();

                if (res.ok) {
                    localStorage.setItem("token", dados.token);
                    localStorage.setItem("usuarioTipo", dados.tipo);
                    localStorage.setItem("nomeUsuario", dados.nome);

                    const tipo = dados.tipo;

                    // O NOVO REDIRECIONAMENTO (MODO QUIOSQUE E SUPER ADMIN INCLUÍDOS)
                    if (tipo === "totem") {
                        window.location.replace(`totem.html?token=${dados.token}`);
                    } else if (tipo === "tecnico") {
                        window.location.replace(`diario.html?token=${dados.token}`);
                    } else if (tipo === "estoque") {
                        window.location.replace(`estoque.html?token=${dados.token}`);
                    } else if (tipo === "superadmin") {
                        // O Super Admin vai direto para a sala de comando!
                        window.location.replace(`tecnicos.html?token=${dados.token}`);
                    } else if (tipo === "master" || tipo === "admin" || tipo === "simples") {
                        window.location.replace(`index.html?token=${dados.token}`);
                    } else {
                        window.location.replace(`dados.html?token=${dados.token}`);
                    }
                } else {
                    erroMsg.innerText = dados.erro || "Erro de autenticação.";
                    btn.innerText = "Entrar";
                    btn.disabled = false;
                }
            } catch (err) {
                erroMsg.innerText = "Falha de ligação com o servidor.";
                btn.innerText = "Entrar";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
