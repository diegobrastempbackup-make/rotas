<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NERI 2.0</title>
    
</head>
<body>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;

    background:
        linear-gradient(rgba(5,15,30,.55),rgba(5,15,30,.55)),
        url("fundo-login.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    color:#FFF;
}

/*==============================
    CAIXA DO LOGIN
==============================*/

.login-box{

    position:relative;

    width:580px;
    max-width:92%;

    padding:60px 70px;

    background:rgba(8,18,34,.88);

    backdrop-filter:blur(18px);

    border-radius:22px;

    border:1px solid rgba(120,180,255,.20);

    box-shadow:
        0 35px 90px rgba(0,0,0,.65),
        inset 0 0 0 1px rgba(255,255,255,.03);

    overflow:hidden;

}

.login-box::before{

    content:"";

    position:absolute;

    inset:0;

    border-radius:22px;

    padding:1px;

    background:linear-gradient(
        135deg,
        rgba(0,180,255,.45),
        rgba(255,255,255,.04),
        rgba(0,180,255,.25)
    );

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;

    pointer-events:none;

}

/*==============================
    LOGO
==============================*/

.logo-container{

    text-align:center;

    margin-bottom:35px;

}

.logo-container img{

    width:240px;

    max-width:100%;

    filter:drop-shadow(0 0 18px rgba(30,140,255,.45));

}

/*==============================
    TITULO
==============================*/

.login-box h2{

    text-align:center;

    font-size:46px;

    font-weight:700;

    margin-bottom:45px;

    color:white;

}

/*==============================
    CAMPOS
==============================*/

.input-group{

    margin-bottom:28px;

}

.input-group label{

    display:block;

    margin-bottom:12px;

    color:#D5E0F3;

    font-size:19px;

}

.input-group input{

    width:100%;

    height:66px;

    padding:0 22px;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.12);

    background:rgba(255,255,255,.08);

    color:white;

    font-size:21px;

    transition:.30s;

}

.input-group input::placeholder{

    color:#9fb0ca;

}

.input-group input:focus{

    outline:none;

    border-color:#2E89FF;

    box-shadow:
        0 0 18px rgba(46,137,255,.35);

}

/*==============================
    BOTÃO
==============================*/

.btn-login{

    width:100%;

    height:68px;

    border:none;

    border-radius:14px;

    cursor:pointer;

    font-size:24px;

    font-weight:700;

    color:white;

    background:linear-gradient(180deg,#2F84FF,#1A5BE6);

    box-shadow:
        0 15px 35px rgba(30,90,255,.40);

    transition:.30s;

}

.btn-login:hover{

    transform:translateY(-2px);

    background:linear-gradient(180deg,#4695FF,#2467F2);

}

.btn-login:disabled{

    opacity:.7;

    cursor:not-allowed;

}

/*==============================
    ERRO
==============================*/

.erro-msg{

    text-align:center;

    margin-top:20px;

    color:#FF6A6A;

    font-size:16px;

    min-height:20px;

}

/*==============================
    RESPONSIVO
==============================*/

@media (max-width:700px){

    .login-box{

        width:95%;

        padding:40px;

    }

    .logo-container img{

        width:190px;

    }

    .login-box h2{

        font-size:34px;

    }

    .input-group input{

        height:58px;

        font-size:18px;

    }

    .btn-login{

        height:60px;

        font-size:20px;

    }

}

</style>
    <div class="login-box">
        <div class="logo-container">
            <img src="logo.svg" alt="NERI Logo" onerror="this.style.display='none'">
        </div>
        <h2>Acesso ao Sistema</h2>
        
        <div class="input-group">
            <label for="usuario">Utilizador</label>
            <input type="text" id="usuario" placeholder="Digite o seu login" autocomplete="username">
        </div>
        
        <div class="input-group">
            <label for="senha">Palavra-passe</label>
            <input type="password" id="senha" placeholder="Digite a sua senha" autocomplete="current-password">
        </div>
        
        <button class="btn-login" id="btn-entrar" onclick="fazerLogin()">Entrar</button>
        
        <div class="erro-msg" id="erro-msg"></div>
    </div>

    <script>
        document.getElementById("senha").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                fazerLogin();
            }
        });

        async function fazerLogin() {
            const usuario = document.getElementById('usuario').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const erroMsg = document.getElementById('erro-msg');
            const btn = document.getElementById('btn-entrar');

            if (!usuario || !senha) {
                erroMsg.innerText = "Por favor, preencha todos os campos.";
                return;
            }

            erroMsg.innerText = "";
            btn.innerText = "Aguarde...";
            btn.disabled = true;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });

                const dados = await res.json();

                if (res.ok) {
                    localStorage.setItem("token", dados.token);
                    localStorage.setItem("usuarioTipo", dados.tipo);
                    localStorage.setItem("nomeUsuario", dados.nome);

                    const tipo = dados.tipo;

                    // O NOVO REDIRECIONAMENTO (MODO QUIOSQUE E SUPER ADMIN INCLUÍDOS)
                    if (tipo === "totem") {
                        window.location.replace(`totem.html?token=${dados.token}`);
                    } else if (tipo === "tecnico") {
                        window.location.replace(`diario.html?token=${dados.token}`);
                    } else if (tipo === "estoque") {
                        window.location.replace(`estoque.html?token=${dados.token}`);
                    } else if (tipo === "superadmin") {
                        // O Super Admin vai direto para a sala de comando!
                        window.location.replace(`tecnicos.html?token=${dados.token}`);
                    } else if (tipo === "master" || tipo === "admin" || tipo === "simples") {
                        window.location.replace(`index.html?token=${dados.token}`);
                    } else {
                        window.location.replace(`dados.html?token=${dados.token}`);
                    }
                } else {
                    erroMsg.innerText = dados.erro || "Erro de autenticação.";
                    btn.innerText = "Entrar";
                    btn.disabled = false;
                }
            } catch (err) {
                erroMsg.innerText = "Falha de ligação com o servidor.";
                btn.innerText = "Entrar";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
