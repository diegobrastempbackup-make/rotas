<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NERI 2.0</title>
    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;

    background:
        linear-gradient(rgba(5,15,30,.55),rgba(5,15,30,.55)),
        url("fundo-login.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    color:white;

}

.login-box{

    width:400px;

    background:rgba(15,23,42,.82);

    backdrop-filter:blur(14px);

    border-radius:18px;

    padding:40px;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:0 25px 60px rgba(0,0,0,.55);

}

.logo-container{

    text-align:center;
    margin-bottom:25px;

}

.logo-container img{

    width:140px;

}

.login-box h2{

    text-align:center;

    margin-bottom:30px;

    font-size:26px;

    color:white;

}

.input-group{

    margin-bottom:20px;

}

.input-group label{

    display:block;

    margin-bottom:8px;

    color:#b8c7dc;

    font-size:14px;

}

.input-group input{

    width:100%;

    height:48px;

    border-radius:8px;

    border:1px solid rgba(255,255,255,.15);

    background:rgba(255,255,255,.08);

    color:white;

    padding:0 15px;

    font-size:15px;

    transition:.3s;

}

.input-group input:focus{

    outline:none;

    border-color:#2196f3;

    box-shadow:0 0 10px rgba(33,150,243,.4);

}

.btn-login{

    width:100%;

    height:48px;

    border:none;

    border-radius:8px;

    background:#1976D2;

    color:white;

    font-size:17px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}

.btn-login:hover{

    background:#2196F3;

    transform:translateY(-2px);

}

.erro-msg{

    text-align:center;

    margin-top:15px;

    color:#ff5b5b;

}

</style>
</head>
<body>

    <div class="login-box">
        <div class="logo-container">
            <img src="logo.svg" alt="NERI Logo" onerror="this.style.display='none'">
        </div>
        <h2>Acesso ao Sistema</h2>
        
        <div class="input-group">
            <label for="usuario">Utilizador</label>
            <input type="text" id="usuario" placeholder="Digite o seu login" autocomplete="username">
        </div>
        
        <div class="input-group">
            <label for="senha">Palavra-passe</label>
            <input type="password" id="senha" placeholder="Digite a sua senha" autocomplete="current-password">
        </div>
        
        <button class="btn-login" id="btn-entrar" onclick="fazerLogin()">Entrar</button>
        
        <div class="erro-msg" id="erro-msg"></div>
    </div>

    <script>
        document.getElementById("senha").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                fazerLogin();
            }
        });

        async function fazerLogin() {
            const usuario = document.getElementById('usuario').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const erroMsg = document.getElementById('erro-msg');
            const btn = document.getElementById('btn-entrar');

            if (!usuario || !senha) {
                erroMsg.innerText = "Por favor, preencha todos os campos.";
                return;
            }

            erroMsg.innerText = "";
            btn.innerText = "Aguarde...";
            btn.disabled = true;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });

                const dados = await res.json();

                if (res.ok) {
                    localStorage.setItem("token", dados.token);
                    localStorage.setItem("usuarioTipo", dados.tipo);
                    localStorage.setItem("nomeUsuario", dados.nome);

                    const tipo = dados.tipo;

                    // O NOVO REDIRECIONAMENTO (MODO QUIOSQUE E SUPER ADMIN INCLUÍDOS)
                    if (tipo === "totem") {
                        window.location.replace(`totem.html?token=${dados.token}`);
                    } else if (tipo === "tecnico") {
                        window.location.replace(`diario.html?token=${dados.token}`);
                    } else if (tipo === "estoque") {
                        window.location.replace(`estoque.html?token=${dados.token}`);
                    } else if (tipo === "superadmin") {
                        // O Super Admin vai direto para a sala de comando!
                        window.location.replace(`tecnicos.html?token=${dados.token}`);
                    } else if (tipo === "master" || tipo === "admin" || tipo === "simples") {
                        window.location.replace(`index.html?token=${dados.token}`);
                    } else {
                        window.location.replace(`dados.html?token=${dados.token}`);
                    }
                } else {
                    erroMsg.innerText = dados.erro || "Erro de autenticação.";
                    btn.innerText = "Entrar";
                    btn.disabled = false;
                }
            } catch (err) {
                erroMsg.innerText = "Falha de ligação com o servidor.";
                btn.innerText = "Entrar";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
