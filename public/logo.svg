<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 80">
  <defs>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    
    <linearGradient id="silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <ellipse cx="45" cy="40" rx="30" ry="12" fill="none" stroke="url(#neonBlue)" stroke-width="2" transform="rotate(-30 45 40)" opacity="0.4"/>
  <ellipse cx="45" cy="40" rx="30" ry="12" fill="none" stroke="url(#neonBlue)" stroke-width="4" transform="rotate(30 45 40)" filter="url(#glow)"/>
  
  <text x="45" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" font-style="italic" fill="#FFFFFF" text-anchor="middle" filter="url(#glow)">N</text>

  <text x="95" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="900" fill="url(#silver)" letter-spacing="2">NERI</text>

  <rect x="200" y="22" width="48" height="22" rx="6" fill="url(#neonBlue)" />
  <text x="224" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2.0</text>
  
  <text x="98" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#64748B" letter-spacing="4">FLEET MANAGEMENT</text>
</svg>
