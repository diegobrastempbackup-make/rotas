<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<title>Gestão de Peças - NERI</title>


<style>

body {
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#0F172A;
    color:white;
    display:flex;
    height:100vh;
    overflow:hidden;
}


.sidebar {

    width:250px;
    background:#1E293B;
    border-right:1px solid rgba(255,255,255,0.05);

    display:flex;
    flex-direction:column;

    padding:20px;

    box-sizing:border-box;

}


.menu button {

    background:transparent;

    border:1px solid rgba(255,255,255,0.1);

    color:#94A3B8;

    padding:12px;

    margin-bottom:8px;

    border-radius:8px;

    cursor:pointer;

    text-align:left;

    width:100%;

}


.menu button:hover {

    background:rgba(255,255,255,0.05);

    color:white;

}



.btn-sair {

    color:#EF4444 !important;

}



.main {

    flex:1;

    padding:25px;

    overflow-y:auto;

}



.header-painel {

    display:flex;

    align-items:center;

}



.header-painel h1 {

    margin:0;

}



.btn-toggle-menu {

    background:#1E293B;

    color:white;

    border:1px solid rgba(255,255,255,0.1);

    padding:10px 15px;

    border-radius:8px;

    cursor:pointer;

    margin-right:15px;

}



.abas-nav {

    display:flex;

    gap:10px;

    margin-top:25px;

}



.aba-btn {

    background:transparent;

    border:none;

    color:#94A3B8;

    padding:10px 20px;

    cursor:pointer;

}



.aba-btn.ativa {

    background:#2563EB;

    color:white;

    border-radius:8px;

}



table {

    width:100%;

    border-collapse:collapse;

    margin-top:20px;

    background:#1E293B;

}



th {

    background:#0F172A;

    color:#94A3B8;

    padding:12px;

    text-align:left;

}



td {

    padding:12px;

    border-bottom:1px solid rgba(255,255,255,0.05);

}



.btn-acao {

    border:none;

    padding:7px 12px;

    border-radius:6px;

    cursor:pointer;

    color:white;

}



.btn-verde {

    background:#10B981;

}



.btn-amarelo {

    background:#F59E0B;

    color:black;

}



.btn-vermelho {

    background:#EF4444;

}



.form-group {

    background:#1E293B;

    padding:20px;

    border-radius:8px;

    margin-top:20px;

}


input,select {

    background:#0F172A;

    color:white;

    border:1px solid rgba(255,255,255,0.1);

    padding:10px;

    border-radius:6px;

}


</style>


<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>


</head>


<body>



<div class="sidebar" id="menuLateral">


<img src="logo.svg" style="max-width:100%;margin-bottom:20px;">


<div class="menu">


<button onclick="navegarSeguro('/index.html')">
📊 Dashboard
</button>


<button onclick="navegarSeguro('/estoque.html')">
📦 Almoxarifado
</button>


<button onclick="navegarSeguro('/pecas.html')" 
style="background:#2563EB;color:white;">
🔧 Peças
</button>


<button onclick="localStorage.clear();window.location.replace('/login.html')" class="btn-sair">
🚪 Sair
</button>


</div>


</div>





<div class="main">


<div class="header-painel">


<button class="btn-toggle-menu" onclick="toggleMenu()">
☰
</button>


<h1>
Gestão de Peças
</h1>


</div>





<div class="abas-nav">


<button id="btnAbaSolicitacoes"
class="aba-btn ativa"
onclick="mudarAba('solicitacoes')">

Solicitações

</button>


<button id="btnAbaCatalogo"
class="aba-btn"
onclick="mudarAba('catalogo')">

Catálogo

</button>


</div>





<div id="abaSolicitacoes">



<div class="form-group">


<label>
Filtrar por Data:
</label>


<input type="date" id="filtroData">


<button class="btn-acao btn-verde"
onclick="carregarSolicitacoes()">

🔄 Atualizar

</button>


<button class="btn-acao btn-verde"
onclick="gerarPDFSolicitacoes()">

📄 PDF

</button>


</div>





<table id="tabelaSolicitacoes">


<thead>


<tr>

<th>Data/Hora</th>

<th>Técnico</th>

<th>Peça</th>

<th>Quantidade</th>

<th>Ações</th>

</tr>


</thead>


<tbody>


</tbody>


</table>



</div>
<script>

let cacheSolicitacoes = [];

function obterToken(){
    return localStorage.getItem("token");
}

function toggleMenu(){
    const menu = document.getElementById("menuLateral");
    if(menu){
        menu.style.display = menu.style.display === "none" ? "flex" : "none";
    }
}

function mudarAba(nome){

    const solicitacoes = document.getElementById("abaSolicitacoes");
    const catalogo = document.getElementById("abaCatalogo");

    const btnSolic = document.getElementById("btnAbaSolicitacoes");
    const btnCat = document.getElementById("btnAbaCatalogo");

    if(nome === "catalogo"){
        if(solicitacoes) solicitacoes.style.display="none";
        if(catalogo) catalogo.style.display="block";
        if(btnSolic) btnSolic.classList.remove("ativa");
        if(btnCat) btnCat.classList.add("ativa");
    }else{
        if(solicitacoes) solicitacoes.style.display="block";
        if(catalogo) catalogo.style.display="none";
        if(btnCat) btnCat.classList.remove("ativa");
        if(btnSolic) btnSolic.classList.add("ativa");
    }
}


async function carregarSolicitacoes(){

    try{

        let url="/api/pecas/solicitacoes";

        const data=document.getElementById("filtroData")?.value;

        if(data){
            url += "?data=" + data;
        }


        const resposta = await fetch(url,{
            headers:{
                "Authorization":"Bearer " + obterToken()
            }
        });


        const dados = await resposta.json();

        cacheSolicitacoes=dados;


        const tbody=document.querySelector("#tabelaSolicitacoes tbody");

        tbody.innerHTML="";


        dados.forEach(solicitacao=>{


            if(!solicitacao.pecas) return;


            solicitacao.pecas.forEach(peca=>{


                const tr=document.createElement("tr");


                tr.innerHTML=`

<td>
${new Date(solicitacao.dataSolicitacao).toLocaleString("pt-BR")}
</td>

<td>
${solicitacao.tecnico || ""}
</td>

<td>
${peca.nome_peca || "Peça não informada"}
</td>

<td>
<strong>${peca.quantidade} un.</strong>
</td>

<td>

<button class="btn-acao btn-amarelo"
onclick="editarQuantidade('${solicitacao._id}','${peca.peca_id}',${peca.quantidade})">
✏️ Editar
</button>

<button class="btn-acao btn-vermelho"
onclick="excluirPeca('${solicitacao._id}','${peca.peca_id}')">
🗑️ Excluir
</button>
function navegarSeguro(url){

    const token = localStorage.getItem("token");

    if(!token){

        window.location.replace("/login.html");

        return;

    }


    window.location.href = url;

}

</td>

`;

                tbody.appendChild(tr);

            });

        });


    }catch(e){

        console.error(e);

        alert("Erro ao carregar solicitações");

    }

}



async function editarQuantidade(id, pecaId, quantidade){

    const nova = prompt(
        "Informe a nova quantidade:",
        quantidade
    );


    if(nova === null) return;


    await fetch(
        `/api/pecas/solicitacoes/${id}/peca/${pecaId}`,
        {
            method:"PUT",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer " + obterToken()
            },
            body:JSON.stringify({
                quantidade:Number(nova)
            })
        }
    );


    carregarSolicitacoes();

}



async function excluirPeca(id, pecaId){

    if(!confirm("Excluir somente esta peça da solicitação?"))
        return;


    await fetch(
        `/api/pecas/solicitacoes/${id}/peca/${pecaId}`,
        {
            method:"DELETE",
            headers:{
                "Authorization":"Bearer " + obterToken()
            }
        }
    );


    carregarSolicitacoes();

}



function gerarPDFSolicitacoes(){

    if(!window.jspdf){
        alert("Biblioteca PDF não carregada");
        return;
    }


    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();


    doc.text("Solicitações de Peças",10,10);


    let linhas=[];


    cacheSolicitacoes.forEach(s=>{

        (s.pecas || []).forEach(p=>{

            linhas.push([
                s.tecnico,
                p.nome_peca,
                p.quantidade
            ]);

        });

    });


    doc.autoTable({

        startY:20,

        head:[
            ["Técnico","Peça","Quantidade"]
        ],

        body:linhas

    });


    doc.save("solicitacoes_pecas.pdf");

}



window.onload=function(){

    carregarSolicitacoes();

};

</script>
