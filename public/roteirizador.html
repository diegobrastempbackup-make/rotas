<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Roteirizador - NERI 2.0</title>
    
    <!-- Leaflet CSS & JS (Motor do Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0F172A; color: white; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Padrão NERI */
        .sidebar { width: 250px; background: #1E293B; border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; padding: 20px; z-index: 1000; }
        .menu button { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #94A3B8; padding: 12px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 14px; transition: 0.2s; width: 100%; }
        .menu button:hover { background: rgba(255,255,255,0.05); color: white; }
        .btn-ativo { background: #2563EB !important; color: white !important; border-color: #3B82F6 !important; font-weight: bold; }
        .btn-sair { color: #EF4444 !important; border-color: rgba(239,68,68,0.3) !important; margin-top: auto; }
        .btn-sair:hover { background: rgba(239,68,68,0.1) !important; }

        /* Layout Principal */
        .main-container { flex: 1; display: flex; padding: 15px; gap: 15px; background: #0F172A; }
        
        /* Coluna Esquerda (Controles e Lista de Equipe) */
        .left-panel { width: 320px; display: flex; flex-direction: column; gap: 15px; }
        
        .box-controles { background: #1E293B; padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .box-controles h3 { margin: 0 0 15px 0; font-size: 16px; color: #60A5FA; display: flex; align-items: center; gap: 8px; }
        .input-data { width: 100%; padding: 12px; background: #0F172A; color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; font-family: inherit; }
        .btn-acao { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        .btn-buscar { background: #3B82F6; color: white; }
        .btn-buscar:hover { background: #2563EB; }
        .btn-frota { background: #8B5CF6; color: white; }
        .btn-frota:hover { background: #7C3AED; }
        .btn-excel { background: #10B981; color: white; }
        .btn-excel:hover { background: #059669; }

        .box-equipe { background: #1E293B; padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); flex: 1; overflow-y: auto; }
        .equipe-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .equipe-header h3 { margin: 0; font-size: 16px; color: #E2E8F0; }
        
        .tecnico-card { background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; gap: 8px; }
        .tecnico-card:hover { background: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.3); }
        .tec-nome { font-weight: bold; color: white; font-size: 14px; text-transform: uppercase; }
        .progresso-bg { width: 100%; background: #0F172A; height: 6px; border-radius: 3px; overflow: hidden; }
        .progresso-bar { height: 100%; background: #10B981; border-radius: 3px; transition: width 0.5s; }
        .tec-status { font-size: 11px; color: #94A3B8; display: flex; justify-content: space-between; }

        /* Área do Mapa */
        .map-wrapper { flex: 1; background: #1E293B; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); position: relative; overflow: hidden; }
        #mapa { width: 100%; height: 100%; z-index: 1; }

        /* Painel Flutuante de Itinerário (Direita) */
        .painel-itinerario { position: absolute; top: 15px; right: 15px; width: 350px; max-height: calc(100% - 30px); background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 1000; display: none; flex-direction: column; overflow: hidden; }
        .itinerario-header { background: rgba(15, 23, 42, 0.8); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .itinerario-header h3 { margin: 0; color: white; font-size: 16px; display: flex; align-items: center; gap: 8px; }
        .btn-fechar { background: transparent; border: none; color: #94A3B8; font-size: 20px; cursor: pointer; }
        .btn-fechar:hover { color: #EF4444; }
        
        .legenda-status { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px 15px; background: rgba(0,0,0,0.2); font-size: 11px; color: #94A3B8; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .legenda-item { display: flex; align-items: center; gap: 4px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }

        .lista-paragens { padding: 15px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .paragem-item { background: #0F172A; border-left: 4px solid #3B82F6; padding: 12px; border-radius: 6px; font-size: 13px; }
        .paragem-item.pendente { border-color: #3B82F6; }
        .paragem-item.transito { border-color: #F59E0B; }
        .paragem-item.local { border-color: #F97316; }
        .paragem-item.sucesso { border-color: #10B981; }
        .paragem-item.erro { border-color: #EF4444; }
        
        .paragem-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .paragem-num { font-weight: bold; color: white; }
        .paragem-cod { color: #94A3B8; }
        .paragem-end { color: #CBD5E1; line-height: 1.4; }

    </style>
    <script>function navegarSeguro(rota) { window.location.href = `${rota}?token=${localStorage.getItem("token")}`; }</script>
</head>
<body>

<div class="sidebar">
    <div class="logo-area">
        <img src="logo.svg" alt="NERI" style="max-width: 100%; margin-bottom: 20px;" onerror="this.style.display='none'">
    </div>
    <div class="menu">
        <button onclick="navegarSeguro('/index.html')">📊 Dashboard Geral</button>
        <button onclick="navegarSeguro('/dados.html')">📂 Lançar Dados</button>
        <button class="btn-ativo">🗺️ Roteirizador</button>
        <button onclick="navegarSeguro('/fila.html')">🗣️ Triagem e Ponto</button>
        <button onclick="navegarSeguro('/estoque.html')">📦 Almoxarifado</button>
        <hr style="border-color: rgba(255,255,255,0.05); margin: 15px 0;">
        <button onclick="navegarSeguro('/tecnicos.html')" id="btnAdmin" style="display:none;">⚙️ Administração</button>
        <button onclick="localStorage.clear(); window.location.replace('/login.html')" class="btn-sair">🚪 Sair</button>
    </div>
</div>

<div class="main-container">
    
    <div class="left-panel">
        <div class="box-controles">
            <h3>📍 Radar e Relatórios</h3>
            <input type="date" id="dataFiltro" class="input-data">
            <button class="btn-acao btn-buscar" onclick="buscarPlanejamento()">1. Buscar Planejamento</button>
            <button class="btn-acao btn-frota" onclick="verFrotaNoMapa()">2. Ver Toda a Frota no Mapa</button>
            <button class="btn-acao btn-excel" onclick="exportarRelatorioExcel()">3. Extrair Relatório (Excel)</button>
        </div>

        <div class="box-equipe">
            <div class="equipe-header">
                <h3>Equipe em Operação</h3>
                <span id="badgeMonitorando" style="font-size:11px; color:#60A5FA;">Aguardando busca...</span>
            </div>
            <div id="listaEquipe" style="display: flex; flex-direction: column;">
                <!-- Preenchido via JS -->
            </div>
        </div>
    </div>

    <div class="map-wrapper">
        <div id="mapa"></div>

        <!-- PAINEL DE ITINERÁRIO (INDIVIDUAL) -->
        <div class="painel-itinerario" id="painelItinerario">
            <div class="itinerario-header">
                <h3 id="tituloItinerario">🗺️ Itinerário</h3>
                <button class="btn-fechar" onclick="fecharItinerario()">×</button>
            </div>
            <div class="legenda-status">
                <div class="legenda-item"><div class="dot" style="background:#3B82F6;"></div> Pendente</div>
                <div class="legenda-item"><div class="dot" style="background:#F59E0B;"></div> Em Trânsito</div>
                <div class="legenda-item"><div class="dot" style="background:#F97316;"></div> No Local</div>
                <div class="legenda-item"><div class="dot" style="background:#10B981;"></div> Sucesso</div>
                <div class="legenda-item"><div class="dot" style="background:#EF4444;"></div> Falha/Ausente</div>
            </div>
            <div class="lista-paragens" id="conteudoItinerario">
                <!-- Paragens renderizadas aqui -->
            </div>
        </div>
    </div>

</div>

<script>
    const token = localStorage.getItem("token");
    if (!token) window.location.replace("/login.html");
    
    // Verificação de Acesso Admin
    function obterPayloadDoToken() {
        try { return JSON.parse(decodeURIComponent(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''))); } catch (e) { return null; }
    }
    const payload = obterPayloadDoToken();
    if (localStorage.getItem("usuarioTipo") === "master" || localStorage.getItem("usuarioTipo") === "admin" || (payload && payload.tipo === "superadmin") || (payload && payload.superadmin_original)) {
        document.getElementById("btnAdmin").style.display = "block";
    }

    let map;
    let markersLayer; // Camada principal para agrupar TODOS os pontos e linhas
    let rotasAtuais = [];

    document.addEventListener("DOMContentLoaded", () => {
        // Inicializa a data para hoje
        document.getElementById('dataFiltro').value = new Date().toISOString().split('T')[0];
        
        // Inicializa o Mapa (Focado em São Paulo por padrão)
        map = L.map('mapa').setView([-23.5505, -46.6333], 10);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        // Cria a camada de marcadores que garante a limpeza fácil
        markersLayer = L.featureGroup().addTo(map);
    });

    // Função que cria o ícone colorido com ou sem número
    function obterIconeMarcador(status, numero = "") {
        let cor = "#3B82F6"; // Azul padrão (Pendente)
        if (status === "Em Trânsito") cor = "#F59E0B"; 
        if (status === "No Local") cor = "#F97316"; 
        if (status === "Atendido" || status === "Sucesso" || status === "Concluído") cor = "#10B981"; 
        if (status === "Ausente" || status === "Cancelado" || status === "Insucesso") cor = "#EF4444"; 

        // Se tiver número (Individual), mostra o número. Se for vazio (Coletivo), mostra bolinha.
        let conteudo = numero !== "" 
            ? `<span style="color:white; font-size:12px; font-weight:bold;">${numero}</span>` 
            : `<div style="width:8px; height:8px; background:white; border-radius:50%;"></div>`;

        return L.divIcon({
            className: 'marcador-customizado',
            html: `<div style="background-color: ${cor}; width: 28px; height: 28px; border-radius: 50%; border: 2px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;">
                       ${conteudo}
                   </div>`,
            iconSize: [28, 28],
            iconAnchor: [14, 14],
            popupAnchor: [0, -14]
        });
    }

    async function buscarPlanejamento() {
        const dataBusca = document.getElementById('dataFiltro').value;
        if (!dataBusca) return alert("Selecione uma data.");

        const btn = document.querySelector('.btn-buscar');
        btn.innerText = "Buscando...";
        
        try {
            const res = await fetch(`/api/rotas?data=${dataBusca}`, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            rotasAtuais = await res.json();
            
            document.getElementById('badgeMonitorando').innerText = `Monitorando: ${dataBusca.split('-').reverse().join('/')}`;
            renderizarListaEquipe();
            
            // Limpa o mapa ao fazer uma nova busca
            markersLayer.clearLayers();
            fecharItinerario();
            
        } catch (e) {
            alert("Erro ao buscar dados do roteirizador.");
        } finally {
            btn.innerText = "1. Buscar Planejamento";
        }
    }

    function renderizarListaEquipe() {
        const container = document.getElementById('listaEquipe');
        container.innerHTML = "";

        if(rotasAtuais.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding: 20px; color:#94A3B8;">Nenhuma rota planeada para esta data.</div>`;
            return;
        }

        // Ordenar alfabeticamente
        rotasAtuais.sort((a,b) => a.tecnico.localeCompare(b.tecnico));

        rotasAtuais.forEach(rota => {
            const total = rota.itinerario ? rota.itinerario.length : 0;
            // Considera "baixados" os sucessos e falhas (já saiu da pendência)
            const concluidos = rota.itinerario ? rota.itinerario.filter(i => 
                i.status === "Atendido" || i.status === "Sucesso" || 
                i.status === "Ausente" || i.status === "Cancelado" || i.status === "Insucesso"
            ).length : 0;
            
            const progressoPerc = total > 0 ? Math.round((concluidos / total) * 100) : 0;

            container.innerHTML += `
                <div class="tecnico-card" onclick="verRotaIndividual('${rota.tecnico}')">
                    <div class="tec-nome">${rota.tecnico}</div>
                    <div class="tec-status">
                        <span>Progresso: ${progressoPerc}%</span>
                        <span>${concluidos} / ${total} OS</span>
                    </div>
                    <div class="progresso-bg">
                        <div class="progresso-bar" style="width: ${progressoPerc}%;"></div>
                    </div>
                </div>
            `;
        });
    }

    // MAPA COLETIVO
    function verFrotaNoMapa() {
        if(rotasAtuais.length === 0) return alert("Busque o planeamento primeiro.");
        
        // A MÁGICA DA LIMPEZA: Remove linhas e pinos individuais antigos
        markersLayer.clearLayers(); 
        fecharItinerario();

        let encontrouCoordenadas = false;

        rotasAtuais.forEach(rota => {
            if(rota.itinerario) {
                rota.itinerario.forEach(item => {
                    if (item.lat && item.lng) {
                        let lat = parseFloat(item.lat);
                        let lng = parseFloat(item.lng);
                        
                        // Escudo de proteção (Garante que a coordenada é um número válido)
                        if(!isNaN(lat) && !isNaN(lng)) {
                            // Cria Marcador Coletivo (sem número)
                            L.marker([lat, lng], { icon: obterIconeMarcador(item.status, "") })
                             .bindPopup(`<b>${rota.tecnico}</b><br>OS: ${item.codigo}<br>Status: ${item.status || 'Pendente'}`)
                             .addTo(markersLayer);
                            encontrouCoordenadas = true;
                        }
                    }
                });
            }
        });

        if (encontrouCoordenadas) {
            map.fitBounds(markersLayer.getBounds(), { padding: [40, 40] });
        } else {
            alert("Nenhuma coordenada de GPS válida encontrada nas rotas de hoje.");
        }
    }

    // MAPA INDIVIDUAL
    function verRotaIndividual(nomeTecnico) {
        // A MÁGICA DA LIMPEZA: Remove pinos de outros técnicos
        markersLayer.clearLayers(); 

        const rota = rotasAtuais.find(r => r.tecnico === nomeTecnico);
        if (!rota || !rota.itinerario) return;

        document.getElementById('tituloItinerario').innerHTML = `📌 <b>${nomeTecnico}</b>`;
        document.getElementById('painelItinerario').style.display = 'flex';

        let listaHtml = "";
        let pontosValidosParaLinha = [];

        rota.itinerario.forEach((item, index) => {
            let num = index + 1;
            let classeCor = "pendente";
            if (item.status === "Em Trânsito") classeCor = "transito";
            if (item.status === "No Local") classeCor = "local";
            if (item.status === "Atendido" || item.status === "Sucesso") classeCor = "sucesso";
            if (item.status === "Ausente" || item.status === "Cancelado" || item.status === "Insucesso") classeCor = "erro";

            // Desenha na lista flutuante (Mesmo se não tiver GPS, aparece na lista)
            listaHtml += `
                <div class="paragem-item ${classeCor}">
                    <div class="paragem-header">
                        <span class="paragem-num">${num}º Paragem</span>
                        <span class="paragem-cod">OS: ${item.codigo}</span>
                    </div>
                    <div class="paragem-end">${item.endereco}</div>
                    <div style="margin-top:5px; font-size:11px; font-weight:bold; color:var(--text-color);">${item.status || 'Pendente'}</div>
                </div>
            `;

            // Desenha no Mapa apenas se tiver GPS Válido (O Escudo Anti-Crash)
            if (item.lat && item.lng) {
                let lat = parseFloat(item.lat);
                let lng = parseFloat(item.lng);
                
                if(!isNaN(lat) && !isNaN(lng)) {
                    pontosValidosParaLinha.push([lat, lng]); // Guarda a coordenada para traçar a linha depois
                    
                    // Cria Marcador Individual (com número)
                    L.marker([lat, lng], { icon: obterIconeMarcador(item.status, num) })
                     .bindPopup(`<b>OS: ${item.codigo}</b><br>${item.endereco}<br>Status: ${item.status || 'Pendente'}`)
                     .addTo(markersLayer);
                }
            }
        });

        document.getElementById('conteudoItinerario').innerHTML = listaHtml;

        // Desenha a linha tracejada conectando os pontos (precisa ter no mínimo 2 pontos válidos)
        if (pontosValidosParaLinha.length > 1) {
            L.polyline(pontosValidosParaLinha, { 
                color: '#3B82F6', 
                weight: 3, 
                dashArray: '8, 8', 
                opacity: 0.7 
            }).addTo(markersLayer);
        }

        // Foca a câmara na rota deste técnico
        if (pontosValidosParaLinha.length > 0) {
            map.fitBounds(markersLayer.getBounds(), { padding: [50, 50] });
        } else {
            // Se não desenhou nada, avisa
            alert(`Atenção: A rota de ${nomeTecnico} existe, mas não possui pontos de GPS válidos salvos no sistema para desenhar no mapa.`);
        }
    }

    function fecharItinerario() {
        document.getElementById('painelItinerario').style.display = 'none';
    }

    // EXTRAÇÃO DE EXCEL DA ROTA DO DIA
    function exportarRelatorioExcel() {
        if(rotasAtuais.length === 0) return alert("Busque o planeamento antes de exportar.");

        let dadosPlanilha = [];
        rotasAtuais.forEach(rota => {
            if(rota.itinerario) {
                rota.itinerario.forEach((item, index) => {
                    dadosPlanilha.push({
                        "Técnico": rota.tecnico,
                        "Data": rota.data,
                        "Sequência": index + 1,
                        "OS": item.codigo,
                        "Endereço": item.endereco,
                        "Status Final": item.status || "Pendente"
                    });
                });
            }
        });

        const ws = XLSX.utils.json_to_sheet(dadosPlanilha);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Monitoramento");
        
        const dataStr = document.getElementById('dataFiltro').value;
        XLSX.writeFile(wb, `Rotas_NERI_${dataStr}.xlsx`);
    }
</script>
</body>
</html>
