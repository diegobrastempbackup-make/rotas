<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roteirizador Inteligente - NERI</title>
    
    <link rel="stylesheet" href="style.css?v=2">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        .main { flex-grow: 1; height: 100vh; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; }
        .header-painel h1 { margin: 0 0 5px 0; font-size: 24px; color: white; }
        .header-painel p { margin: 0 0 20px 0; color: #94A3B8; font-size: 14px; }
        
        /* Área de Upload */
        .upload-area { border: 2px dashed rgba(59, 130, 246, 0.5); background: rgba(30, 41, 59, 0.5); padding: 40px; text-align: center; border-radius: 12px; cursor: pointer; transition: 0.3s; margin-bottom: 20px; }
        .upload-area:hover { background: rgba(30, 41, 59, 0.8); border-color: #3B82F6; }
        .upload-area input { display: none; }
        .upload-area h3 { color: #60A5FA; margin: 0 0 10px 0; }
        .upload-area p { color: #94A3B8; font-size: 13px; margin: 0; }

        /* Painel de Controle de Rotas (Escondido até carregar o Excel) */
        #painelRotas { display: none; flex-grow: 1; display: flex; gap: 20px; margin-top: 10px; }
        
        .lista-tecnicos { width: 350px; background: #1E293B; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; overflow: hidden; }
        .lista-tecnicos-header { padding: 15px; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .lista-tecnicos-header h3 { margin: 0; color: white; font-size: 16px; }
        
        .tecnico-item { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .tecnico-item:hover { background: rgba(59, 130, 246, 0.1); }
        .tecnico-item.ativo { background: rgba(59, 130, 246, 0.2); border-left: 4px solid #3B82F6; }
        .tecnico-nome { font-weight: bold; color: #E2E8F0; }
        .tecnico-stats { font-size: 12px; color: #94A3B8; margin-top: 4px; }
        
        #mapaArea { flex-grow: 1; background: #0F172A; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; position: relative; }
        #mapa { width: 100%; height: 100%; }

        .lista-clientes { flex-grow: 1; overflow-y: auto; }
        
        .badge-turno { font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: bold; }
        .badge-manha { background: rgba(245, 158, 11, 0.2); color: #F59E0B; }
        .badge-tarde { background: rgba(16, 185, 129, 0.2); color: #10B981; }
    </style>
    <script>
        function navegarSeguro(rota) { const token = localStorage.getItem("token"); window.location.href = `${rota}?token=${token}`; }
    </script>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="logo-area"><img src="logo.svg" class="logo" alt="Logo NERI" style="max-width: 100%; height: auto; margin-bottom: 10px;" /></div>
        <div class="menu">
            <button onclick="navegarSeguro('/index.html')">📊 Dashboard Geral</button>
            <button onclick="navegarSeguro('/dados.html')">📂 Lançar Dados</button>
            <button style="background: #2563EB; color: white; border-color: #3B82F6;">🗺️ Roteirizador</button>
            <button onclick="navegarSeguro('/estoque.html')">📦 Almoxarifado</button>
            <hr><button onclick="navegarSeguro('/tecnicos.html')">⚙️ Administração</button><hr>
            <button onclick="localStorage.clear(); window.location.replace('/login.html')" class="btn-sair">🚪 Sair</button>
        </div>
    </div>

    <div class="main">
        <div class="header-painel">
            <h1>Roteirizador de Frotas</h1>
            <p>Faça upload da sua folha de serviços (Excel/CSV). O sistema fará a divisão por técnico e calculará a rota ideal.</p>
        </div>

        <label class="upload-area" id="areaUpload">
            <input type="file" id="arquivoExcel" accept=".xlsx, .xls, .csv" onchange="processarExcel(event)">
            <h3>📥 Clique ou arraste a sua folha de Excel aqui</h3>
            <p>Formatos suportados: .XLSX, .XLS, .CSV</p>
        </label>

        <div id="painelRotas">
            <div class="lista-tecnicos">
                <div class="lista-tecnicos-header" style="display: flex; justify-content: space-between; align-items: center;">
    <h3>Equipa em Rota Hoje</h3>
    <button onclick="limparRotas()" style="background: transparent; border: 1px solid #EF4444; color: #EF4444; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px;">🔄 Nova Planilha</button>
</div>
                <div class="lista-clientes" id="listaTecnicosUI">
                    </div>
            </div>
            
            <div id="mapaArea">
                <div id="mapa"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // Validação de Segurança
    const token = localStorage.getItem("token");
    if (!token) window.location.replace("/login.html");

    let mapa = null;
    let layerGrupo = null; // Grupo de pinos do mapa
    let dadosGlobaisRotas = {}; 

    document.addEventListener("DOMContentLoaded", () => {
        mapa = L.map('mapa').setView([-23.5505, -46.6333], 10); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(mapa);
        
        // RECUPERA A MEMÓRIA
        const rotasGuardadas = localStorage.getItem("planilhaRotas");
        if (rotasGuardadas) {
            dadosGlobaisRotas = JSON.parse(rotasGuardadas);
            document.getElementById("areaUpload").style.display = "none";
            document.getElementById("painelRotas").style.display = "flex";
            renderizarListaTecnicos();
            setTimeout(() => { mapa.invalidateSize(); }, 500);
        } else {
            document.getElementById("painelRotas").style.display = "none";
        }
    });

    function processarExcel(event) {
        const file = event.target.files[0];
        if (!file) return;

        document.getElementById("areaUpload").innerHTML = `<h3>⚙️ A analisar a folha de Excel...</h3>`;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                
                if (jsonData.length === 0) return alert("⚠️ Excel vazio.");

                const dadosNormalizados = jsonData.map(linha => {
                    let novaLinha = {};
                    for (let chave in linha) {
                        let chaveLimpa = chave.trim().toUpperCase(); 
                        novaLinha[chaveLimpa] = linha[chave];
                    }
                    return novaLinha;
                });
                
                agruparPorTecnico(dadosNormalizados);
            } catch (erro) { alert("❌ Erro: " + erro.message); }
        };
        reader.readAsArrayBuffer(file);
    }

    function agruparPorTecnico(linhas) {
        dadosGlobaisRotas = {};

        linhas.forEach(linha => {
            const tecnico = linha["TÉCNICO"] || linha["TECNICO"] || "SEM NOME";
            if (!linha["CÓDIGO"] && !linha["CLIENTE"] && tecnico === "SEM NOME") return;

            // RESOLUÇÃO DO BUG MANHÃ/TARDE (Olha só para a 1ª letra)
            const horarioRaw = String(linha["HORÁRIO"] || linha["HORARIO"] || "").trim().toUpperCase();
            const primeiraLetra = horarioRaw.charAt(0);
            
            if (!dadosGlobaisRotas[tecnico]) {
                dadosGlobaisRotas[tecnico] = { manha: [], tarde: [] };
            }

            // A morada otimizada para o GPS encontrar melhor
            const enderecoFormatado = `${linha["ENDEREÇO"] || linha["ENDERECO"] || ""}, ${linha["CIDADE"] || ""}`;

            const clienteOcorrencia = {
                codigo: linha["CÓDIGO"] || linha["CODIGO"] || "",
                cliente: linha["CLIENTE"] || "Sem Nome",
                servico: linha["SERVIÇO"] || linha["SERVICO"] || "",
                enderecoTexto: enderecoFormatado,
                cep: linha["CEP"] || ""
            };

            // Se começa com M é Manhã, caso contrário é Tarde
            if (primeiraLetra === 'M') {
                dadosGlobaisRotas[tecnico].manha.push(clienteOcorrencia);
            } else {
                dadosGlobaisRotas[tecnico].tarde.push(clienteOcorrencia);
            }
        });

        localStorage.setItem("planilhaRotas", JSON.stringify(dadosGlobaisRotas));
        document.getElementById("areaUpload").style.display = "none";
        document.getElementById("painelRotas").style.display = "flex";
        
        renderizarListaTecnicos();
        setTimeout(() => { mapa.invalidateSize(); }, 500);
    }

    function renderizarListaTecnicos() {
        const divLista = document.getElementById("listaTecnicosUI");
        divLista.innerHTML = "";

        Object.keys(dadosGlobaisRotas).forEach(nome => {
            const t = dadosGlobaisRotas[nome];
            const total = t.manha.length + t.tarde.length;
            
            divLista.innerHTML += `
                <div class="tecnico-item" onclick="selecionarTecnico('${nome}', this)">
                    <div>
                        <div class="tecnico-nome">${nome}</div>
                        <div class="tecnico-stats">Total: ${total} paragens</div>
                    </div>
                    <div>
                        ${t.manha.length > 0 ? `<span class="badge-turno badge-manha">M: ${t.manha.length}</span>` : ''}
                        ${t.tarde.length > 0 ? `<span class="badge-turno badge-tarde">T: ${t.tarde.length}</span>` : ''}
                    </div>
                </div>
            `;
        });

        // Botão para salvar histórico
        divLista.innerHTML += `
            <div style="padding: 15px; margin-top: 10px;">
                <button onclick="salvarHistoricoBanco()" style="width: 100%; padding: 12px; background: #10B981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
                    💾 Salvar Planeamento no Banco
                </button>
            </div>
        `;
    }

    // A MÁGICA DA FASE 2: DESENHAR OS PINOS NO MAPA!
    async function selecionarTecnico(nome, elementoHTML) {
        document.querySelectorAll('.tecnico-item').forEach(el => el.classList.remove('ativo'));
        elementoHTML.classList.add('ativo');

        const dadosTecnico = dadosGlobaisRotas[nome];
        
        // Limpa os pinos anteriores do mapa
        if (layerGrupo) { mapa.removeLayer(layerGrupo); }
        layerGrupo = L.featureGroup().addTo(mapa);

        // Junta todos os clientes (Manhã e Tarde)
        const todosClientes = [...dadosTecnico.manha, ...dadosTecnico.tarde];
        
        // Alerta suave (Não trava a tela)
        const toast = document.createElement("div");
        toast.innerText = `A traçar a rota de ${nome} no mapa... (${todosClientes.length} paragens)`;
        toast.style = "position:absolute; top:20px; right:20px; background:#3B82F6; color:white; padding:10px 20px; border-radius:8px; z-index:1000;";
        document.getElementById("mapaArea").appendChild(toast);

        let pinosEncontrados = 0;

        // Procura a coordenada de cada um
        for(let cliente of todosClientes) {
            try {
                // API Gratuita de GPS (OpenStreetMap)
                const urlGPS = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cliente.enderecoTexto)}`;
                const res = await fetch(urlGPS);
                const localizacao = await res.json();
                
                if(localizacao && localizacao.length > 0) {
                    const lat = localizacao[0].lat;
                    const lon = localizacao[0].lon;
                    
                    // Coloca o pino vermelho e cria um balão com os dados
                    const pino = L.marker([lat, lon]).bindPopup(`
                        <strong style="color: #2563EB;">${cliente.codigo} - ${cliente.cliente}</strong><br>
                        ${cliente.enderecoTexto}<br>
                        <small style="color: #64748B;">Serviço: ${cliente.servico}</small>
                    `);
                    pino.addTo(layerGrupo);
                    pinosEncontrados++;
                }
                
                // Pausa de 1 segundo entre pesquisas para não bloquear a API gratuita
                await new Promise(r => setTimeout(r, 1000));
            } catch(e) { console.error("Falha ao achar:", cliente.enderecoTexto); }
        }
        
        toast.remove();

        // Faz o mapa dar "Zoom" para mostrar todos os pinos de uma vez
        if (pinosEncontrados > 0) {
            mapa.fitBounds(layerGrupo.getBounds(), {padding: [50, 50]});
        } else {
            alert("Aviso: O satélite não conseguiu encontrar essas moradas com precisão. Tente colocar a rua e a cidade mais claras no Excel.");
        }
    }

    function limparRotas() {
        if(confirm("Tem a certeza que deseja limpar as rotas de hoje e carregar um novo Excel?")) {
            localStorage.removeItem("planilhaRotas");
            window.location.reload();
        }
    }

    // Função preparatória para guardar o Histórico
    function salvarHistoricoBanco() {
        alert("O painel já organizou os dados com sucesso!\n\nPara as rotas ficarem salvas para sempre (podendo ser pesquisadas pelo Código e Data), precisamos de criar um novo cofre no 'server.js'. Este será o nosso próximo passo técnico!");
    }
</script>
</body>
</html>
