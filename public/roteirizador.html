<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roteirizador Inteligente - NERI</title>
    
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        .main { flex-grow: 1; height: 100vh; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; }
        .header-painel h1 { margin: 0 0 5px 0; font-size: 24px; color: white; }
        .header-painel p { margin: 0 0 20px 0; color: #94A3B8; font-size: 14px; }
        
        .upload-area { border: 2px dashed rgba(59, 130, 246, 0.5); background: rgba(30, 41, 59, 0.5); padding: 40px; text-align: center; border-radius: 12px; cursor: pointer; transition: 0.3s; margin-bottom: 20px; }
        .upload-area:hover { background: rgba(30, 41, 59, 0.8); border-color: #3B82F6; }
        .upload-area input { display: none; }
        
        #painelRotas { display: none; flex-grow: 1; display: flex; gap: 20px; margin-top: 10px; }
        .painel-esquerdo { width: 350px; display: flex; flex-direction: column; gap: 15px; }
        .caixa-busca { background: #1E293B; padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .caixa-busca h3 { margin: 0 0 10px 0; color: #60A5FA; font-size: 14px; }
        .caixa-busca input { width: 100%; padding: 10px; margin-bottom: 10px; background: #0F172A; color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; box-sizing: border-box; }
        .caixa-busca button { width: 100%; padding: 10px; background: #3B82F6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .lista-tecnicos { background: #1E293B; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; }
        .lista-tecnicos-header { padding: 15px; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
        .lista-tecnicos-header h3 { margin: 0; color: white; font-size: 14px; }
        .lista-clientes { flex-grow: 1; overflow-y: auto; }
        .tecnico-item { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .tecnico-item:hover { background: rgba(59, 130, 246, 0.1); }
        .tecnico-item.ativo { background: rgba(59, 130, 246, 0.2); border-left: 4px solid #3B82F6; }
        .tecnico-nome { font-weight: bold; color: #E2E8F0; font-size: 13px; }
        .tecnico-stats { font-size: 11px; color: #94A3B8; margin-top: 4px; }
        
        #mapaArea { flex-grow: 1; background: #0F172A; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; position: relative; }
        #mapa { width: 100%; height: 100%; }

        /* Painel Itinerário com DRAG AND DROP */
        #painelItinerario { display: none; position: absolute; top: 15px; right: 15px; width: 340px; background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(255,255,255,0.1); z-index: 1000; border-radius: 12px; padding: 15px; max-height: 90%; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
        
        .itinerario-item { background: #0F172A; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 8px; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; transition: transform 0.1s, box-shadow 0.1s; cursor: grab; }
        .itinerario-item:active { cursor: grabbing; border-color: #3B82F6; box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3); transform: scale(1.02); }
        .itinerario-item.drag-over { border-top: 3px solid #10B981; } /* Linha verde que mostra onde vai cair */

        .drag-handle { color: #64748B; padding-right: 10px; font-size: 18px; display: flex; align-items: center; }
        .itinerario-info { flex-grow: 1; margin: 0 5px; cursor: default; }
        
        .btn-mini { background: #F59E0B; color: white; border: none; border-radius: 6px; padding: 6px 8px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-mini:hover { background: #D97706; }
        
        .badge-turno { font-size: 9px; padding: 2px 5px; border-radius: 4px; font-weight: bold; margin-left: 5px; }
        .badge-manha { background: rgba(245, 158, 11, 0.2); color: #F59E0B; border: 1px solid #F59E0B; }
        .badge-tarde { background: rgba(16, 185, 129, 0.2); color: #10B981; border: 1px solid #10B981; }

        .custom-pin { background: transparent; border: none; }
    </style>
    <script>
        function navegarSeguro(rota) { const token = localStorage.getItem("token"); window.location.href = `${rota}?token=${token}`; }
    </script>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="logo-area"><img src="logo.svg" class="logo" alt="Logo NERI" style="max-width: 100%; margin-bottom: 10px;" /></div>
        <div class="menu">
            <button onclick="navegarSeguro('/index.html')">📊 Dashboard Geral</button>
            <button onclick="navegarSeguro('/dados.html')">📂 Lançar Dados</button>
            <button style="background: #2563EB; color: white; border-color: #3B82F6;">🗺️ Roteirizador</button>
            <button onclick="navegarSeguro('/estoque.html')">📦 Almoxarifado</button>
            <hr><button onclick="navegarSeguro('/tecnicos.html')" id="btnAdmin" style="display:none;">⚙️ Administração</button><hr>
            <button onclick="localStorage.clear(); window.location.replace('/login.html')" class="btn-sair">🚪 Sair</button>
        </div>
    </div>

    <div class="main">
        <div class="header-painel">
            <h1>Roteirizador de Frotas</h1>
            <p>Controlo total: Arraste os cards para reorganizar a rota e edite endereços instantaneamente.</p>
        </div>

        <label class="upload-area" id="areaUpload">
            <input type="file" id="arquivoExcel" accept=".xlsx, .xls, .csv" onchange="processarExcel(event)">
            <h3>📥 Clique ou arraste a sua folha de Excel aqui</h3>
            <p>Formatos suportados: .XLSX, .XLS, .CSV</p>
        </label>

        <div id="painelRotas">
            <div class="painel-esquerdo">
                <div class="caixa-busca">
                    <h3>🔍 Consultar Histórico</h3>
                    <input type="date" id="buscaData" title="Pesquisar roteiro por Data">
                    <input type="text" id="buscaCodigo" placeholder="Ou pesquise pelo Código (Ex: 80890)">
                    <button onclick="buscarHistorico()">Buscar Planeamento</button>
                </div>

                <div class="caixa-busca">
                    <h3 style="color: #10B981;">📍 Ponto de Partida Base</h3>
                    <p id="txtGalpaoAtual" style="color: #94A3B8; font-size: 12px; margin: 0 0 10px 0; line-height: 1.4;"></p>
                    <button onclick="alterarGalpao()" style="background: transparent; border: 1px solid #10B981; color: #10B981; padding: 8px; border-radius: 6px; cursor: pointer; width: 100%;">Alterar Endereço</button>
                </div>

                <div class="lista-tecnicos">
                    <div class="lista-tecnicos-header">
                        <h3>Equipa em Rota Hoje</h3>
                        <button onclick="limparRotas()" style="background: transparent; border: 1px solid #EF4444; color: #EF4444; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 10px;">🔄 Novo</button>
                    </div>
                    <div class="lista-clientes" id="listaTecnicosUI"></div>
                </div>
            </div>
            
            <div id="mapaArea">
                <div id="mapa"></div>
                
                <div id="painelItinerario">
                    <h3 style="color: white; margin-top: 0; font-size: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">
                        🛠️ Editor de Sequência
                        <div style="font-size: 10px; color: #10B981; margin-top: 4px; font-weight: normal;">Arraste os cards (☰) para mudar a ordem.</div>
                    </h3>
                    <div id="listaItinerarioUI" style="margin-top: 10px;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
   const token = localStorage.getItem("token");
    if (!token) window.location.replace("/login.html");
    const usuarioTipo = localStorage.getItem("usuarioTipo");
    if (usuarioTipo === "master" || usuarioTipo === "superadmin" || usuarioTipo === "admin") {
        document.getElementById("btnAdmin").style.display = "block";
    }

    let configGalpao = JSON.parse(localStorage.getItem("configGalpao"));
    if (!configGalpao) {
        configGalpao = { lat: -23.5184, lon: -46.7461, nome: "Galpão Principal", endereco: "Rua Antonio Ayrosa 191, Vila dos Remedios" };
        localStorage.setItem("configGalpao", JSON.stringify(configGalpao));
    }

    let mapa = null;
    let layerGrupo = null; 
    let dadosGlobaisRotas = {}; 
    let rotaAtiva = []; 
    let tecnicoAtivo = ""; 

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("txtGalpaoAtual").innerText = `Atual: ${configGalpao.endereco}`;
        mapa = L.map('mapa').setView([configGalpao.lat, configGalpao.lon], 11); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(mapa);
        
        const rotasGuardadas = localStorage.getItem("planilhaRotas");
        if (rotasGuardadas) {
            dadosGlobaisRotas = JSON.parse(rotasGuardadas);
            document.getElementById("areaUpload").style.display = "none";
            document.getElementById("painelRotas").style.display = "flex";
            renderizarListaTecnicos();
            setTimeout(() => { mapa.invalidateSize(); }, 500);
        }
    });

    async function alterarGalpao() {
        const novoEndereco = prompt("Digite o endereço completo do novo ponto de partida:\n(Ex: Avenida Paulista 1000, São Paulo)", configGalpao.endereco);
        if (!novoEndereco || novoEndereco === configGalpao.endereco) return;
        try {
            let resNom = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(novoEndereco + ', Brasil')}&email=suporte@neri.com.br`);
            let locNom = await resNom.json();
            if (locNom && locNom.length > 0) {
                configGalpao = { lat: parseFloat(locNom[0].lat), lon: parseFloat(locNom[0].lon), nome: "Base Operacional", endereco: novoEndereco };
                localStorage.setItem("configGalpao", JSON.stringify(configGalpao));
                alert("✅ Ponto de Partida atualizado!");
                window.location.reload(); 
            } else alert("❌ Não consegui encontrar esse endereço.");
        } catch(e) { alert("Erro de ligação."); }
    }

    // Leitor Flexível de Cabeçalhos (Encontra a coluna mesmo se o nome estiver misturado)
    function buscarValorNaLinha(linha, palavrasChave) {
        for (let chave of Object.keys(linha)) {
            for (let palavra of palavrasChave) {
                if (chave.includes(palavra)) return linha[chave];
            }
        }
        return "";
    }

    function processarExcel(event) {
        const file = event.target.files[0];
        if (!file) return;
        document.getElementById("areaUpload").innerHTML = `<h3>⚙️ A analisar rotas...</h3>`;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "" });
                if (jsonData.length === 0) return alert("⚠️ Excel vazio.");
                const dadosNormalizados = jsonData.map(linha => {
                    let novaLinha = {};
                    for (let chave in linha) { novaLinha[chave.trim().toUpperCase()] = linha[chave]; }
                    return novaLinha;
                });
                agruparPorTecnico(dadosNormalizados);
            } catch (erro) { alert("❌ Erro: " + erro.message); }
        };
        reader.readAsArrayBuffer(file);
    }

    function agruparPorTecnico(linhas) {
        dadosGlobaisRotas = {};
        let ordensPorTecnico = {};

        linhas.forEach(linha => {
            const tecnico = buscarValorNaLinha(linha, ["TÉCNICO", "TECNICO"]);
            const codigo = buscarValorNaLinha(linha, ["CÓDIGO", "CODIGO", "OS"]);
            const cliente = buscarValorNaLinha(linha, ["CLIENTE", "NOME"]);
            
            if (!codigo && !cliente && (!tecnico || tecnico === "")) return;

            const horarioRaw = String(buscarValorNaLinha(linha, ["HORÁRIO", "HORARIO", "PERIODO", "TURNO"])).trim().toUpperCase();
            const periodoOriginal = horarioRaw.charAt(0) === 'M' ? 'MANHA' : 'TARDE';
            
            let cepOriginal = String(buscarValorNaLinha(linha, ["CEP"]));
            let cepLimpo = cepOriginal.replace(/\D/g, '').trim(); 
            let cepFormatado = cepLimpo.padStart(8, '0'); 
            if (cepFormatado.length === 8) cepFormatado = cepFormatado.substring(0, 5) + "-" + cepFormatado.substring(5);

            if (!ordensPorTecnico[tecnico]) ordensPorTecnico[tecnico] = [];
            ordensPorTecnico[tecnico].push({
                codigo: codigo,
                cliente: String(cliente).trim(),
                servico: buscarValorNaLinha(linha, ["SERVIÇO", "SERVICO"]),
                rua: String(buscarValorNaLinha(linha, ["ENDEREÇO", "ENDERECO", "RUA"])).trim(),
                cidade: String(buscarValorNaLinha(linha, ["CIDADE", "MUNICÍPIO"])).trim() || "São Paulo",
                cep: cepFormatado,
                periodo: periodoOriginal 
            });
        });

        Object.keys(ordensPorTecnico).forEach(tecnico => {
            let listaOrdens = ordensPorTecnico[tecnico];
            
            // CONSOLIDAÇÃO DE PARAGENS (Agora imune a endereços vazios)
            listaOrdens.forEach(ordemAtual => {
                if(ordemAtual.rua === "") return;

                let duplicadas = listaOrdens.filter(o => o.rua.toLowerCase() === ordemAtual.rua.toLowerCase() && o.codigo !== ordemAtual.codigo);
                if (duplicadas.length > 0) {
                    let temManha = ordemAtual.periodo === 'MANHA' || duplicadas.some(o => o.periodo === 'MANHA');
                    let temTarde = ordemAtual.periodo === 'TARDE' || duplicadas.some(o => o.periodo === 'TARDE');
                    if (temManha && temTarde) {
                        let mesmoCliente = duplicadas.every(o => o.cliente.toLowerCase() === ordemAtual.cliente.toLowerCase());
                        let novoPeriodo = mesmoCliente ? 'MANHA' : 'TARDE';
                        ordemAtual.periodo = novoPeriodo;
                        duplicadas.forEach(o => o.periodo = novoPeriodo);
                    }
                }
            });

            dadosGlobaisRotas[tecnico] = { manha: [], tarde: [] };
            listaOrdens.forEach(ordem => {
                if (ordem.periodo === 'MANHA') dadosGlobaisRotas[tecnico].manha.push(ordem);
                else dadosGlobaisRotas[tecnico].tarde.push(ordem);
            });
        });

        localStorage.setItem("planilhaRotas", JSON.stringify(dadosGlobaisRotas));
        document.getElementById("areaUpload").style.display = "none";
        document.getElementById("painelRotas").style.display = "flex";
        renderizarListaTecnicos();
        setTimeout(() => { mapa.invalidateSize(); }, 500);
    }

    function renderizarListaTecnicos() {
        const divLista = document.getElementById("listaTecnicosUI");
        divLista.innerHTML = "";
        Object.keys(dadosGlobaisRotas).forEach(nome => {
            const t = dadosGlobaisRotas[nome];
            const total = t.manha.length + t.tarde.length;
            divLista.innerHTML += `
                <div class="tecnico-item" id="tecnico-${nome.replace(/\s+/g, '')}" onclick="iniciarCalculoTecnico('${nome}')">
                    <div><div class="tecnico-nome">${nome}</div><div class="tecnico-stats">Total: ${total} paragens</div></div>
                    <div>
                        ${t.manha.length > 0 ? `<span class="badge-turno badge-manha">M: ${t.manha.length}</span>` : ''}
                        ${t.tarde.length > 0 ? `<span class="badge-turno badge-tarde">T: ${t.tarde.length}</span>` : ''}
                    </div>
                </div>
            `;
        });
        divLista.innerHTML += `
            <div style="padding: 15px; border-top: 1px solid rgba(255,255,255,0.05);">
                <button onclick="salvarHistoricoBanco()" style="width: 100%; padding: 12px; background: #10B981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
                    💾 Salvar Planeamento no Banco
                </button>
            </div>
        `;
    }

    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function otimizarSequencia(pontos, inicioLat, inicioLon) {
        let naoVisitados = [...pontos];
        let rotaOrdenada = [];
        let atualLat = inicioLat;
        let atualLon = inicioLon;
        while (naoVisitados.length > 0) {
            let indiceMaisProximo = 0;
            let menorDistancia = Infinity;
            for (let i = 0; i < naoVisitados.length; i++) {
                let dist = calcularDistancia(atualLat, atualLon, naoVisitados[i].lat, naoVisitados[i].lon);
                if (dist < menorDistancia) { menorDistancia = dist; indiceMaisProximo = i; }
            }
            let proximoPonto = naoVisitados.splice(indiceMaisProximo, 1)[0];
            rotaOrdenada.push(proximoPonto);
            atualLat = proximoPonto.lat;
            atualLon = proximoPonto.lon;
        }
        return rotaOrdenada;
    }

    async function obterCoordenadasSilenciosa(cliente) {
        let lat = null, lon = null;
        let cepBusca = cliente.cep.replace(/\D/g, '');
        if (cepBusca.length === 8) {
            try {
                let resCep = await fetch(`https://cep.awesomeapi.com.br/json/${cepBusca}`);
                if (resCep.ok) { let d = await resCep.json(); if (d.lat) return { lat: parseFloat(d.lat), lon: parseFloat(d.lng) }; }
            } catch(e) {}
        }
        try {
            let resNom = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cliente.rua.split(',')[0].trim() + ', ' + cliente.cidade + ', Brasil')}`);
            if (resNom.ok) { let d = await resNom.json(); if (d && d.length > 0) return { lat: parseFloat(d[0].lat), lon: parseFloat(d[0].lon) }; }
        } catch(e) {}
        return null; 
    }

    async function iniciarCalculoTecnico(nome) {
        document.querySelectorAll('.tecnico-item').forEach(el => el.classList.remove('ativo'));
        document.getElementById(`tecnico-${nome.replace(/\s+/g, '')}`).classList.add('ativo');
        tecnicoAtivo = nome;
        
        const toast = document.createElement("div");
        toast.innerText = `A otimizar Manhã e Tarde de ${nome}...`;
        toast.style = "position:absolute; top:20px; right:20px; background:#10B981; color:white; padding:10px 20px; border-radius:8px; z-index:1000; font-weight:bold;";
        document.getElementById("mapaArea").appendChild(toast);

        const dadosTecnico = dadosGlobaisRotas[nome];
        
        // 1. Processa a Manhã de forma isolada
        let coordsManha = [];
        for (let cliente of dadosTecnico.manha) {
            let coords = await obterCoordenadasSilenciosa(cliente);
            coordsManha.push({ ...cliente, lat: coords ? coords.lat : configGalpao.lat, lon: coords ? coords.lon : configGalpao.lon, precisaCorrecao: !coords });
        }
        
        // 2. Processa a Tarde de forma isolada
        let coordsTarde = [];
        for (let cliente of dadosTecnico.tarde) {
            let coords = await obterCoordenadasSilenciosa(cliente);
            coordsTarde.push({ ...cliente, lat: coords ? coords.lat : configGalpao.lat, lon: coords ? coords.lon : configGalpao.lon, precisaCorrecao: !coords });
        }

        // 3. Roteirização Rigorosa (Sempre Galpão -> Manhã -> Tarde)
        let rotaManha = otimizarSequencia(coordsManha, configGalpao.lat, configGalpao.lon);
        
        let latFimManha = rotaManha.length > 0 ? rotaManha[rotaManha.length-1].lat : configGalpao.lat;
        let lonFimManha = rotaManha.length > 0 ? rotaManha[rotaManha.length-1].lon : configGalpao.lon;
        
        let rotaTarde = otimizarSequencia(coordsTarde, latFimManha, lonFimManha);

        // A união garante que toda a manhã vem antes da tarde
        rotaAtiva = [...rotaManha, ...rotaTarde];
        toast.remove();
        
        document.getElementById("painelItinerario").style.display = "block";
        atualizarTela();
    }

    async function atualizarTela() {
        if (layerGrupo) { mapa.removeLayer(layerGrupo); }
        layerGrupo = L.featureGroup().addTo(mapa);

        const iconeGalpao = L.divIcon({
            className: 'custom-pin',
            html: `<div style="background-color: #000; color: white; border-radius: 8px; padding: 4px; border: 2px solid #10B981; box-shadow: 0 4px 8px rgba(0,0,0,0.5); font-size: 12px; font-weight:bold; white-space: nowrap; transform: translateX(-30%);">🏢 ${configGalpao.nome}</div>`,
            iconSize: [40, 20]
        });
        L.marker([configGalpao.lat, configGalpao.lon], {icon: iconeGalpao}).addTo(layerGrupo);

        let htmlLista = "";
        let coordenadasParaOSRM = [`${configGalpao.lon},${configGalpao.lat}`];

        rotaAtiva.forEach((cliente, index) => {
            const seq = index + 1;
            coordenadasParaOSRM.push(`${cliente.lon},${cliente.lat}`);
            let corPino = cliente.precisaCorrecao ? "#F59E0B" : "#EF4444";
            
            const customIcon = L.divIcon({
                className: 'custom-pin',
                html: `<div style="background-color: ${corPino}; color: white; border-radius: 50%; width: 28px; height: 28px; display: flex; justify-content: center; align-items: center; font-weight: bold; border: 2px solid white; box-shadow: 0 3px 6px rgba(0,0,0,0.5); font-size: 14px;">${seq}</div>`,
                iconSize: [28, 28],
                iconAnchor: [14, 14]
            });
            
            L.marker([cliente.lat, cliente.lon], {icon: customIcon}).bindPopup(`
                <div style="font-family:Arial,sans-serif; font-size:13px; color:#1E293B;">
                    <strong style="color: ${corPino}; font-size:15px;">Paragem #${seq}</strong><br>
                    <strong style="color: #2563EB;">📍 OS: ${cliente.codigo}</strong><br>
                    <strong>Endereço:</strong> ${cliente.rua}<br>
                    ${cliente.precisaCorrecao ? '<strong style="color:red;">⚠️ Satélite não achou! Edite no painel lateral.</strong>' : ''}
                </div>
            `).addTo(layerGrupo);

            let badgeHTML = cliente.periodo === 'MANHA' ? `<span class="badge-turno badge-manha">M</span>` : `<span class="badge-turno badge-tarde">T</span>`;
            
            htmlLista += `
                <div class="itinerario-item" draggable="true" ondragstart="iniciarArraste(event, ${index})" ondragover="permitirSoltar(event)" ondrop="soltarItem(event, ${index})" ondragenter="destacarAlvo(event)" ondragleave="removerDestaque(event)">
                    <div class="drag-handle" title="Segure e arraste para mudar a ordem">☰</div>
                    <strong style="color:#60A5FA; font-size:14px; min-width:20px;">${seq}.</strong>
                    <div class="itinerario-info">
                        <div style="color: white; font-size: 12px; font-weight:bold;">OS: ${cliente.codigo} ${badgeHTML}</div>
                        <div style="color: #94A3B8; font-size: 10px; line-height:1.2; overflow:hidden; text-overflow:ellipsis; max-height:24px;">${cliente.rua}</div>
                    </div>
                    <div class="itinerario-controles">
                        <button class="btn-mini" onclick="editarEndereco(${index})" title="Editar Endereço">✏️ Edite</button>
                    </div>
                </div>
            `;
        });

        document.getElementById("listaItinerarioUI").innerHTML = htmlLista;

        if (coordenadasParaOSRM.length > 1) {
            try {
                let urlRotas = `https://router.project-osrm.org/route/v1/driving/${coordenadasParaOSRM.join(';')}?overview=full&geometries=geojson`;
                let resRota = await fetch(urlRotas);
                let dadosRota = await resRota.json();
                if (dadosRota.routes && dadosRota.routes.length > 0) {
                    L.geoJSON(dadosRota.routes[0].geometry, { style: { color: '#3B82F6', weight: 4, opacity: 0.8 } }).addTo(layerGrupo);
                } else {
                    L.polyline(rotaAtiva.map(c => [c.lat, c.lon]), { color: '#3B82F6', weight: 3, dashArray: '8, 8' }).addTo(layerGrupo);
                }
            } catch(e) {}
        }
        
        mapa.fitBounds(layerGrupo.getBounds(), {padding: [50, 50]});
    }

    let itemArrastadoIndice = null;

    function iniciarArraste(e, index) {
        itemArrastadoIndice = index;
        e.dataTransfer.effectAllowed = 'move';
        e.target.style.opacity = '0.5'; 
    }

    function permitirSoltar(e) { e.preventDefault(); }
    function destacarAlvo(e) { if(e.currentTarget.classList) e.currentTarget.classList.add('drag-over'); }
    function removerDestaque(e) { if(e.currentTarget.classList) e.currentTarget.classList.remove('drag-over'); }

    function soltarItem(e, indexAlvo) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
        document.querySelectorAll('.itinerario-item').forEach(el => el.style.opacity = '1');
        
        if (itemArrastadoIndice === null || itemArrastadoIndice === indexAlvo) return;
        
        let item = rotaAtiva.splice(itemArrastadoIndice, 1)[0];
        rotaAtiva.splice(indexAlvo, 0, item);
        atualizarTela();
    }

    async function editarEndereco(index) {
        let cliente = rotaAtiva[index];
        let novoEnd = prompt(`Edite o endereço da OS ${cliente.codigo}:\nInsira a Rua e Cidade (sem vírgulas soltas).`, `${cliente.rua}, ${cliente.cidade}`);
        if (!novoEnd) return; 

        cliente.rua = novoEnd;
        cliente.precisaCorrecao = false;
        
        const toast = document.createElement("div");
        toast.innerText = `A procurar novo endereço...`;
        toast.style = "position:absolute; top:20px; right:20px; background:#F59E0B; color:white; padding:10px 20px; border-radius:8px; z-index:1000;";
        document.getElementById("mapaArea").appendChild(toast);

        try {
            let resNom = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(novoEnd + ', Brasil')}`);
            let locNom = await resNom.json();
            if (locNom && locNom.length > 0) {
                cliente.lat = parseFloat(locNom[0].lat);
                cliente.lon = parseFloat(locNom[0].lon);
                toast.remove();
                atualizarTela();
            } else {
                cliente.precisaCorrecao = true;
                toast.remove();
                alert("Ainda não encontrei! Tente simplificar o nome da rua ou do bairro.");
                atualizarTela();
            }
        } catch(e) { toast.remove(); alert("Falha na ligação com o satélite."); }
    }

    function limparRotas() {
        if(confirm("Deseja limpar as rotas de hoje e carregar um novo Excel?")) {
            localStorage.removeItem("planilhaRotas");
            window.location.reload();
        }
    }

    // ==========================================
    // LIGAÇÃO COM O BANCO DE DADOS (COM DATA BRASILEIRA)
    // ==========================================

    async function salvarHistoricoBanco() {
        if (!tecnicoAtivo || rotaAtiva.length === 0) {
            return alert("⚠️ Por favor, clique num técnico e gere a rota antes de salvar.");
        }

        const dataAtual = new Date();
        const dia = String(dataAtual.getDate()).padStart(2, '0');
        const mes = String(dataAtual.getMonth() + 1).padStart(2, '0');
        const ano = dataAtual.getFullYear();
        const hojeBR = `${dia}/${mes}/${ano}`;

        let dataRoteiro = prompt(`A guardar o roteiro de: ${tecnicoAtivo}\n\nConfirme a data exata (Apenas formato DD/MM/AAAA):`, hojeBR);
        
        if (!dataRoteiro) return;
        dataRoteiro = dataRoteiro.trim();

        // Alerta visual de que está a trabalhar
        const toast = document.createElement("div");
        toast.innerText = `A comunicar com o Banco de Dados...`;
        toast.style = "position:absolute; top:20px; right:20px; background:#3B82F6; color:white; padding:10px 20px; border-radius:8px; z-index:1000;";
        document.getElementById("mapaArea").appendChild(toast);

        try {
            const res = await fetch('/api/rotas', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}` 
                },
                body: JSON.stringify({
                    data: dataRoteiro,
                    tecnico: tecnicoAtivo,
                    itinerario: rotaAtiva
                })
            });

            toast.remove();

            if (res.ok) {
                alert(`✅ Sucesso! Roteiro de ${tecnicoAtivo} guardado para o dia ${dataRoteiro}.`);
            } else {
                // O DETETIVE DE ERROS: Descobre o motivo exato da falha
                if (res.status === 401 || res.status === 403) {
                    alert("⚠️ A sua sessão expirou por segurança. Faça o Login novamente.");
                    localStorage.clear();
                    window.location.replace('/login.html');
                    return;
                }
                
                // Tenta ler o erro enviado pelo servidor (se não conseguir, assume que o Render caiu)
                const erroServidor = await res.json().catch(() => ({ erro: "O servidor Render ainda está a reiniciar. Aguarde 1 minuto e tente de novo." }));
                alert(`❌ Erro do Servidor:\n${erroServidor.erro}`);
            }
        } catch(e) {
            if(toast) toast.remove();
            alert("❌ Falha na ligação. O servidor pode estar offline.");
        }
    }

    // Variável global para guardar o histórico temporariamente na memória
    window.historicoRotasMemoria = [];

    async function buscarHistorico() {
        let dataInput = document.getElementById("buscaData").value;
        const codigoBusca = document.getElementById("buscaCodigo").value.trim();

        if (!dataInput && !codigoBusca) {
            return alert("⚠️ Preencha a Data ou o Código da OS para pesquisar.");
        }

        let dataFormatadaParaBusca = "";
        
        if (dataInput) {
            const partes = dataInput.split('-');
            dataFormatadaParaBusca = `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        let url = '/api/rotas?';
        if (dataFormatadaParaBusca) url += `data=${encodeURIComponent(dataFormatadaParaBusca)}&`;
        if (codigoBusca) url += `codigo=${encodeURIComponent(codigoBusca)}`;

        try {
            const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
            const rotasEncontradas = await res.json();

            if (rotasEncontradas.length === 0) {
                return alert("❌ Nenhum roteiro encontrado.");
            }

            // CENÁRIO 1: Pesquisou por OS (Achou apenas 1 roteiro)
            if (rotasEncontradas.length === 1 && codigoBusca) {
                const roteiro = rotasEncontradas[0];
                tecnicoAtivo = roteiro.tecnico;
                rotaAtiva = roteiro.itinerario;

                alert(`✅ Histórico Localizado!\nTécnico: ${tecnicoAtivo}\nData: ${roteiro.data}`);
                document.getElementById("painelItinerario").style.display = "block";
                atualizarTela();
            } 
            // CENÁRIO 2: Pesquisou por Data (Achou vários técnicos)
            else {
                alert(`✅ Foram encontrados ${rotasEncontradas.length} roteiros para a data ${rotasEncontradas[0].data}.\n\nEscolha o técnico no painel lateral esquerdo para visualizar o mapa!`);
                
                window.historicoRotasMemoria = rotasEncontradas;
                
                // Limpa o mapa atual
                if (layerGrupo) { mapa.removeLayer(layerGrupo); }
                document.getElementById("painelItinerario").style.display = "none";
                
                // Reconstrói o menu da esquerda com a "Equipa do Passado"
                const divLista = document.getElementById("listaTecnicosUI");
                divLista.innerHTML = `<h4 style="color:#10B981; margin: 0 0 10px 15px; font-size:12px;">📅 Histórico de ${rotasEncontradas[0].data}</h4>`;
                
                rotasEncontradas.forEach((roteiro, idx) => {
                    let countM = 0; let countT = 0;
                    roteiro.itinerario.forEach(c => { if(c.periodo === 'MANHA') countM++; else countT++; });

                    divLista.innerHTML += `
                        <div class="tecnico-item" id="hist-tecnico-${idx}" onclick="carregarRotaHistorica(${idx})">
                            <div><div class="tecnico-nome">${roteiro.tecnico}</div><div class="tecnico-stats">Total: ${roteiro.itinerario.length} paragens</div></div>
                            <div>
                                ${countM > 0 ? `<span class="badge-turno badge-manha">M: ${countM}</span>` : ''}
                                ${countT > 0 ? `<span class="badge-turno badge-tarde">T: ${countT}</span>` : ''}
                            </div>
                        </div>
                    `;
                });
            }

        } catch(e) {
            alert("❌ Erro ao buscar dados no servidor.");
        }
    }

    // Função Nova: Carrega o mapa quando clicar no nome do técnico histórico
    function carregarRotaHistorica(idx) {
        document.querySelectorAll('.tecnico-item').forEach(el => el.classList.remove('ativo'));
        document.getElementById(`hist-tecnico-${idx}`).classList.add('ativo');
        
        const roteiro = window.historicoRotasMemoria[idx];
        tecnicoAtivo = roteiro.tecnico;
        rotaAtiva = roteiro.itinerario;
        
        document.getElementById("painelItinerario").style.display = "block";
        atualizarTela();
    }
</script>
