<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roteirizador Inteligente - NERI</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .main { flex-grow: 1; height: 100vh; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; }
        .header-painel { display: flex; align-items: flex-start; }
        .header-painel h1 { margin: 0 0 5px 0; font-size: 24px; color: white; }
        .upload-area { border: 2px dashed rgba(59, 130, 246, 0.5); background: rgba(30, 41, 59, 0.5); padding: 40px; text-align: center; border-radius: 12px; cursor: pointer; margin-bottom: 20px; }
        .upload-area input { display: none; }
        #painelRotas { display: none; flex-grow: 1; display: flex; gap: 20px; margin-top: 10px; }
        .painel-esquerdo { width: 350px; display: flex; flex-direction: column; gap: 15px; }
        .caixa-busca { background: #1E293B; padding: 15px; border-radius: 12px; }
        .caixa-busca input, .caixa-busca select { width: 100%; padding: 10px; margin-bottom: 10px; background: #0F172A; color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; box-sizing: border-box; }
        .caixa-busca button { width: 100%; padding: 10px; background: #3B82F6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .lista-tecnicos { background: #1E293B; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .lista-tecnicos-header { padding: 15px; background: rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center; }
        .lista-clientes { flex-grow: 1; overflow-y: auto; }
        .tecnico-item { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .tecnico-item:hover { background: rgba(59, 130, 246, 0.1); }
        .tecnico-item.ativo { background: rgba(59, 130, 246, 0.2); border-left: 4px solid #3B82F6; }
        #mapaArea { flex-grow: 1; background: #0F172A; border-radius: 12px; position: relative; }
        #mapa { width: 100%; height: 100%; }
        #painelItinerario { display: none; position: absolute; top: 15px; right: 15px; width: 340px; background: rgba(30, 41, 59, 0.95); z-index: 1000; border-radius: 12px; padding: 15px; max-height: 80%; overflow-y: auto; }
        .itinerario-item { background: #0F172A; border-left: 4px solid #64748B; margin-bottom: 8px; padding: 12px; border-radius: 8px; }
    </style>
</head>
<body>
<div class="container" style="display: flex;">
    <div class="main" style="width: 100%;">
        <div class="header-painel">
            <div>
                <h1>Torre de Controle Logístico - Gemini + Google Maps</h1>
                <p>Geocodificação de precisão máxima.</p>
            </div>
        </div>

        <label class="upload-area" id="areaUpload">
            <input type="file" id="arquivoExcel" accept=".xlsx, .xls, .csv" onchange="processarExcel(event)">
            <h3>📥 Clique ou arraste sua planilha aqui</h3>
        </label>

        <div id="loadingUpload" style="display: none; background: rgba(30, 41, 59, 0.8); padding: 40px; text-align: center; border-radius: 12px; margin-bottom: 20px;">
            <h3 style="color: #10B981;">🤖 Processando endereços com IA e Google Maps...</h3>
            <p id="lblProgresso" style="color: #94A3B8;">Aguarde...</p>
            <div style="width: 100%; background: #0F172A; height: 12px; border-radius: 6px; margin-top: 15px; overflow: hidden;">
                <div id="barraProgresso" style="width: 0%; background: #10B981; height: 100%; transition: width 0.3s;"></div>
            </div>
        </div>

        <div id="painelRotas">
            <div class="painel-esquerdo">
                <div class="caixa-busca">
                    <h3>🔍 Pesquisar Roteiro</h3>
                    <input type="date" id="buscaData">
                    <button onclick="window.buscarHistorico()">Buscar Planejamento</button>
                </div>
                <div class="lista-tecnicos" style="flex-grow: 1;">
                    <div class="lista-tecnicos-header"><h3>Equipe</h3></div>
                    <div class="lista-clientes" id="listaTecnicosUI"></div>
                </div>
            </div>
            <div id="mapaArea">
                <div id="mapa"></div>
                <div id="painelItinerario">
                    <h3 style="color: white; margin-top: 0;">🛠️ Itinerário</h3>
                    <div id="listaItinerarioUI"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem("token");
    if (!token) window.location.replace("/login.html");
    let mapa = null, layerGrupo = null, dadosGlobaisRotas = {}, rotaAtiva = [], tecnicoAtivo = "";

    document.addEventListener("DOMContentLoaded", async () => {
        mapa = L.map('mapa').setView([-23.5155, -46.7450], 11); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(mapa);
    });

    function buscarValorNaLinha(linha, palavrasChave) {
        for (let chave of Object.keys(linha)) { for (let palavra of palavrasChave) { if (chave.includes(palavra)) return linha[chave]; } }
        return "";
    }

    function extrairNumeroLimpo(rua, detalhes) {
        let regexNum = /(?:nº|n|número|km)?\s*(\d+)/i;
        let matchRua = String(rua).match(regexNum);
        if (matchRua) return matchRua[1];
        let matchDet = String(detalhes).match(regexNum);
        if (matchDet) return matchDet[1];
        return "";
    }

    async function melhorarEnderecosComGemini(ordens) {
        try {
            const payload = ordens.map((o, i) => ({
                id: i,
                rua: o.rua || "",
                numero: extrairNumeroLimpo(o.rua || "", o.detalhes || ""),
                bairro: o.bairro || "",
                cidade: o.cidade || "",
                cep: o.cep || ""
            }));

            const resposta = await fetch("/api/rotas/processar-ia", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ enderecosBrutos: payload })
            });

            if (!resposta.ok) return ordens;
            const dados = await resposta.json();
            const tratados = dados.resultados || [];

            return ordens.map((o, i) => {
                const g = tratados[i];
                if (!g) return o;
                o.rua = g.rua || o.rua;
                o.bairro = g.bairro || o.bairro;
                o.cidade = g.cidade || o.cidade;
                o.cep = g.cep || o.cep;
                return o;
            });
        } catch(e) { return ordens; }
    }

    async function buscarGoogleMapsPreciso(enderecoCompleto, cliente) {
        try {
            const resposta = await fetch("/api/geocodificar-endereco", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({
                    endereco: enderecoCompleto,
                    dadosOriginais: { rua: cliente.rua || "", bairro: cliente.bairro || "", cidade: cliente.cidade || "", cep: cliente.cep || "" }
                })
            });
            if (!resposta.ok) return null;
            const dados = await resposta.json();
            if (!dados.encontrado) return null;
            return { lat: Number(dados.lat), lon: Number(dados.lon), precisaCorrecao: false };
        } catch(e) { return null; }
    }

    async function obterCoordenadasSilenciosa(cliente) {
        let ruaOriginal = cliente.rua || "";
        let cidade = cliente.cidade || "São Paulo";
        let bairro = cliente.bairro || "";
        let cepStr = String(cliente.cep || "");

        let enderecoCompleto = `${ruaOriginal}, ${bairro}, ${cidade}, CEP ${cepStr}`;
        let googleRes = await buscarGoogleMapsPreciso(enderecoCompleto, cliente);
        if (googleRes) return googleRes;

        return null;
    }

    function processarExcel(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "" });
                const dadosNormalizados = jsonData.map(linha => { let novaLinha = {}; for (let chave in linha) { novaLinha[chave.trim().toUpperCase()] = linha[chave]; } return novaLinha; });
                agruparEGeocodificar(dadosNormalizados);
            } catch (erro) { alert("Erro ao ler Excel: " + erro.message); }
        };
        reader.readAsArrayBuffer(file);
    }

    async function agruparEGeocodificar(linhas) {
        document.getElementById("areaUpload").style.display = "none";
        document.getElementById("loadingUpload").style.display = "block";

        let ordensPorTecnico = {};
        let totalOS = 0;

        linhas.forEach(linha => {
            const tecnico = buscarValorNaLinha(linha, ["TÉCNICO", "TECNICO"]);
            const codigo = buscarValorNaLinha(linha, ["CÓDIGO", "CODIGO", "OS"]);
            const cliente = buscarValorNaLinha(linha, ["CLIENTE", "NOME"]);
            if (!codigo && !cliente) return;

            let rua = String(buscarValorNaLinha(linha, ["ENDEREÇO", "ENDERECO", "RUA"])).trim();
            let cidade = String(buscarValorNaLinha(linha, ["CIDADE", "MUNICÍPIO"])).trim() || "São Paulo";
            let cep = String(buscarValorNaLinha(linha, ["CEP"])).trim();
            let periodo = String(buscarValorNaLinha(linha, ["HORÁRIO", "PERIODO", "TURNO"])).toUpperCase().includes("M") ? "MANHA" : "TARDE";

            if (!ordensPorTecnico[tecnico]) ordensPorTecnico[tecnico] = [];
            ordensPorTecnico[tecnico].push({ codigo: String(codigo), cliente: String(cliente), rua, cidade, cep, periodo, status: 'pendente' });
            totalOS++;
        });

        let todasOrdensIA = Object.values(ordensPorTecnico).flat();
        todasOrdensIA = await melhorarEnderecosComGemini(todasOrdensIA);

        let posIA = 0;
        Object.keys(ordensPorTecnico).forEach(t => {
            ordensPorTecnico[t] = ordensPorTecnico[t].map(() => todasOrdensIA[posIA++]);
        });

        dadosGlobaisRotas = {};
        let concluidos = 0;
        let barra = document.getElementById("barraProgresso");
        let lbl = document.getElementById("lblProgresso");

        for (let tecnico of Object.keys(ordensPorTecnico)) {
            dadosGlobaisRotas[tecnico] = { manha: [], tarde: [] };
            for (let ordem of ordensPorTecnico[tecnico]) {
                concluidos++;
                barra.style.width = Math.round((concluidos / totalOS) * 100) + "%";
                lbl.innerText = `${concluidos} de ${totalOS} geocodificados via Google Maps...`;

                let crds = await obterCoordenadasSilenciosa(ordem);
                if (crds) {
                    ordem.lat = crds.lat;
                    ordem.lon = crds.lon;
                    ordem.precisaCorrecao = false;
                } else {
                    ordem.lat = -23.5155;
                    ordem.lon = -46.7450;
                    ordem.precisaCorrecao = true;
                }

                if (ordem.periodo === 'MANHA') dadosGlobaisRotas[tecnico].manha.push(ordem);
                else dadosGlobaisRotas[tecnico].tarde.push(ordem);

                await new Promise(r => setTimeout(r, 200));
            }
        }

        document.getElementById("loadingUpload").style.display = "none";
        document.getElementById("painelRotas").style.display = "flex";
        renderizarListaTecnicos();
        setTimeout(() => mapa.invalidateSize(), 500);
    }

    function renderizarListaTecnicos() {
        const divLista = document.getElementById("listaTecnicosUI");
        divLista.innerHTML = "";
        Object.keys(dadosGlobaisRotas).forEach(nome => {
            divLista.innerHTML += `<div class="tecnico-item" onclick="iniciarCalculoTecnico('${nome}')"><span>${nome}</span></div>`;
        });
    }

    function iniciarCalculoTecnico(nome) {
        tecnicoAtivo = nome;
        const dados = dadosGlobaisRotas[nome];
        rotaAtiva = [...dados.manha, ...dados.tarde];
        document.getElementById("painelItinerario").style.display = "block";
        atualizarTela();
    }

    function atualizarTela() {
        if (layerGrupo) mapa.removeLayer(layerGrupo);
        layerGrupo = L.featureGroup().addTo(mapa);
        let htmlLista = "";

        rotaAtiva.forEach((c, idx) => {
            if (!c || isNaN(c.lat)) return;
            L.marker([c.lat, c.lon]).addTo(layerGrupo).bindPopup(`OS: ${c.codigo}<br>${c.rua}`);
            htmlLista += `<div class="itinerario-item"><b>${idx+1}. OS: ${c.codigo}</b><br>${c.rua}</div>`;
        });

        document.getElementById("listaItinerarioUI").innerHTML = htmlLista;
        mapa.fitBounds(layerGrupo.getBounds(), { padding: [30, 30] });
    }

    window.buscarHistorico = async function() {
        let dataDia = document.getElementById("buscaData").value;
        if (!dataDia) return alert("Selecione uma data.");
        const p = dataDia.split('-'); 
        let dFormatada = `${p[2]}/${p[1]}/${p[0]}`; 

        try {
            const res = await fetch(`/api/rotas?data=${encodeURIComponent(dFormatada)}`, { headers: { 'Authorization': `Bearer ${token}` } });
            const rotas = await res.json();
            if (!rotas.length) return alert("Nenhum roteiro encontrado.");
            historicoRotasMemoria = rotas;
            visualizandoHistorico = true;
            alert("Roteiro carregado com sucesso!");
        } catch(e) { alert("Erro ao buscar histórico."); }
    }
</script>
</body>
</html>
