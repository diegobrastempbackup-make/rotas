<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roteirizador Inteligente - NERI</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .main { flex-grow: 1; height: 100vh; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; }
        .header-painel { display: flex; align-items: flex-start; }
        .header-painel h1 { margin: 0 0 5px 0; font-size: 24px; color: white; }
        .header-painel p { margin: 0 0 20px 0; color: #94A3B8; font-size: 14px; }
        .upload-area { border: 2px dashed rgba(59, 130, 246, 0.5); background: rgba(30, 41, 59, 0.5); padding: 40px; text-align: center; border-radius: 12px; cursor: pointer; margin-bottom: 20px; }
        .upload-area input { display: none; }
        #painelRotas { display: none; flex-grow: 1; display: flex; gap: 20px; margin-top: 10px; }
        .painel-esquerdo { width: 350px; display: flex; flex-direction: column; gap: 15px; }
        .caixa-busca { background: #1E293B; padding: 15px; border-radius: 12px; }
        .caixa-busca input, .caixa-busca select { width: 100%; padding: 10px; margin-bottom: 10px; background: #0F172A; color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; box-sizing: border-box; }
        .caixa-busca button { width: 100%; padding: 10px; background: #3B82F6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-relatorio { background: #10B981 !important; margin-top: 10px; }
        .btn-global { background: #8B5CF6 !important; margin-top: 10px; }
        .lista-tecnicos { background: #1E293B; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .lista-tecnicos-header { padding: 15px; background: rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center; }
        .lista-clientes { flex-grow: 1; overflow-y: auto; }
        .tecnico-item { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .tecnico-item:hover { background: rgba(59, 130, 246, 0.1); }
        .tecnico-item.ativo { background: rgba(59, 130, 246, 0.2); border-left: 4px solid #3B82F6; }
        .tecnico-nome { font-weight: bold; color: #E2E8F0; font-size: 13px; }
        .tecnico-stats { font-size: 11px; color: #94A3B8; }
        #mapaArea { flex-grow: 1; background: #0F172A; border-radius: 12px; position: relative; }
        #mapa { width: 100%; height: 100%; }
        #painelItinerario { display: none; position: absolute; top: 15px; right: 15px; width: 340px; background: rgba(30, 41, 59, 0.95); z-index: 1000; border-radius: 12px; padding: 15px; max-height: 80%; overflow-y: auto; }
        .itinerario-item { background: #0F172A; border-left: 4px solid #64748B; margin-bottom: 8px; padding: 12px; border-radius: 8px; }
        .legenda-radar { display: flex; gap: 8px; font-size: 10px; color: #94A3B8; margin-top: 10px; flex-wrap: wrap; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 3px; }
    </style>
</head>
<body>
<div class="container" style="display: flex;">
    <div class="main" style="width: 100%;">
        <div class="header-painel">
            <div>
                <h1>Torre de Controle Logístico</h1>
                <p>Gemini AI + Google Maps Geocoding</p>
            </div>
        </div>

        <label class="upload-area" id="areaUpload">
            <input type="file" id="arquivoExcel" accept=".xlsx, .xls, .csv" onchange="processarExcel(event)">
            <h3>📥 Clique ou arraste sua planilha de Excel aqui</h3>
        </label>

        <div id="loadingUpload" style="display: none; background: rgba(30, 41, 59, 0.8); padding: 40px; text-align: center; border-radius: 12px; margin-bottom: 20px;">
            <h3 style="color: #10B981;">🤖 Gemini AI + Google Maps trabalhando...</h3>
            <p id="lblProgresso" style="color: #94A3B8;">A processar planilha...</p>
            <div style="width: 100%; background: #0F172A; height: 12px; border-radius: 6px; margin-top: 15px; overflow: hidden;">
                <div id="barraProgresso" style="width: 0%; background: #10B981; height: 100%; transition: width 0.3s;"></div>
            </div>
        </div>

        <div id="painelRotas">
            <div class="painel-esquerdo">
                <div class="caixa-busca">
                    <h3>🔍 Radar e Relatórios</h3>
                    <input type="date" id="buscaData">
                    <button onclick="window.buscarHistorico()">1. Buscar Planejamento</button>
                    <button onclick="window.ativarVisaoGlobal()" class="btn-global">🌍 2. Ver Toda a Frota</button>
                </div>
                <div class="lista-tecnicos" style="flex-grow: 1;">
                    <div class="lista-tecnicos-header">
                        <h3>Equipe em Operação</h3>
                        <button onclick="window.limparRotas()" style="background:none; border:none; color:#EF4444; cursor:pointer;">🔄 Limpar</button>
                    </div>
                    <div class="lista-clientes" id="listaTecnicosUI"></div>
                </div>
            </div>
            <div id="mapaArea">
                <div id="mapa"></div>
                <div id="painelItinerario">
                    <h3 style="color: white; margin-top: 0; display:flex; justify-content:space-between;">
                        <span id="tituloPainelLateral">🛠️ Itinerário</span>
                    </h3>
                    <div class="legenda-radar">
                        <div><span class="dot" style="background:#64748B;"></span>Pendente</div>
                        <div><span class="dot" style="background:#10B981;"></span>Sucesso</div>
                        <div><span class="dot" style="background:#EF4444;"></span>Insucesso</div>
                    </div>
                    <div id="listaItinerarioUI" style="margin-top: 15px;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem("token");
    if (!token) window.location.replace("/login.html");

    let configGalpao = { lat: -23.5155, lon: -46.7450, nome: "Base Operacional" };
    let mapa = null, layerGrupo = null, dadosGlobaisRotas = {}, rotaAtiva = [], tecnicoAtivo = "";
    let historicoRotasMemoria = [], visualizandoHistorico = false, modoVisaoGlobal = false;

    document.addEventListener("DOMContentLoaded", async () => {
        mapa = L.map('mapa').setView([configGalpao.lat, configGalpao.lon], 11); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(mapa);
        
        const rotasGuardadas = localStorage.getItem("planilhaRotas");
        if (rotasGuardadas) {
            dadosGlobaisRotas = JSON.parse(rotasGuardadas);
            document.getElementById("areaUpload").style.display = "none";
            document.getElementById("painelRotas").style.display = "flex";
            window.renderizarListaTecnicosModoNovo();
            setTimeout(() => mapa.invalidateSize(), 500);
        }
    });

    function calcularDistancia(lat1, lon1, lat2, lon2) {
        if (isNaN(lat1) || isNaN(lon1) || isNaN(lat2) || isNaN(lon2)) return 0;
        const R = 6371; 
        const dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function buscarValorNaLinha(linha, palavrasChave) {
        for (let chave of Object.keys(linha)) { for (let palavra of palavrasChave) { if (chave.includes(palavra)) return linha[chave]; } }
        return "";
    }

    async function melhorarEnderecosComGemini(ordens) {
        try {
            const payload = ordens.map((o, i) => ({ id: i, rua: o.rua || "", cidade: o.cidade || "", cep: o.cep || "" }));
            const resposta = await fetch("/api/rotas/processar-ia", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ enderecosBrutos: payload })
            });
            if (!resposta.ok) return ordens;
            const dados = await resposta.json();
            const tratados = dados.resultados || [];
            return ordens.map((o, i) => {
                const g = tratados[i];
                if (!g) return o;
                o.rua = g.rua || o.rua; o.cidade = g.cidade || o.cidade; o.cep = g.cep || o.cep;
                return o;
            });
        } catch(e) { return ordens; }
    }

    async function obterCoordenadasSilenciosa(cliente) {
        try {
            const resposta = await fetch("/api/geocodificar-endereco", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ endereco: `${cliente.rua || ''}, ${cliente.cidade || 'São Paulo'}` })
            });
            if (!resposta.ok) return null;
            const dados = await resposta.json();
            if (!dados.encontrado) return null;
            return { lat: Number(dados.lat), lon: Number(dados.lon), precisaCorrecao: false };
        } catch(e) { return null; }
    }

    function processarExcel(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "" });
                const dadosNormalizados = jsonData.map(linha => { let novaLinha = {}; for (let chave in linha) { novaLinha[chave.trim().toUpperCase()] = linha[chave]; } return novaLinha; });
                agruparEGeocodificar(dadosNormalizados);
            } catch (erro) { alert("Erro ao ler Excel: " + erro.message); }
        };
        reader.readAsArrayBuffer(file);
    }

    async function agruparEGeocodificar(linhas) {
        document.getElementById("areaUpload").style.display = "none";
        document.getElementById("loadingUpload").style.display = "block";

        let ordensPorTecnico = {};
        let totalOS = 0;

        linhas.forEach(linha => {
            const tecnico = buscarValorNaLinha(linha, ["TÉCNICO", "TECNICO"]) || "Geral";
            const codigo = buscarValorNaLinha(linha, ["CÓDIGO", "CODIGO", "OS"]);
            const cliente = buscarValorNaLinha(linha, ["CLIENTE", "NOME"]) || "Cliente";
            if (!codigo) return;

            let rua = String(buscarValorNaLinha(linha, ["ENDEREÇO", "ENDERECO", "RUA"])).trim();
            let cidade = String(buscarValorNaLinha(linha, ["CIDADE", "MUNICÍPIO"])).trim() || "São Paulo";
            let cep = String(buscarValorNaLinha(linha, ["CEP"])).trim();
            let periodo = String(buscarValorNaLinha(linha, ["HORÁRIO", "PERIODO", "TURNO"])).toUpperCase().includes("M") ? "MANHA" : "TARDE";

            if (!ordensPorTecnico[tecnico]) ordensPorTecnico[tecnico] = [];
            ordensPorTecnico[tecnico].push({ codigo: String(codigo), cliente: String(cliente), rua, cidade, cep, periodo, status: 'pendente' });
            totalOS++;
        });

        let todasOrdensIA = Object.values(ordensPorTecnico).flat();
        todasOrdensIA = await melhorarEnderecosComGemini(todasOrdensIA);

        let posIA = 0;
        Object.keys(ordensPorTecnico).forEach(t => {
            ordensPorTecnico[t] = ordensPorTecnico[t].map(() => todasOrdensIA[posIA++]);
        });

        dadosGlobaisRotas = {};
        let concluidos = 0;
        let barra = document.getElementById("barraProgresso");
        let lbl = document.getElementById("lblProgresso");

        for (let tecnico of Object.keys(ordensPorTecnico)) {
            dadosGlobaisRotas[tecnico] = { manha: [], tarde: [] };
            for (let ordem of ordensPorTecnico[tecnico]) {
                concluidos++;
                barra.style.width = Math.round((concluidos / totalOS) * 100) + "%";
                lbl.innerText = `${concluidos} de ${totalOS} geocodificados...`;

                let crds = await obterCoordenadasSilenciosa(ordem);
                if (crds) {
                    ordem.lat = crds.lat; ordem.lon = crds.lon; ordem.precisaCorrecao = false;
                } else {
                    ordem.lat = configGalpao.lat + (Math.random()-0.5)*0.01;
                    ordem.lon = configGalpao.lon + (Math.random()-0.5)*0.01;
                    ordem.precisaCorrecao = true;
                }

                if (ordem.periodo === 'MANHA') dadosGlobaisRotas[tecnico].manha.push(ordem);
                else dadosGlobaisRotas[tecnico].tarde.push(ordem);

                await new Promise(r => setTimeout(r, 100));
            }
        }

        localStorage.setItem("planilhaRotas", JSON.stringify(dadosGlobaisRotas));
        document.getElementById("loadingUpload").style.display = "none";
        document.getElementById("painelRotas").style.display = "flex";
        window.renderizarListaTecnicosModoNovo();
        setTimeout(() => mapa.invalidateSize(), 500);
    }

    window.renderizarListaTecnicosModoNovo = function() {
        visualizandoHistorico = false;
        const divLista = document.getElementById("listaTecnicosUI");
        divLista.innerHTML = "";
        Object.keys(dadosGlobaisRotas).forEach(nome => {
            const t = dadosGlobaisRotas[nome]; const total = t.manha.length + t.tarde.length;
            divLista.innerHTML += `
                <div class="tecnico-item" id="tecnico-${nome.replace(/\s+/g, '')}" onclick="window.iniciarCalculoTecnico('${nome}')">
                    <div style="width: 100%;">
                        <div class="tecnico-nome"><span>${nome}</span></div>
                        <div class="tecnico-stats">Total: ${total} paradas</div>
                    </div>
                </div>
            `;
        });
        divLista.innerHTML += `<div style="padding: 15px; border-top: 1px solid rgba(255,255,255,0.05);"><button onclick="window.salvarHistoricoBanco()" style="width: 100%; padding: 12px; background: #10B981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">💾 Salvar no Banco</button></div>`;
    }

    function otimizarSequencia(pontos, inicioLat, inicioLon) {
        let naoVisitados = [...pontos].filter(p => p && !isNaN(parseFloat(p.lat))); 
        let rotaOrdenada = [], atualLat = inicioLat, atualLon = inicioLon;
        while (naoVisitados.length > 0) {
            let idx = 0, menorDist = Infinity;
            for (let i = 0; i < naoVisitados.length; i++) {
                let dist = calcularDistancia(atualLat, atualLon, parseFloat(naoVisitados[i].lat), parseFloat(naoVisitados[i].lon));
                if (dist < menorDist) { menorDist = dist; idx = i; }
            }
            let px = naoVisitados.splice(idx, 1)[0]; rotaOrdenada.push(px); atualLat = parseFloat(px.lat); atualLon = parseFloat(px.lon);
        }
        return rotaOrdenada;
    }

    window.iniciarCalculoTecnico = function(nome) {
        document.querySelectorAll('.tecnico-item').forEach(el => el.classList.remove('ativo'));
        document.getElementById(`tecnico-${nome.replace(/\s+/g, '')}`).classList.add('ativo');
        tecnicoAtivo = nome;
        modoVisaoGlobal = false;
        
        const dados = visualizandoHistorico ? historicoRotasMemoria.find(r => r.tecnico === nome) : dadosGlobaisRotas[nome];
        if (visualizandoHistorico) {
            rotaAtiva = [...(dados.itinerario || [])];
        } else {
            let rotaManha = otimizarSequencia(dados.manha || [], configGalpao.lat, configGalpao.lon);
            let rotaTarde = otimizarSequencia(dados.tarde || [], rotaManha.length ? rotaManha[rotaManha.length-1].lat : configGalpao.lat, rotaManha.length ? rotaManha[rotaManha.length-1].lon : configGalpao.lon);
            rotaAtiva = [...rotaManha, ...rotaTarde];
        }

        document.getElementById("painelItinerario").style.display = "block";
        window.atualizarTela(true);
    }

    window.atualizarTela = function(recentrarMapa = true) {
        if (layerGrupo) mapa.removeLayer(layerGrupo);
        layerGrupo = L.featureGroup().addTo(mapa);
        
        // Exibe a base operacional correta
        L.marker([configGalpao.lat, configGalpao.lon], {
            icon: L.divIcon({ className: 'custom-pin', html: `<div style="background: #000; color: white; border-radius: 8px; padding: 6px 10px; border: 2px solid #3B82F6; font-size: 12px; font-weight:bold;">🏢 Base</div>`, iconSize: [80, 30] })
        }).addTo(layerGrupo);

        let htmlLista = "";

        rotaAtiva.forEach((cliente, index) => {
            if (!cliente) return;
            const seq = index + 1;
            let lat = parseFloat(cliente.lat) || configGalpao.lat, lon = parseFloat(cliente.lon) || configGalpao.lon;
            
            // CORREÇÃO DAS CORES DOS PINOS E DA LISTA
            let corPino = "#64748B"; // Pendente
            if (cliente.status === 'sucesso') corPino = "#10B981";       // Verde
            else if (cliente.status === 'insucesso') corPino = "#EF4444"; // Vermelho
            else if (cliente.precisaCorrecao) corPino = "#E11D48";      // Alerta

            L.marker([lat, lon], {
                icon: L.divIcon({ className: 'custom-pin', html: `<div style="background-color: ${corPino}; color: white; border-radius: 50%; width: 26px; height: 26px; display: flex; justify-content: center; align-items: center; font-weight: bold; border: 2px solid white; font-size: 13px;">${seq}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] })
            }).bindPopup(`<b>Parada #${seq}</b><br>OS: ${cliente.codigo}<br>Status: ${(cliente.status || 'pendente').toUpperCase()}<br>${cliente.rua}`).addTo(layerGrupo);

            htmlLista += `
                <div class="itinerario-item" style="border-left-color: ${corPino};">
                    <div class="card-topo">
                        <strong style="color:#60A5FA; font-size:14px; min-width:20px;">${seq}.</strong>
                        <div class="itinerario-info">
                            <div style="color: white; font-size: 12px; font-weight:bold;">OS: ${cliente.codigo} (${(cliente.status || 'pendente').toUpperCase()})</div>
                            <div style="color: #94A3B8; font-size: 10px;">${cliente.rua || 'Sem endereço'}</div>
                        </div>
                    </div>
                </div>
            `;
        });

        document.getElementById("listaItinerarioUI").innerHTML = htmlLista;
        if (recentrarMapa && rotaAtiva.length > 0) mapa.fitBounds(layerGrupo.getBounds(), { padding: [30, 30] });
    }

    window.buscarHistorico = async function() {
        let dataDia = document.getElementById("buscaData").value;
        if (!dataDia) return alert("Selecione uma data.");
        const p = dataDia.split('-'); 
        let dFormatada = `${p[2]}/${p[1]}/${p[0]}`; 

        try {
            const res = await fetch(`/api/rotas?data=${encodeURIComponent(dFormatada)}`, { headers: { 'Authorization': `Bearer ${token}` } });
            const rotas = await res.json();
            if (!rotas.length) return alert("Nenhum roteiro encontrado para esta data.");
            historicoRotasMemoria = rotas;
            visualizandoHistorico = true;
            
            const divLista = document.getElementById("listaTecnicosUI");
            divLista.innerHTML = `<h4 style="color:#10B981; margin: 0 0 10px 15px; font-size:12px;">📅 Histórico</h4>`;
            rotas.forEach((roteiro, idx) => {
                divLista.innerHTML += `<div class="tecnico-item" onclick="window.iniciarCalculoTecnico('${roteiro.tecnico}')"><span>${roteiro.tecnico} (${roteiro.data})</span></div>`;
            });
            alert("Roteiro carregado com sucesso!");
        } catch(e) { alert("Erro ao buscar histórico."); }
    }

    window.ativarVisaoGlobal = function() {
        modoVisaoGlobal = true; tecnicoAtivo = "";
        if (layerGrupo) mapa.removeLayer(layerGrupo);
        layerGrupo = L.featureGroup().addTo(mapa);
        
        let listaTotal = visualizandoHistorico ? historicoRotasMemoria : Object.keys(dadosGlobaisRotas).map(k => ({ tecnico: k, itinerario: [...dadosGlobaisRotas[k].manha, ...dadosGlobaisRotas[k].tarde] }));

        listaTotal.forEach(roteiro => {
            (roteiro.itinerario || []).forEach(cliente => {
                if (!cliente || isNaN(cliente.lat)) return;
                let corPino = cliente.status === 'sucesso' ? "#10B981" : (cliente.status === 'insucesso' ? "#EF4444" : "#64748B");
                L.marker([cliente.lat, cliente.lon], {
                    icon: L.divIcon({ className: 'custom-pin', html: `<div style="background-color: ${corPino}; border-radius: 50%; width: 22px; height: 22px; border: 2px solid white;"></div>`, iconSize: [22, 22] })
                }).bindPopup(`<b>${roteiro.tecnico}</b><br>OS: ${cliente.codigo}<br>Status: ${(cliente.status||'pendente').toUpperCase()}`).addTo(layerGrupo);
            });
        });
        if (layerGrupo.getLayers().length > 0) mapa.fitBounds(layerGrupo.getBounds(), { padding: [30, 30] });
    }

    window.limparRotas = function() { localStorage.removeItem("planilhaRotas"); window.location.reload(); }

    window.salvarHistoricoBanco = async function() {
        if (!tecnicoAtivo || rotaAtiva.length === 0) return alert("Selecione um técnico.");
        let dataInput = prompt("Data (DD/MM/AAAA):", new Date().toLocaleDateString('pt-BR')); if (!dataInput) return;
        try {
            const res = await fetch('/api/rotas', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ data: dataInput.trim(), tecnico: tecnicoAtivo, itinerario: rotaAtiva }) });
            if (res.ok) alert("✅ Roteiro salvo com sucesso no banco de dados!");
            else alert("❌ Erro ao salvar.");
        } catch(e) { alert("❌ Erro de conexão."); }
    }
</script>
</body>
</html>
