<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Totem de Entrada - NERI</title>
    <style>
        body { margin: 0; height: 100vh; background: #0F172A; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        
        #alertaChamada { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); z-index: 999; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        @keyframes piscarTexto { 0%, 100% { opacity: 1; color: #F59E0B; } 50% { opacity: 0; color: #EF4444; } }
        .texto-atencao { font-size: 60px; font-weight: 900; letter-spacing: 5px; animation: piscarTexto 1s infinite; margin-bottom: 20px; }
        #nomeChamado { font-size: 100px; color: white; margin: 0; text-transform: uppercase; text-shadow: 0 10px 30px rgba(0,0,0,0.8); }

        .relogio { font-size: 80px; font-weight: bold; color: #3B82F6; text-shadow: 0 4px 20px rgba(59, 130, 246, 0.4); margin-bottom: 10px; }
        .data-hoje { font-size: 24px; color: #94A3B8; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px; }
        .instrucao { font-size: 22px; color: #E2E8F0; background: #1E293B; padding: 20px 40px; border-radius: 12px; border: 2px dashed rgba(255,255,255,0.2); margin-bottom: 30px; }
        
        #leitorBarcode { opacity: 0; position: absolute; z-index: -1; }

        /* ========================================= */
        /* CSS DO TOAST DE BOAS VINDAS (TAMANHO GIGANTE) */
        /* ========================================= */
        #toastBoasVindas {
            position: fixed;
            top: -200px; /* Começa mais escondido para não aparecer cortado */
            left: 50%;
            transform: translateX(-50%);
            background: #1E293B;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            padding: 20px 40px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 25px;
            z-index: 99999;
            transition: top 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        #toastBoasVindas.mostrar {
            top: 40px; 
        }

        .avatar-iniciais {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 36px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            border: 4px solid rgba(255,255,255,0.2);
        }

        .toast-texto {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .toast-texto .saudacao { font-size: 22px; }
        .toast-texto .nome { color: white; font-weight: bold; font-size: 32px; margin-top: 4px; }
    </style>
</head>
<body onclick="focarLeitor()"> 

    <div id="alertaChamada">
        <div class="texto-atencao">📢 ATENÇÃO</div>
        <div id="nomeChamado">NOME DO TÉCNICO</div>
        <div style="font-size: 40px; color: #94A3B8; margin-top: 30px; font-weight: bold;">COMPARECER AO BALCÃO</div>
    </div>

    <img src="logo.svg" alt="NERI" style="height: 60px; margin-bottom: 30px; cursor: pointer;" onclick="sair()" title="Clique para Sair" onerror="this.style.display='none'">

    <div class="relogio" id="relogioDisplay">00:00:00</div>
    <div class="data-hoje" id="dataDisplay">Carregando...</div>
    <div class="instrucao">📟 Aproxime o seu crachá do leitor</div>

    <input type="text" id="leitorBarcode" autofocus autocomplete="off" placeholder="Aguardando bip...">

<script>
    const token = localStorage.getItem("token");
    if (!token) window.location.replace("/login.html");
    const sinteseVoz = window.speechSynthesis;
    
    let alertaTocando = false; 
    let historicoChamadas = new Map();
    const BLOQUEIO_REPETICAO = 8000; 
    
    let filaDeHoje = []; 
    let bloqueioGeral = false; 
    let timerToast;
    
    // --- NOVO: Radar para detectar Check-ins do Celular ---
    let idsConhecidos = new Set();
    let primeiraBusca = true;
    // ------------------------------------------------------
    
    // Guarda os rostos do banco de dados levinhos na memória
    let cacheEquipeTotem = []; 

    // Busca as fotos compactadas no banco de forma silenciosa
    async function carregarRostosTotem() {
        try {
            const res = await fetch('/api/equipe-totem', { headers: { 'Authorization': `Bearer ${token}` } });
            cacheEquipeTotem = await res.json();
        } catch (e) {}
    }

    // =========================================================
    // INICIALIZAÇÃO AUTOMÁTICA DO TOTEM
    // =========================================================
    carregarRostosTotem(); // Carrega os rostos assim que a tela abre
    setInterval(carregarRostosTotem, 60000); // Atualiza os rostos a cada 1 minuto
    setInterval(escutarServidorViaRede, 1500); // Inicia a escuta de chamadas
    
    // Forçar carregamento das vozes do sistema operacional
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }

    // Tentar colocar em tela cheia ao primeiro clique na tela (política dos navegadores)
    document.addEventListener('click', () => {
        try { document.documentElement.requestFullscreen(); } catch(e){}
    }, { once: true });

    // =========================================================
    // SISTEMA DE BOAS VINDAS COM BASE64
    // =========================================================
    function mostrarBoasVindas(nomeCompleto, jaEntrouHoje = false) {
        let toast = document.getElementById("toastBoasVindas");
        if (!toast) {
            toast = document.createElement("div");
            toast.id = "toastBoasVindas";
            document.body.appendChild(toast);
        }

        const hora = new Date().getHours();
        let textoSaudacao = "Boa noite";
        if (hora >= 5 && hora < 12) textoSaudacao = "Bom dia";
        else if (hora >= 12 && hora < 18) textoSaudacao = "Boa tarde";

        const partesNome = nomeCompleto.trim().split(" ");
        const primeiroNome = partesNome[0] || "Técnico";

        let iniciais = "";
        if (partesNome.length >= 2) iniciais = (partesNome[0][0] + partesNome[partesNome.length - 1][0]).toUpperCase();
        else iniciais = primeiroNome.substring(0, 2).toUpperCase();

        let hash = 0;
        for (let i = 0; i < nomeCompleto.length; i++) hash = nomeCompleto.charCodeAt(i) + ((hash << 5) - hash);
        const corHSL = `hsl(${hash % 360}, 70%, 50%)`;

        const pessoaBanco = cacheEquipeTotem.find(p => p.nome.toUpperCase().trim() === nomeCompleto.toUpperCase().trim());
        
        let avatarHTML = "";
        if (pessoaBanco && pessoaBanco.foto) {
            avatarHTML = `<img src="${pessoaBanco.foto}" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 4px solid rgba(255,255,255,0.2);">`;
        } else {
            avatarHTML = `<div class="avatar-iniciais" style="background-color: ${corHSL};">${iniciais}</div>`;
        }

        const corIcone = jaEntrouHoje ? "#F59E0B" : "#10B981";
        const icone = jaEntrouHoje ? "⚠️" : "✓";
        const corSaudacao = jaEntrouHoje ? "#F59E0B" : "#94A3B8";
        const subtitulo = jaEntrouHoje ? "Você já registrou entrada hoje!" : "Entrada registrada!";

        toast.innerHTML = `
            ${avatarHTML}
            <div class="toast-texto">
                <span class="saudacao" style="color: ${corSaudacao}; font-weight: bold;">${jaEntrouHoje ? 'ATENÇÃO' : textoSaudacao},</span>
                <span class="nome">${primeiroNome}! <span style="font-size: 18px; font-weight: normal; display: block; color: #CBD5E1; margin-top: 5px;">${subtitulo}</span></span>
            </div>
            <div style="color: ${corIcone}; font-size: 50px; margin-left: 20px;">${icone}</div>
        `;

        toast.classList.remove("mostrar");
        void toast.offsetWidth; 
        toast.classList.add("mostrar");

        clearTimeout(timerToast);
        timerToast = setTimeout(() => {
            toast.classList.remove("mostrar");
        }, jaEntrouHoje ? 4500 : 3000); 
    }

    function sair() {
        if (confirm("Deseja encerrar o sistema do Totem?")) {
            localStorage.clear();
            window.location.replace("/login.html");
        }
    }

    window.addEventListener('storage', (e) => {
        if (e.key === 'comandoChamadaTotem' && e.newValue) {
            const dados = JSON.parse(e.newValue);
            if (Date.now() - dados.ts < 5000) tentarTocar(dados);
        }
    });

    // =========================================================
    // ESCUTA DE REDE (Detecta Check-ins Remotos do App)
    // =========================================================
    async function escutarServidorViaRede() {
        try {
            const dataHoje = new Date().toLocaleDateString('pt-BR');
            const res = await fetch(`/api/fila/hoje?data=${encodeURIComponent(dataHoje)}`, { headers: { 'Authorization': `Bearer ${token}` }, cache: 'no-store' });
            const chamadas = await res.json();
            
            filaDeHoje = chamadas;

            // RADAR: Verifica se tem alguém novo na fila
            chamadas.forEach(c => {
                if (!idsConhecidos.has(c._id)) {
                    idsConhecidos.add(c._id);
                    // Se não for o primeiro carregamento da página, significa que alguém acabou de fazer check-in no App!
                    if (!primeiraBusca) {
                        mostrarBoasVindas(c.tecnico, false);
                    }
                }
            });
            primeiraBusca = false; // Desativa após carregar a primeira vez

            const pendente = chamadas.find(c => c.status === 'Chamando');
            if (pendente) tentarTocar(pendente);
        } catch (e) {}
    }

    function tentarTocar(pessoa) {
        if (alertaTocando) return; 
        const id = pessoa._id || pessoa.id;
        const agora = Date.now();
        const ultimaVez = historicoChamadas.get(id) || 0;
        if (agora - ultimaVez < BLOQUEIO_REPETICAO) return;
        historicoChamadas.set(id, agora);
        tocarAlerta(pessoa);
    }

    function tocarAlerta(pessoa) {
        alertaTocando = true; 
        const telaAlerta = document.getElementById('alertaChamada');
        document.getElementById('nomeChamado').innerText = pessoa.tecnico;
        telaAlerta.style.display = 'flex'; 

        const texto = `Atenção. , ${pessoa.tecnico}, favor comparecer ao balcão de atendimento.`;
        
        let fala1 = new SpeechSynthesisUtterance(texto);
        let fala2 = new SpeechSynthesisUtterance(texto);
        fala1.lang = 'pt-BR'; 
        fala2.lang = 'pt-BR';

        // --- BUSCA VOZ FEMININA EM PORTUGUÊS ---
        const vozesDisponiveis = window.speechSynthesis.getVoices();
        const vozFeminina = vozesDisponiveis.find(voz => 
            voz.lang.includes('pt-BR') && 
            (voz.name.includes('Google') || voz.name.includes('Luciana') || voz.name.includes('Maria') || voz.name.toLowerCase().includes('female'))
        ) || vozesDisponiveis.find(voz => voz.lang.includes('pt-BR')); 

        if (vozFeminina) {
            fala1.voice = vozFeminina;
            fala2.voice = vozFeminina;
        }

        let toque = new Audio('toque.mp3'); 
        toque.volume = 0.8;

        window.speechSynthesis.cancel();
        fala1.onend = () => { toque.play(); };
        toque.onended = () => { speechSynthesis.speak(fala2); };
        toque.onerror = () => { speechSynthesis.speak(fala2); }; 
        fala2.onend = () => {
            telaAlerta.style.display = 'none'; 
            setTimeout(() => { alertaTocando = false; }, 1000); 
        };
        speechSynthesis.speak(fala1);
    }

    setInterval(() => {
        const agora = new Date();
        document.getElementById("relogioDisplay").innerText = agora.toLocaleTimeString('pt-BR');
        document.getElementById("dataDisplay").innerText = agora.toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }, 1000);
    
    const inputLeitor = document.getElementById("leitorBarcode");
    function focarLeitor() { inputLeitor.focus(); }
    setInterval(focarLeitor, 2000); 

    let ultimoCodigo = "";
    let tempoUltimoBip = 0;

    inputLeitor.addEventListener("keydown", async function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            if (bloqueioGeral) return;

            const codigo = this.value.trim(); 
            this.value = ""; 
            if (!codigo) return;
            
            const agoraMs = Date.now();
            if (ultimoCodigo === codigo && (agoraMs - tempoUltimoBip < 10000)) {
                return; 
            }
            
            ultimoCodigo = codigo;
            tempoUltimoBip = agoraMs;
            bloqueioGeral = true;
            setTimeout(() => { bloqueioGeral = false; }, 1000);

            const jaEntrouHoje = filaDeHoje.some(c => c.tecnico.toUpperCase().trim() === codigo.toUpperCase().trim());
            
            mostrarBoasVindas(codigo, jaEntrouHoje);
            
            if (jaEntrouHoje) return; 

            const agora = new Date();
            const dataAtual = `${String(agora.getDate()).padStart(2, '0')}/${String(agora.getMonth() + 1).padStart(2, '0')}/${agora.getFullYear()}`;
            const horaAtual = agora.toLocaleTimeString('pt-BR', { hour12: false }).substring(0, 5); 
            
            try { 
                await fetch('/api/fila/bipar', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, 
                    body: JSON.stringify({ codigoBarras: codigo, dataBatida: dataAtual, horaBatida: horaAtual, origem: "Totem" }) 
                }); 
                
                escutarServidorViaRede();
            } catch (err) {}
        }
    });
</script>
</body>
</html>
