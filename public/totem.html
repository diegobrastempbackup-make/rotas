<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Totem de Entrada - NERI</title>
    <style>
        body { margin: 0; height: 100vh; background: #0F172A; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        
        /* TELA DE INICIALIZAÇÃO (Desbloqueio de Áudio) */
        #telaInicio { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1E293B; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.5s; }
        .btn-pulsa { background: #3B82F6; color: white; padding: 20px 40px; font-size: 24px; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; animation: pulsar 2s infinite; }
        @keyframes pulsar { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }

        /* TELA DE ALERTA PISCANDO (CHAMADA) */
        #alertaChamada { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); z-index: 999; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        @keyframes piscarTexto { 0%, 100% { opacity: 1; color: #F59E0B; } 50% { opacity: 0; color: #EF4444; } }
        .texto-atencao { font-size: 60px; font-weight: 900; letter-spacing: 5px; animation: piscarTexto 1s infinite; margin-bottom: 20px; }
        #nomeChamado { font-size: 100px; color: white; margin: 0; text-transform: uppercase; text-shadow: 0 10px 30px rgba(0,0,0,0.8); }

        .relogio { font-size: 80px; font-weight: bold; color: #3B82F6; text-shadow: 0 4px 20px rgba(59, 130, 246, 0.4); margin-bottom: 10px; }
        .data-hoje { font-size: 24px; color: #94A3B8; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px; }
        .instrucao { font-size: 22px; color: #E2E8F0; background: #1E293B; padding: 20px 40px; border-radius: 12px; border: 2px dashed rgba(255,255,255,0.2); margin-bottom: 30px; }
        
        #leitorBarcode { opacity: 0; position: absolute; z-index: -1; }
        
        .mensagem-box { height: 80px; display: flex; align-items: center; justify-content: center; width: 80%; max-width: 600px; border-radius: 12px; font-size: 24px; font-weight: bold; transition: 0.3s; opacity: 0; }
        .msg-sucesso { background: rgba(16, 185, 129, 0.2); color: #10B981; border: 1px solid #10B981; opacity: 1; }
        .msg-erro { background: rgba(239, 68, 68, 0.2); color: #EF4444; border: 1px solid #EF4444; opacity: 1; }
        .msg-atraso { background: rgba(245, 158, 11, 0.2); color: #F59E0B; border: 1px solid #F59E0B; opacity: 1; }
    </style>
</head>
<body onclick="focarLeitor()"> 

    <!-- TELA DE PROTEÇÃO (EXIGE CLIQUE PARA LIGAR O ÁUDIO DO NAVEGADOR) -->
    <div id="telaInicio" onclick="iniciarTotem()">
        <img src="logo.svg" alt="NERI" style="height: 100px; margin-bottom: 40px;" onerror="this.style.display='none'">
        <button class="btn-pulsa">TOCAR AQUI PARA INICIAR O TOTEM</button>
        <p style="color: #94A3B8; margin-top: 20px;">Isto irá ativar o sistema de voz e abrir em ecrã inteiro.</p>
    </div>

    <!-- TELA DE ALERTA PISCANDO (FICA ESCONDIDA ATÉ SER CHAMADO) -->
    <div id="alertaChamada">
        <div class="texto-atencao">📢 ATENÇÃO</div>
        <div id="nomeChamado">NOME DO TÉCNICO</div>
        <div style="font-size: 40px; color: #94A3B8; margin-top: 30px; font-weight: bold;">COMPARECER AO BALCÃO</div>
    </div>

    <img src="logo.svg" alt="NERI" style="height: 60px; margin-bottom: 30px; cursor: pointer;" onclick="sair()" title="Clique duplo para Sair" onerror="this.style.display='none'">
    
    <div class="relogio" id="relogioDisplay">00:00:00</div>
    <div class="data-hoje" id="dataDisplay">Carregando...</div>
    <div class="instrucao">📟 Aproxime o seu crachá do leitor</div>

    <input type="text" id="leitorBarcode" autofocus autocomplete="off" placeholder="Aguardando bip...">
    <div class="mensagem-box" id="caixaMensagem">Bem-vindo!</div>

<script>
    const token = localStorage.getItem("token");
    if (!token) window.location.replace("/login.html");
    const sinteseVoz = window.speechSynthesis;
    let audioLiberado = false;
    let verificacaoAtiva = false;

    function sair() {
        if (confirm("Deseja encerrar o sistema do Totem?")) {
            localStorage.clear();
            window.location.replace("/login.html");
        }
    }

    // Inicializa o Modo Quiosque (Áudio + Ecrã Inteiro)
    function iniciarTotem() {
        document.getElementById("telaInicio").style.opacity = "0";
        setTimeout(() => { document.getElementById("telaInicio").style.display = "none"; }, 500);
        
        audioLiberado = true;
        sinteseVoz.speak(new SpeechSynthesisUtterance("")); // Truque para o Chrome não bloquear as próximas falas
        
        try { document.documentElement.requestFullscreen(); } catch(e){} // Tenta forçar ecrã inteiro
        
        focarLeitor();
        
        // Liga o radar do Totem para procurar chamadas do servidor a cada 2.5 segundos
        if(!verificacaoAtiva) {
            setInterval(escutarServidor, 2500);
            verificacaoAtiva = true;
        }
    }

    // O RADAR: Vai perguntar ao servidor se há chamadas
    async function escutarServidor() {
        try {
            const res = await fetch('/api/totem/chamadas', { headers: { 'Authorization': `Bearer ${token}` } });
            const chamadasPendentes = await res.json();

            if (chamadasPendentes.length > 0) {
                tocarAlerta(chamadasPendentes[0]); // Pega o primeiro da fila que foi chamado
            }
        } catch (e) {}
    }

    // A MÁGICA VISUAL E SONORA ACONTECE AQUI
    async function tocarAlerta(pessoa) {
        // 1. Avisa logo o servidor "OK, já recebi a mensagem", para ele não repetir a chamada
        await fetch(`/api/fila/${pessoa._id}/chamada-concluida`, {
            method: 'PUT', headers: { 'Authorization': `Bearer ${token}` }
        });

        // 2. Apresenta o Ecrã Laranja a piscar com o nome gigante
        document.getElementById("nomeChamado").innerText = pessoa.tecnico;
        document.getElementById("alertaChamada").style.display = "flex";

        // 3. A Voz Sintética chama o nome
       // 3. A Voz Sintética chama o nome completo
        let fala = new SpeechSynthesisUtterance(`Atenção. , ${pessoa.tecnico}, favor comparecer ao balcão de atendimento.`);
        fala.lang = 'pt-BR';
        fala.rate = 0.85; // Fala de forma pausada e clara
        sinteseVoz.speak(fala);

        // 4. Desaparece automaticamente após 8 segundos e volta ao Relógio
        setTimeout(() => {
            document.getElementById("alertaChamada").style.display = "none";
        }, 8000);
    }

    // --- CÓDIGO NORMAL DO RELÓGIO E LEITOR MANTIDO ---
    setInterval(() => {
        const agora = new Date();
        document.getElementById("relogioDisplay").innerText = agora.toLocaleTimeString('pt-BR');
        document.getElementById("dataDisplay").innerText = agora.toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }, 1000);

    const inputLeitor = document.getElementById("leitorBarcode");
    function focarLeitor() { inputLeitor.focus(); }
    setInterval(focarLeitor, 2000); 

    function mostrarMensagem(texto, tipoClass) {
        const caixa = document.getElementById("caixaMensagem");
        caixa.innerText = texto; caixa.className = `mensagem-box ${tipoClass}`;
        setTimeout(() => { caixa.className = "mensagem-box"; }, 4000);
    }

    inputLeitor.addEventListener("keypress", async function(e) {
        if (e.key === 'Enter') {
            const codigo = this.value.trim(); this.value = ""; 
            if (!codigo) return;
            const agora = new Date();
            const dataAtual = `${String(agora.getDate()).padStart(2, '0')}/${String(agora.getMonth() + 1).padStart(2, '0')}/${agora.getFullYear()}`;
            const horaAtual = agora.toLocaleTimeString('pt-BR', { hour12: false }).substring(0, 5); 

            try {
                const res = await fetch('/api/fila/bipar', {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ codigoBarras: codigo, dataBatida: dataAtual, horaBatida: horaAtual })
                });
                const dados = await res.json();
                if (res.ok) {
                    if (dados.atrasado) mostrarMensagem(`⚠️ Bom dia, ${dados.tecnico}! ATRASO às ${horaAtual}.`, 'msg-atraso');
                    else mostrarMensagem(`✅ Bom dia, ${dados.tecnico}! Entrada às ${horaAtual}.`, 'msg-sucesso');
                } else { mostrarMensagem(`❌ Erro: ${dados.erro}`, 'msg-erro'); }
            } catch (err) {}
        }
    });
</script>
</body>
</html>
