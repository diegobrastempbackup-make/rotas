<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Totem de Entrada - NERI</title>
    <style>
        body { margin: 0; height: 100vh; background: #0F172A; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        
        #telaInicio { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1E293B; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.5s; }
        .btn-pulsa { background: #3B82F6; color: white; padding: 20px 40px; font-size: 24px; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; animation: pulsar 2s infinite; }
        @keyframes pulsar { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }

        #alertaChamada { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); z-index: 999; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        @keyframes piscarTexto { 0%, 100% { opacity: 1; color: #F59E0B; } 50% { opacity: 0; color: #EF4444; } }
        .texto-atencao { font-size: 60px; font-weight: 900; letter-spacing: 5px; animation: piscarTexto 1s infinite; margin-bottom: 20px; }
        #nomeChamado { font-size: 100px; color: white; margin: 0; text-transform: uppercase; text-shadow: 0 10px 30px rgba(0,0,0,0.8); }

        .relogio { font-size: 80px; font-weight: bold; color: #3B82F6; text-shadow: 0 4px 20px rgba(59, 130, 246, 0.4); margin-bottom: 10px; }
        .data-hoje { font-size: 24px; color: #94A3B8; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px; }
        .instrucao { font-size: 22px; color: #E2E8F0; background: #1E293B; padding: 20px 40px; border-radius: 12px; border: 2px dashed rgba(255,255,255,0.2); margin-bottom: 30px; }
        
        #leitorBarcode { opacity: 0; position: absolute; z-index: -1; }
        /* ========================================= */
/* CSS DO TOAST DE BOAS VINDAS (FOTO)        */
/* ========================================= */
.toast-saudacao {
    position: fixed;
    top: -100px;
    left: 50%;
    transform: translateX(-50%);
    background: #1E293B;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    padding: 12px 20px;
    border-radius: 50px;
    display: flex;
    align-items: center;
    gap: 15px;
    z-index: 99999;
    transition: top 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

.toast-saudacao.mostrar {
    top: 20px; 
}

.avatar-iniciais {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-weight: bold;
    font-size: 16px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    border: 2px solid rgba(255,255,255,0.2);
}

.toast-texto {
    display: flex;
    flex-direction: column;
    text-align: left;
}

.toast-texto .saudacao {
    color: #94A3B8;
    font-size: 12px;
}

.toast-texto .nome {
    color: white;
    font-weight: bold;
    font-size: 15px;
}
    </style>
</head>
<body onclick="focarLeitor()"> 

    <div id="telaInicio" onclick="iniciarTotem()">
        <img src="logo.svg" alt="NERI" style="height: 100px; margin-bottom: 40px;" onerror="this.style.display='none'">
        <button class="btn-pulsa">TOCAR AQUI PARA INICIAR O TOTEM</button>
    </div>

    <div id="alertaChamada">
        <div class="texto-atencao">📢 ATENÇÃO</div>
        <div id="nomeChamado">NOME DO TÉCNICO</div>
        <div style="font-size: 40px; color: #94A3B8; margin-top: 30px; font-weight: bold;">COMPARECER AO BALCÃO</div>
    </div>

    <!-- LOGO DE SAÍDA RESTAURADA -->
    <img src="logo.svg" alt="NERI" style="height: 60px; margin-bottom: 30px; cursor: pointer;" onclick="sair()" title="Clique para Sair" onerror="this.style.display='none'">

    <div class="relogio" id="relogioDisplay">00:00:00</div>
    <div class="data-hoje" id="dataDisplay">Carregando...</div>
    <div class="instrucao">📟 Aproxime o seu crachá do leitor</div>

    <input type="text" id="leitorBarcode" autofocus autocomplete="off" placeholder="Aguardando bip...">

<script>
    const token = localStorage.getItem("token");
    if (!token) window.location.replace("/login.html");
    const sinteseVoz = window.speechSynthesis;
    let alertaTocando = false; 
    let historicoChamadas = new Map();
    const BLOQUEIO_REPETICAO = 8000; // Impede que o mesmo áudio toque 2 vezes seguidas num espaço de 8 segundos

    // =========================================================
// SISTEMA DE BOAS VINDAS (FOTO NO TOTEM)
// =========================================================
function aoBiparEquipamento(nomeDoTecnico) {
    let fotoEncontrada = "";
    
    // Procura no banco de fotos (ignora maiúsculas/minúsculas para não dar erro)
    if (typeof bancoDeFotos !== 'undefined') {
        for (let chave in bancoDeFotos) {
            if (chave.toUpperCase() === nomeDoTecnico.toUpperCase()) {
                fotoEncontrada = bancoDeFotos[chave];
                break;
            }
        }
    }
    
    mostrarBoasVindas(nomeDoTecnico, fotoEncontrada);
}

function mostrarBoasVindas(nomeCompleto, fotoBase64 = null) {
    const hora = new Date().getHours();
    let textoSaudacao = "Boa noite";
    if (hora >= 5 && hora < 12) textoSaudacao = "Bom dia";
    else if (hora >= 12 && hora < 18) textoSaudacao = "Boa tarde";

    const partesNome = nomeCompleto.trim().split(" ");
    const primeiroNome = partesNome[0] || "Técnico";

    let avatarHTML = "";

    if (fotoBase64 && fotoBase64.trim() !== "") {
        avatarHTML = `<img src="${fotoBase64}" alt="Foto" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.2);">`;
    } else {
        let iniciais = "";
        if (partesNome.length >= 2) iniciais = (partesNome[0][0] + partesNome[partesNome.length - 1][0]).toUpperCase();
        else iniciais = primeiroNome.substring(0, 2).toUpperCase();

        let hash = 0;
        for (let i = 0; i < nomeCompleto.length; i++) hash = nomeCompleto.charCodeAt(i) + ((hash << 5) - hash);
        const corHSL = `hsl(${hash % 360}, 70%, 50%)`;
        
        avatarHTML = `<div class="avatar-iniciais" style="background-color: ${corHSL};">${iniciais}</div>`;
    }

    const toast = document.createElement("div");
    toast.className = "toast-saudacao";
    toast.innerHTML = `
        ${avatarHTML}
        <div class="toast-texto">
            <span class="saudacao">${textoSaudacao},</span>
            <span class="nome">${primeiroNome}!</span>
        </div>
        <div style="color: #10B981; font-size: 20px; margin-left: 10px;">✓</div>
    `;

    document.body.appendChild(toast);

    setTimeout(() => toast.classList.add("mostrar"), 10);
    setTimeout(() => {
        toast.classList.remove("mostrar");
        setTimeout(() => toast.remove(), 400); 
    }, 3000);
}

    function sair() {
        if (confirm("Deseja encerrar o sistema do Totem?")) {
            localStorage.clear();
            window.location.replace("/login.html");
        }
    }

    function iniciarTotem() {
        document.getElementById("telaInicio").style.display = "none";
        sinteseVoz.speak(new SpeechSynthesisUtterance("")); 
        try { document.documentElement.requestFullscreen(); } catch(e){} 
        focarLeitor();
        // A TV pesquisa a base muito rápido (a cada 1.5s)
        setInterval(escutarServidorViaRede, 1500);
    }

    // COMUNICAÇÃO INSTANTÂNEA: Se o painel e a TV estiverem no mesmo PC, é imediato!
    window.addEventListener('storage', (e) => {
        if (e.key === 'comandoChamadaTotem' && e.newValue) {
            const dados = JSON.parse(e.newValue);
            if (Date.now() - dados.ts < 5000) tentarTocar(dados);
        }
    });

    // COMUNICAÇÃO VIA REDE: A TV abandona a rota quebrada e olha direto para o status da fila!
    async function escutarServidorViaRede() {
        try {
            const dataHoje = new Date().toLocaleDateString('pt-BR');
            const res = await fetch(`/api/fila/hoje?data=${encodeURIComponent(dataHoje)}`, { headers: { 'Authorization': `Bearer ${token}` }, cache: 'no-store' });
            const chamadas = await res.json();

            // Pega apenas quem está com o status de "Chamando" gerado pelo botão lá do painel
            const pendente = chamadas.find(c => c.status === 'Chamando');
            if (pendente) tentarTocar(pendente);
        } catch (e) {}
    }

    function tentarTocar(pessoa) {
        if (alertaTocando) return; // Se a voz da moça ainda estiver a falar, aguarda.

        const id = pessoa._id || pessoa.id;
        const agora = Date.now();
        const ultimaVez = historicoChamadas.get(id) || 0;

        // Se a TV já gritou este nome há menos de 8 segundos, ignora. 
        // Isso evita duplicação entre a rede e o instantâneo.
        if (agora - ultimaVez < BLOQUEIO_REPETICAO) return;

        historicoChamadas.set(id, agora);
        tocarAlerta(pessoa);
    }

    function tocarAlerta(pessoa) {
        alertaTocando = true; // Tranca a porta do áudio

        const telaAlerta = document.getElementById('alertaChamada');
        document.getElementById('nomeChamado').innerText = pessoa.tecnico;
        telaAlerta.style.display = 'flex'; 

        const texto = `Atenção. , ${pessoa.tecnico}, favor comparecer ao balcão de atendimento.`;
        
        let fala1 = new SpeechSynthesisUtterance(texto);
        let fala2 = new SpeechSynthesisUtterance(texto);
        fala1.lang = 'pt-BR'; fala2.lang = 'pt-BR';
        let toque = new Audio('toque.mp3'); toque.volume = 0.8;

        window.speechSynthesis.cancel();

        fala1.onend = () => { toque.play(); };
        toque.onended = () => { speechSynthesis.speak(fala2); };
        toque.onerror = () => { speechSynthesis.speak(fala2); }; 

        fala2.onend = () => {
            telaAlerta.style.display = 'none'; 
            setTimeout(() => { alertaTocando = false; }, 1000); // Destranca a porta do áudio
        };

        speechSynthesis.speak(fala1);
    }

    // Relógio e Leitor
    setInterval(() => {
        const agora = new Date();
        document.getElementById("relogioDisplay").innerText = agora.toLocaleTimeString('pt-BR');
        document.getElementById("dataDisplay").innerText = agora.toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }, 1000);
    const inputLeitor = document.getElementById("leitorBarcode");
    function focarLeitor() { inputLeitor.focus(); }
    setInterval(focarLeitor, 2000); 

    inputLeitor.addEventListener("keypress", async function(e) {
        if (e.key === 'Enter') {
            const codigo = this.value.trim(); this.value = ""; 
            if (!codigo) return;
            
            // 1. CHAMA O CARD DE BOAS VINDAS COM A FOTO NA HORA!
            aoBiparEquipamento(codigo);
            
            const agora = new Date();
            const dataAtual = `${String(agora.getDate()).padStart(2, '0')}/${String(agora.getMonth() + 1).padStart(2, '0')}/${agora.getFullYear()}`;
            const horaAtual = agora.toLocaleTimeString('pt-BR', { hour12: false }).substring(0, 5); 
            
            // 2. Continua o processo de envio para a base de dados
            try { await fetch('/api/fila/bipar', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ codigoBarras: codigo, dataBatida: dataAtual, horaBatida: horaAtual }) }); } catch (err) {}
        }
    });
</script>

<!-- IMPORTAÇÃO DO SEU BANCO DE FOTOS ANTES DE FECHAR O BODY -->
<script src="bancoDeFotos.js"></script>
</body>
</html>
